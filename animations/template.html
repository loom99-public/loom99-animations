<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Template - loom99</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        /* Accessibility: Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="animation" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
            <!-- Animation content goes here -->
        </svg>
    </div>

    <script>
        // ===== SHARED EASING FUNCTIONS =====

        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        function easeInQuart(t) {
            return t * t * t * t;
        }

        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function easeOutElastic(t) {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        }

        // ===== ANIMATION IMPLEMENTATION =====

        const svg = document.getElementById('animation');
        let startTime = null;

        // Check if user prefers reduced motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            // Animation logic goes here

            requestAnimationFrame(animate);
        }

        function restart() {
            startTime = null;
            // Reset animation state here
            requestAnimationFrame(animate);
        }

        // Start animation (or show final state if reduced motion)
        if (prefersReducedMotion) {
            // Show final state immediately
        } else {
            requestAnimationFrame(animate);
        }

        // Click to restart
        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
