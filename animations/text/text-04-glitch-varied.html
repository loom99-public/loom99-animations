<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Glitch Animation (Varied)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 100%; max-width: 1000px; padding: 20px; position: relative; }
        .text-container { position: relative; text-align: center; }
        .text { font-size: 80px; font-weight: 900; line-height: 1.2; position: relative; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        .line { display: block; }
        .line1 { color: #ff2d2d; }
        .line2 { color: #ff6b00; }
        .line3 { color: #ffdd00; }
        .glitch-layer { position: absolute; top: 0; left: 0; right: 0; opacity: 0; mix-blend-mode: screen; }
        .glitch-r { color: #ff0000; animation: glitch-r 0.1s infinite; }
        .glitch-g { color: #00ff00; animation: glitch-g 0.15s infinite; }
        .glitch-b { color: #0000ff; animation: glitch-b 0.12s infinite; }
        @keyframes glitch-r { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(3px, -2px); } 66% { transform: translate(-2px, 1px); } }
        @keyframes glitch-g { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(-2px, 2px); } 66% { transform: translate(1px, -3px); } }
        @keyframes glitch-b { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(2px, 3px); } 66% { transform: translate(-3px, -1px); } }
        .scanline { position: absolute; top: 0; left: 0; right: 0; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 0, 0.03) 2px, rgba(0, 255, 0, 0.03) 4px); pointer-events: none; opacity: 0; }
        @media (prefers-reduced-motion: reduce) { .glitch-layer, .scanline { display: none !important; } .text { animation: none !important; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div>
            <div class="glitch-layer glitch-r"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="glitch-layer glitch-g"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="glitch-layer glitch-b"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="scanline"></div>
        </div>
    </div>
    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const Random = { range: (min, max) => min + Math.random() * (max - min), pick: (arr) => arr[Math.floor(Math.random() * arr.length)], vary: (base, v) => base + Random.range(-v, v) };
        const modes = [
            { name: 'intense', rgbOffset: [4, -3, 2], jitter: 12, scanOp: 0.5 },
            { name: 'subtle', rgbOffset: [2, -1, 1], jitter: 5, scanOp: 0.3 },
            { name: 'wild', rgbOffset: [6, -5, 4], jitter: 18, scanOp: 0.7 }
        ];

        // Variables that will be regenerated on each restart
        let mode;
        let config;

        function initializeParameters() {
            mode = Random.pick(modes);
            config = { hueShift: Random.range(-15, 15), jitterMod: Random.range(0.8, 1.2) };
            console.log('Glitch mode:', mode.name);

            // Apply color shifts
            document.querySelectorAll('.line1').forEach(el => el.style.color = `hsl(${config.hueShift}, 100%, 59%)`);
            document.querySelectorAll('.line2').forEach(el => el.style.color = `hsl(${25 + config.hueShift}, 100%, 50%)`);
            document.querySelectorAll('.line3').forEach(el => el.style.color = `hsl(${50 + config.hueShift}, 100%, 50%)`);
        }

        if (!prefersReducedMotion) {
            const text = document.querySelector('.text');
            const glitchLayers = document.querySelectorAll('.glitch-layer');
            const scanline = document.querySelector('.scanline');
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let startTime = null;
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const totalDuration = 2000; const glitchDuration = 1200;
            const EXIT_DURATION = 250;

            function easeInCubic(t) {
                return t * t * t;
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    if (elapsed < glitchDuration) {
                        const intensity = 1 - (elapsed / glitchDuration);
                        glitchLayers.forEach(layer => { layer.style.opacity = intensity * 0.7; });
                        scanline.style.opacity = intensity * mode.scanOp;
                        const jitterX = (Math.random() - 0.5) * mode.jitter * intensity * config.jitterMod;
                        const jitterY = (Math.random() - 0.5) * mode.jitter * intensity * config.jitterMod;
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px) skewX(${(Math.random() - 0.5) * 5 * intensity}deg)`;
                        requestAnimationFrame(animate);
                    } else if (elapsed < totalDuration) {
                        const stabilize = (elapsed - glitchDuration) / (totalDuration - glitchDuration);
                        glitchLayers.forEach(layer => { layer.style.opacity = (1 - stabilize) * 0.3; });
                        scanline.style.opacity = (1 - stabilize) * 0.3;
                        const jitterX = (Math.random() - 0.5) * 3 * (1 - stabilize);
                        const jitterY = (Math.random() - 0.5) * 3 * (1 - stabilize);
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px)`;
                        requestAnimationFrame(animate);
                    } else {
                        glitchLayers.forEach(layer => { layer.style.opacity = 0; });
                        scanline.style.opacity = 0; text.style.transform = 'none';
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(exitProgress);

                    // Intense glitch burst
                    const intensity = 1;
                    glitchLayers.forEach(layer => { layer.style.opacity = intensity * 0.9 * (1 - exitProgress); });
                    scanline.style.opacity = intensity * mode.scanOp * (1 - exitProgress);
                    const jitterX = (Math.random() - 0.5) * mode.jitter * 2 * intensity;
                    const jitterY = (Math.random() - 0.5) * mode.jitter * 2 * intensity;
                    text.style.transform = `translate(${jitterX}px, ${jitterY}px) skewX(${(Math.random() - 0.5) * 15 * intensity}deg)`;
                    text.style.opacity = 1 - eased;

                    if (exitProgress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
                initializeParameters();  // Regenerate all random parameters
                startTime = null; exitStartTime = null; text.style.transform = 'none'; text.style.opacity = '1';
                glitchLayers.forEach(layer => { layer.style.opacity = 0; });
                scanline.style.opacity = 0; requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            initializeParameters();
        }
    </script>
</body>
</html>
