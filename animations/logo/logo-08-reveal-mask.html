<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Reveal Mask Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            svg rect {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>

                <!-- Enhanced mask with gradient edge -->
                <mask id="wipe">
                    <rect id="maskRect" x="-650" y="0" width="650" height="200" fill="white"/>
                    <!-- Gradient edge for smooth reveal -->
                    <rect id="maskGradient" x="-700" y="0" width="50" height="200">
                        <animate id="gradientAnim" attributeName="fill" dur="0.1s" fill="freeze" from="url(#edgeGradient)" to="url(#edgeGradient)"/>
                    </rect>
                </mask>

                <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:black;stop-opacity:0" />
                    <stop offset="100%" style="stop-color:white;stop-opacity:1" />
                </linearGradient>

                <!-- Glow filter for reveal edge -->
                <filter id="revealGlow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <g mask="url(#wipe)">
                <path d="M 40 40 L 40 160 L 100 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
                <circle cx="150" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
                <circle cx="240" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
                <path d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #ff2d75)"/>
                <path d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
                <path d="M 540 70 C 540 45, 580 45, 580 70 C 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
            </g>

            <!-- Reveal glow line that follows the mask edge -->
            <line id="glowLine" x1="0" y1="0" x2="0" y2="200" stroke="url(#logoGradient)" stroke-width="3" opacity="0" filter="url(#revealGlow)"/>
        </svg>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const maskRect = document.getElementById('maskRect');
            const maskGradient = document.getElementById('maskGradient');
            const glowLine = document.getElementById('glowLine');

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            const EXIT_DURATION = 250;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            function easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
            }

            let startTime = null;
            const ENTRANCE_DURATION = 1800;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / ENTRANCE_DURATION);
                    const eased = easeInOutQuart(progress);

                    const x = -650 + (650 * eased);
                    maskRect.setAttribute('x', x);
                    maskGradient.setAttribute('x', x - 50);

                    // Animated glow line at reveal edge
                    glowLine.setAttribute('x1', x + 650);
                    glowLine.setAttribute('x2', x + 650);
                    glowLine.setAttribute('opacity', Math.sin(progress * Math.PI) * 0.8);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        glowLine.setAttribute('opacity', 0);
                        animationState = 'hold';
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    // Reverse wipe - wipe away from right to left
                    const x = 0 + (650 * eased);
                    maskRect.setAttribute('x', x);
                    maskGradient.setAttribute('x', x - 50);

                    // Glow line during exit
                    glowLine.setAttribute('x1', x);
                    glowLine.setAttribute('x2', x);
                    glowLine.setAttribute('opacity', (1 - progress) * 0.8);

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
                animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
                startTime = null;
                animationState = 'entrance';
                maskRect.setAttribute('x', -650);
                maskGradient.setAttribute('x', -700);
                glowLine.setAttribute('opacity', 0);
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            const maskRect = document.getElementById('maskRect');
            const maskGradient = document.getElementById('maskGradient');
            maskRect.setAttribute('x', 0);
            maskGradient.setAttribute('x', -50);
        }
    </script>
</body>
</html>
