<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Drawing Engine Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
        }

        .controls label {
            display: block;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        @media (prefers-reduced-motion: reduce) {
            .line {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <strong>Line Drawing Engine Test</strong><br>
        <label>
            <input type="radio" name="variance" value="none" checked> Original (none)
        </label>
        <label>
            <input type="radio" name="variance" value="moderate"> Varied (moderate)
        </label>
        <label>
            <input type="radio" name="variance" value="heavy"> Procedural (heavy)
        </label>
        <label>
            <input type="radio" name="target" value="logo" checked> Logo
        </label>
        <label>
            <input type="radio" name="target" value="text"> Text
        </label>
        <button id="restart">Restart</button>
    </div>

    <div class="container">
        <svg id="logo" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div class="info">
        State: <span id="state">-</span><br>
        Mode: <span id="mode">-</span><br>
        Click to advance to exit
    </div>

    <!-- NOTE: In production, this would be compiled from TypeScript -->
    <script type="module">
        // This is a MOCK implementation to demonstrate the concept
        // Real implementation would import from compiled engines/LineDrawingEngine.js

        console.warn('⚠️ This is a MOCK implementation - engines need to be compiled from TypeScript first');

        const svg = document.getElementById('logo');
        const stateDisplay = document.getElementById('state');
        const modeDisplay = document.getElementById('mode');
        const restartBtn = document.getElementById('restart');

        // URL params for easy testing
        const urlParams = new URLSearchParams(window.location.search);
        const variance = urlParams.get('variance') || 'none';
        const target = urlParams.get('target') || 'logo';

        // Set radio buttons from URL params
        document.querySelector(`input[name="variance"][value="${variance}"]`).checked = true;
        document.querySelector(`input[name="target"][value="${target}"]`).checked = true;

        // Mock configuration generator
        function generateConfig() {
            const variance = document.querySelector('input[name="variance"]:checked').value;
            const target = document.querySelector('input[name="target"]:checked').value;

            const CYAN = '#00d4ff';
            const PURPLE = '#7b2ff7';
            const PINK = '#ff2d75';

            const baseLines = target === 'logo' ? [
                {
                    startX: -100, startY: 100,
                    points: [
                        {x: 40, y: 40},
                        {x: 40, y: 160},
                        {x: 100, y: 160}
                    ],
                    color: CYAN,
                    delay: 0
                },
                {
                    startX: -100, startY: 100,
                    points: [
                        {x: 150, y: 60},
                        {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 150, y: 140},
                        {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 150, y: 60}
                    ],
                    color: PURPLE,
                    delay: 80
                },
                // ... more lines would be here
            ] : [
                // Text paths would be different
                { startX: -100, startY: 100, points: [{x: 50, y: 100}], color: CYAN, delay: 0 }
            ];

            const config = {
                viewBox: { width: 600, height: 200 },
                variance: variance,
                timing: {
                    enabled: variance !== 'none',
                    duration: 400,
                    stagger: 80,
                    foldDuration: 180,
                    holdDuration: 2000,
                    exitDuration: 250,
                    durationVariance: variance === 'heavy' ? 0.5 : (variance === 'moderate' ? 0.15 : 0),
                    staggerVariance: variance === 'heavy' ? 0.6 : (variance === 'moderate' ? 0.2 : 0)
                },
                colors: {
                    enabled: variance !== 'none',
                    hueShift: variance === 'heavy' ? randomRange(-60, 60) : (variance === 'moderate' ? randomRange(-15, 15) : 0)
                },
                motion: {
                    enabled: variance !== 'none',
                    randomStart: variance === 'heavy',
                    mode: variance === 'moderate' ? randomPick(['converge', 'cascade', 'diagonal']) : 'converge'
                },
                effects: {
                    enabled: variance !== 'none',
                    strokeWidth: 12,
                    strokeVariance: variance === 'heavy' ? 5 : (variance === 'moderate' ? 1.5 : 0),
                    glowRadius: 8,
                    glowVariance: variance === 'heavy' ? 10 : (variance === 'moderate' ? 2 : 0)
                },
                lines: baseLines,
                loop: true,
                prefersReducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
            };

            modeDisplay.textContent = variance + ' / ' + target;
            return config;
        }

        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function randomPick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Mock engine (simplified version)
        class MockLineDrawingEngine {
            constructor(svg, config) {
                this.svg = svg;
                this.config = config;
                this.state = 'entrance';
                console.log('Created engine with config:', config);
            }

            start() {
                this.updateState('entrance');
                console.log('Engine started');
            }

            startExit() {
                this.updateState('exit');
                console.log('Starting exit');
            }

            restart() {
                this.updateState('entrance');
                console.log('Restarting');
            }

            getState() {
                return this.state;
            }

            updateState(newState) {
                this.state = newState;
                stateDisplay.textContent = newState;
            }

            destroy() {
                console.log('Engine destroyed');
            }
        }

        let engine = null;

        function initEngine() {
            if (engine) {
                engine.destroy();
            }

            const config = generateConfig();
            engine = new MockLineDrawingEngine(svg, config);
            engine.start();
        }

        // Initialize
        initEngine();

        // Event listeners
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                initEngine();
            });
        });

        restartBtn.addEventListener('click', () => {
            if (engine) {
                // For varied/heavy, regenerate config
                if (engine.config.variance !== 'none') {
                    initEngine();
                } else {
                    engine.restart();
                }
            }
        });

        svg.addEventListener('click', () => {
            if (engine && engine.getState() === 'hold') {
                engine.startExit();
            }
        });

        console.log('%c📝 Note: This template demonstrates the ENGINE CONCEPT', 'font-size: 14px; color: #00d4ff');
        console.log('%cTo see it working, compile TypeScript engines first:', 'font-size: 12px');
        console.log('%c  cd src/engines && tsc LineDrawingEngine.ts', 'font-size: 11px; color: #888');
    </script>
</body>
</html>
