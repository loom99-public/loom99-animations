<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Particle Animation (Procedural)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (prefers-reduced-motion: reduce) {
            canvas {
                display: none;
            }
        }

        .reduced-motion-text {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #ff2d2d, #ff6b00, #ffdd00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-text {
                display: block;
            }
        }

        /* Load fonts for canvas rendering */
        @font-face {
            font-family: 'Anton';
            src: url('../../fonts/Anton-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Roboto';
            src: url('../../fonts/Roboto-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Oswald';
            src: url('../../fonts/Oswald-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Bangers';
            src: url('../../fonts/Bangers-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Bungee';
            src: url('../../fonts/Bungee-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Black Ops One';
            src: url('../../fonts/BlackOpsOne-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Permanent Marker';
            src: url('../../fonts/PermanentMarker-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Press Start 2P';
            src: url('../../fonts/PressStart2P-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">DO MORE NOW</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Read URL parameters from gallery editor
        const urlParams = new URLSearchParams(window.location.search);
        const paramDuration = urlParams.get('duration');
        const paramHueShift = urlParams.get('hueShift');
        const paramHoldDuration = urlParams.get('holdDuration');


        if (prefersReducedMotion) {
            // Skip animation for reduced motion
        } else {
            // Random utilities
            const Random = {
                range: (min, max) => min + Math.random() * (max - min),
                int: (min, max) => Math.floor(Random.range(min, max + 1)),
                pick: (arr) => arr[Random.int(0, arr.length - 1)],
                vary: (base, variance) => base + Random.range(-variance, variance),
                varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
            };

            // Color utilities
            const ColorRandom = {
                baseColors: {
                    red: { h: 0, s: 100, l: 59 },
                    orange: { h: 25, s: 100, l: 50 },
                    yellow: { h: 50, s: 100, l: 50 }
                },
                shiftColor: (hsl, hueShift, satShift, lightShift) => ({
                    h: (hsl.h + hueShift + 360) % 360,
                    s: Math.max(0, Math.min(100, hsl.s + satShift)),
                    l: Math.max(0, Math.min(100, hsl.l + lightShift))
                }),
                toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
            };

            // Easing functions
            const easingFunctions = [
                t => t,
                t => 1 - Math.pow(1 - t, 3),
                t => t * t * t,
                t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
                t => t * (2 - t),
                t => 1 - Math.cos((t * Math.PI) / 2)
            ];

            // Set canvas size
            canvas.width = 1000;
            canvas.height = 300;

            // Variables that will be regenerated on each restart
            let config;
            let palette;
            let selectedEasing;
            let particles;
            let baseDuration;
            let duration;
            let currentText = 'DO MORE NOW';
            let currentFontFamily = 'Anton, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';

            class Particle {
                constructor(targetX, targetY, color) {
                    // Wild random start positions
                    const startModes = [
                        () => ({ x: Random.range(-200, canvas.width + 200), y: Random.range(-200, canvas.height + 200) }),
                        () => ({ x: canvas.width / 2, y: canvas.height / 2 }),
                        () => ({ x: Random.range(0, canvas.width), y: -Random.range(50, 200) }),
                        () => ({ x: -Random.range(50, 200), y: Random.range(0, canvas.height) }),
                        () => ({ x: canvas.width + Random.range(50, 200), y: Random.range(0, canvas.height) })
                    ];
                    const start = Random.pick(startModes)();

                    this.startX = start.x;
                    this.startY = start.y;

                    // Target position (letter position)
                    this.targetX = targetX;
                    this.targetY = targetY;

                    this.x = this.startX;
                    this.y = this.startY;
                    this.color = color;
                    this.size = Random.vary(3, config.particles.sizeVariance);
                    this.opacity = 0;
                    this.glow = Random.vary(10, config.particles.glowVariance);

                    // Individual timing variation
                    this.delay = config.particles.wild ? Random.range(0, 0.3) : 0;
                    this.speedMod = config.particles.wild ? Random.range(0.7, 1.3) : 1;
                }

                update(progress) {
                    // Apply individual delay and speed
                    const adjustedProgress = Math.max(0, Math.min(1, (progress - this.delay) * this.speedMod));
                    const eased = selectedEasing(adjustedProgress);

                    this.x = this.startX + (this.targetX - this.startX) * eased;
                    this.y = this.startY + (this.targetY - this.startY) * eased;

                    // Fade in during movement
                    this.opacity = Math.min(1, adjustedProgress * 2);
                }

                draw() {
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = Math.max(0, this.glow);
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            // Function to sample points from text
            function getTextPoints(text, x, y, fontSize, fontFamily, spacing = 6) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tempCtx.font = `bold ${fontSize}px ${fontFamily}`;
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillText(text, x, y);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const points = [];

                for (let py = 0; py < imageData.height; py += spacing) {
                    for (let px = 0; px < imageData.width; px += spacing) {
                        const index = (py * imageData.width + px) * 4;
                        const alpha = imageData.data[index + 3];

                        if (alpha > 128) {
                            points.push({ x: px, y: py });
                        }
                    }
                }

                return points;
            }

            function initializeParameters() {
                // Randomization config (heavy)
                config = {
                    timing: {
                        enabled: true,
                        durationVariance: 0.5,
                        speed: Random.range(0.5, 2)
                    },
                    colors: {
                        enabled: true,
                        hueShift: Random.range(-60, 60),
                        satShift: Random.range(-30, 30),
                        lightShift: Random.range(-15, 15)
                    },
                    particles: {
                        sizeVariance: 2,
                        spacing: Random.int(4, 9),
                        glowVariance: 8,
                        wild: true
                    }
                };

                // Apply wild color shifts
                palette = config.colors.enabled ? {
                    red: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.red,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    )),
                    orange: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.orange,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    )),
                    yellow: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.yellow,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    ))
                } : {
                    red: '#ff2d2d',
                    orange: '#ff6b00',
                    yellow: '#ffdd00'
                };

                // Randomize easing function
                selectedEasing = Random.pick(easingFunctions);

                // Create particles array
                particles = [];

                // Parse text into words
                const words = currentText.split(' ').filter(w => w.trim().length > 0);
                const colors = [palette.red, palette.orange, palette.yellow];

                words.forEach((word, index) => {
                    const color = colors[index % colors.length];
                    const y = 90 + index * 80;
                    const fontSize = index === 1 ? 60 : 80; // Middle word smaller
                    const x = index === 1 ? 100 : 50;

                    const points = getTextPoints(word, x, y, fontSize, currentFontFamily, config.particles.spacing);
                    points.forEach(point => {
                        particles.push(new Particle(point.x, point.y, color));
                    });
                });

                // Calculate duration
                baseDuration = Random.range(1000, 3000);
                duration = baseDuration;
            }

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = paramHoldDuration ? parseInt(paramHoldDuration) : 2000;
            const EXIT_DURATION = 250;

            let startTime = null;

            function easeInCubic(t) {
                return t * t * t;
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                // Clear canvas
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (animationState === 'entrance') {
                    const progress = Math.min(1, (elapsed * config.timing.speed) / duration);

                    // Update and draw particles
                    particles.forEach(particle => {
                        particle.update(progress);
                        particle.draw();
                    });

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                        requestAnimationFrame(animate);
                    }
                } else if (animationState === 'hold') {
                    // Draw particles at final positions
                    particles.forEach(particle => {
                        particle.update(1);
                        particle.draw();
                    });
                    requestAnimationFrame(animate);
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(exitProgress);

                    // Scatter particles outward
                    particles.forEach(particle => {
                        const dx = particle.targetX - canvas.width / 2;
                        const dy = particle.targetY - canvas.height / 2;
                        const angle = Math.atan2(dy, dx);
                        const scatterDist = 800 * eased;

                        particle.x = particle.targetX + Math.cos(angle) * scatterDist;
                        particle.y = particle.targetY + Math.sin(angle) * scatterDist;
                        particle.opacity = 1 - eased;
                        particle.draw();
                    });

                    if (exitProgress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
                initializeParameters();  // Regenerate all random parameters
                startTime = null;
                exitStartTime = null;
                requestAnimationFrame(animate);
            }

            // Listen for messages from parent (gallery editor)
            window.addEventListener('message', function(event) {
                // Validate origin - allow same origin and localhost dev servers
                const allowedOrigins = [
                    window.location.origin,
                    "http://localhost:8888",
                    "http://127.0.0.1:8888",
                    "null"  // file:// protocol for local development
                ];

                if (!allowedOrigins.includes(event.origin)) {
                    console.warn("Rejected postMessage from unauthorized origin:", event.origin);
                    return;
                }

                if (event.data && event.data.type === 'updateText') {
                    const text = event.data.text || 'DO MORE NOW';
                    const fontFamily = event.data.fontFamily || 'Anton';

                    console.log('Updating particles with text:', text, 'font:', fontFamily);

                    // Update current text and font
                    currentText = text;
                    currentFontFamily = `${fontFamily}, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;

                    // Restart animation with new text
                    restart();
                }
            });

            // Initial setup
            initializeParameters();
            requestAnimationFrame(animate);
            canvas.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
