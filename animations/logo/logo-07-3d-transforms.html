<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - 3D Transform Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1500px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            transform-style: preserve-3d;
        }

        svg {
            width: 100%;
            height: auto;
            transform-style: preserve-3d;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
        }

        @media (prefers-reduced-motion: reduce) {
            body { perspective: none; }
            .container,
            svg {
                transform: none !important;
                transform-style: flat !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>

            <path d="M 40 40 L 40 160 L 100 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
            <circle cx="150" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
            <circle cx="240" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
            <path d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #ff2d75)"/>
            <path d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
            <path d="M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
        </svg>
    </div>

    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const svg = document.getElementById('svg');

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            function easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
            }

            let startTime = null;
            const ENTRANCE_DURATION = 2500;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / ENTRANCE_DURATION);
                    const eased = easeInOutQuart(progress);

                    // More dramatic rotation - start from fully flipped
                    const rotateY = 360 * (1 - eased);
                    const rotateX = 45 * Math.sin(progress * Math.PI);
                    const rotateZ = 20 * Math.sin(progress * Math.PI * 2);

                    // Add depth with translateZ
                    const translateZ = -200 * (1 - eased);
                    const scale = 0.5 + 0.5 * eased;

                    svg.style.transform = `
                        translateZ(${translateZ}px)
                        rotateY(${rotateY}deg)
                        rotateX(${rotateX}deg)
                        rotateZ(${rotateZ}deg)
                        scale(${scale})
                    `;
                    svg.style.opacity = eased;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    // Dramatic flip away and recede
                    const rotateY = 360 * eased;
                    const rotateX = -60 * eased;
                    const rotateZ = 30 * eased;
                    const translateZ = -300 * eased;
                    const scale = 1 - 0.5 * eased;

                    svg.style.transform = `
                        translateZ(${translateZ}px)
                        rotateY(${rotateY}deg)
                        rotateX(${rotateX}deg)
                        rotateZ(${rotateZ}deg)
                        scale(${scale})
                    `;
                    svg.style.opacity = 1 - eased;

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                svg.style.opacity = 0;
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
