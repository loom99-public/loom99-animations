<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Glitch Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            position: relative;
        }

        .text-container {
            position: relative;
            text-align: center;
        }

        .text {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            position: relative;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .line {
            display: block;
        }

        .line1 { color: #ff2d2d; }
        .line2 { color: #ff6b00; }
        .line3 { color: #ffdd00; }

        .glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            opacity: 0;
            mix-blend-mode: screen;
        }

        .glitch-r {
            color: #ff0000;
        }

        .glitch-g {
            color: #00ff00;
        }

        .glitch-b {
            color: #0000ff;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 0, 0.06) 2px,
                rgba(0, 255, 0, 0.06) 4px
            );
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        .corruption-bars {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }

        .corruption-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 255, 0.8);
            mix-blend-mode: screen;
        }

        @media (prefers-reduced-motion: reduce) {
            .glitch-layer,
            .scanline,
            .corruption-bars {
                display: none !important;
            }
            .text {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="text">
                <span class="line line1">DO</span>
                <span class="line line2">MORE</span>
                <span class="line line3">NOW</span>
            </div>

            <div class="glitch-layer glitch-r">
                <div class="text">
                    <span class="line line1">DO</span>
                    <span class="line line2">MORE</span>
                    <span class="line line3">NOW</span>
                </div>
            </div>

            <div class="glitch-layer glitch-g">
                <div class="text">
                    <span class="line line1">DO</span>
                    <span class="line line2">MORE</span>
                    <span class="line line3">NOW</span>
                </div>
            </div>

            <div class="glitch-layer glitch-b">
                <div class="text">
                    <span class="line line1">DO</span>
                    <span class="line line2">MORE</span>
                    <span class="line line3">NOW</span>
                </div>
            </div>

            <div class="scanline"></div>
            <div class="corruption-bars"></div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 300;

            const text = document.querySelector('.text');
            const glitchLayers = document.querySelectorAll('.glitch-layer');
            const scanline = document.querySelector('.scanline');
            const corruptionBars = document.querySelector('.corruption-bars');

            // Create corruption bars
            for (let i = 0; i < 6; i++) {
                const bar = document.createElement('div');
                bar.className = 'corruption-bar';
                corruptionBars.appendChild(bar);
            }

            const bars = corruptionBars.querySelectorAll('.corruption-bar');

            let startTime = null;
            const totalDuration = 2000;
            const glitchDuration = 1200;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    if (elapsed < glitchDuration) {
                        // Intense glitch phase
                        const intensity = 1 - (elapsed / glitchDuration);

                        glitchLayers.forEach(layer => {
                            layer.style.opacity = intensity * 0.85;

                            // More dramatic RGB separation
                            const tx = (Math.random() - 0.5) * 40 * intensity;
                            const ty = (Math.random() - 0.5) * 40 * intensity;
                            const skew = (Math.random() - 0.5) * 12 * intensity;
                            layer.style.transform = `translate(${tx}px, ${ty}px) skewX(${skew}deg)`;
                        });

                        scanline.style.opacity = intensity * 0.7;

                        // Corruption bars
                        bars.forEach(bar => {
                            if (Math.random() > 0.65) {
                                bar.style.top = `${Math.random() * 100}%`;
                                bar.style.height = `${2 + Math.random() * 8}px`;
                                bar.style.opacity = intensity * 0.95;
                            } else {
                                bar.style.opacity = 0;
                            }
                        });

                        // Random position jitter on main text
                        const jitterX = (Math.random() - 0.5) * 15 * intensity;
                        const jitterY = (Math.random() - 0.5) * 15 * intensity;
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px)`;

                        // Random skew
                        const skewX = (Math.random() - 0.5) * 8 * intensity;
                        text.style.transform += ` skewX(${skewX}deg)`;

                        requestAnimationFrame(animate);
                    } else if (elapsed < totalDuration) {
                        // Stabilizing phase
                        const stabilize = (elapsed - glitchDuration) / (totalDuration - glitchDuration);

                        glitchLayers.forEach(layer => {
                            layer.style.opacity = (1 - stabilize) * 0.4;

                            const tx = (Math.random() - 0.5) * 10 * (1 - stabilize);
                            const ty = (Math.random() - 0.5) * 10 * (1 - stabilize);
                            layer.style.transform = `translate(${tx}px, ${ty}px)`;
                        });

                        scanline.style.opacity = (1 - stabilize) * 0.35;

                        bars.forEach(bar => {
                            bar.style.opacity = (1 - stabilize) * 0.5;
                        });

                        // Reduce jitter
                        const jitterX = (Math.random() - 0.5) * 4 * (1 - stabilize);
                        const jitterY = (Math.random() - 0.5) * 4 * (1 - stabilize);
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px)`;

                        requestAnimationFrame(animate);
                    } else {
                        // Final stable state
                        glitchLayers.forEach(layer => {
                            layer.style.opacity = 0;
                            layer.style.transform = 'none';
                        });
                        scanline.style.opacity = 0;
                        bars.forEach(bar => {
                            bar.style.opacity = 0;
                        });
                        text.style.transform = 'none';
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);

                    // Intense glitch effect that increases
                    const intensity = progress;

                    glitchLayers.forEach(layer => {
                        layer.style.opacity = intensity * 1.2;

                        const tx = (Math.random() - 0.5) * 50 * intensity;
                        const ty = (Math.random() - 0.5) * 50 * intensity;
                        const skew = (Math.random() - 0.5) * 25 * intensity;
                        layer.style.transform = `translate(${tx}px, ${ty}px) skewX(${skew}deg)`;
                    });

                    scanline.style.opacity = intensity;

                    // Extreme corruption
                    bars.forEach(bar => {
                        bar.style.top = `${Math.random() * 100}%`;
                        bar.style.height = `${4 + Math.random() * 12}px`;
                        bar.style.opacity = intensity;
                    });

                    // Extreme jitter and distortion
                    const jitterX = (Math.random() - 0.5) * 40 * intensity;
                    const jitterY = (Math.random() - 0.5) * 40 * intensity;
                    const skewX = (Math.random() - 0.5) * 30 * intensity;
                    text.style.transform = `translate(${jitterX}px, ${jitterY}px) skewX(${skewX}deg)`;

                    // Fade out
                    text.style.opacity = 1 - progress;
                    glitchLayers.forEach(layer => {
                        layer.style.opacity = intensity * 1.2 * (1 - progress);
                    });

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                text.style.transform = 'none';
                text.style.opacity = 1;
                glitchLayers.forEach(layer => {
                    layer.style.opacity = 0;
                    layer.style.transform = 'none';
                });
                scanline.style.opacity = 0;
                bars.forEach(bar => {
                    bar.style.opacity = 0;
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
