<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Particle Animation (Procedural)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { width: 100%; max-width: 800px; padding: 20px; }
        canvas { width: 100%; height: auto; display: block; }
        @media (prefers-reduced-motion: reduce) {
            canvas { display: none; }
        }
        .reduced-motion-text {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-text { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">loom99</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            canvas.width = 600;
            canvas.height = 200;

            const Random = {
                range: (min, max) => min + Math.random() * (max - min),
                int: (min, max) => Math.floor(Random.range(min, max + 1)),
                pick: (arr) => arr[Random.int(0, arr.length - 1)],
                varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
            };

            // Variables that will be regenerated on each restart
            let config;
            let easing;
            let particles;
            let colors;
            let startTime;

            class Particle {
                constructor(targetX, targetY, color) {
                    const patterns = [
                        () => {
                            const angle = Math.random() * Math.PI * 2;
                            const distance = Random.range(300, 800);
                            return {
                                x: canvas.width / 2 + Math.cos(angle) * distance,
                                y: canvas.height / 2 + Math.sin(angle) * distance
                            };
                        },
                        () => ({ x: Random.range(-200, canvas.width + 200), y: Random.range(-400, -50) }),
                        () => ({ x: Random.range(-400, -50), y: Random.range(-100, canvas.height + 100) }),
                        () => ({ x: Random.range(canvas.width + 50, canvas.width + 400), y: Random.range(-100, canvas.height + 100) })
                    ];
                    const start = Random.pick(patterns)();

                    this.startX = start.x;
                    this.startY = start.y;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.x = this.startX;
                    this.y = this.startY;
                    this.color = color;
                    this.size = Random.range(config.particles.sizeRange[0], config.particles.sizeRange[1]);
                    this.opacity = 0;
                    this.phase = Math.random() * Math.PI * 2;
                }

                update(progress) {
                    const eased = easing(progress);
                    let x = this.startX + (this.targetX - this.startX) * eased;
                    let y = this.startY + (this.targetY - this.startY) * eased;

                    if (config.behavior === 'spiral') {
                        const spiral = (1 - progress) * 50;
                        x += Math.cos(progress * Math.PI * 4 + this.phase) * spiral;
                        y += Math.sin(progress * Math.PI * 4 + this.phase) * spiral;
                    } else if (config.behavior === 'wave') {
                        y += Math.sin(progress * Math.PI * 2 + this.phase) * 30 * (1 - progress);
                    } else if (config.behavior === 'bounce') {
                        const bounce = Math.abs(Math.sin(progress * Math.PI * 3)) * 40 * (1 - progress);
                        y -= bounce;
                    }

                    this.x = x;
                    this.y = y;
                    this.opacity = Math.min(1, progress * 2);
                }

                draw() {
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = Random.range(5, 15);
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            function samplePath(path) {
                const points = [];
                const totalLength = path.getTotalLength();
                const numPoints = Math.floor((totalLength / config.particles.spacing) * config.particles.countMultiplier);

                for (let i = 0; i < numPoints; i++) {
                    const distance = (i / numPoints) * totalLength;
                    const point = path.getPointAtLength(distance);
                    points.push({ x: point.x, y: point.y });
                }
                return points;
            }

            function initializeParameters() {
                // Heavy randomization
                config = {
                    particles: {
                        countMultiplier: Random.range(0.5, 2.0),
                        sizeRange: [Random.range(1, 3), Random.range(3, 6)],
                        spacing: Random.range(2, 8)
                    },
                    timing: {
                        duration: Random.range(1000, 4000)
                    },
                    colors: {
                        hueShift: Random.range(-60, 60),
                        satShift: Random.range(-30, 30),
                        lightShift: Random.range(-20, 20)
                    },
                    behavior: Random.pick(['spiral', 'wave', 'linear', 'bounce'])
                };

                const easings = [
                    t => t,
                    t => 1 - Math.pow(1 - t, 3),
                    t => t * t * t,
                    t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
                    t => t * (2 - t)
                ];
                easing = Random.pick(easings);

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', canvas.width);
                svg.setAttribute('height', canvas.height);
                svg.setAttribute('viewBox', '0 0 600 200');
                svg.style.position = 'absolute';
                svg.style.visibility = 'hidden';
                document.body.appendChild(svg);

                particles = [];

                const shiftColor = (h, s, l) => {
                    return `hsl(${(h + config.colors.hueShift + 360) % 360}, ${Math.max(0, Math.min(100, s + config.colors.satShift))}%, ${Math.max(0, Math.min(100, l + config.colors.lightShift))}%)`;
                };

                colors = {
                    cyan: shiftColor(190, 100, 50),
                    purple: shiftColor(265, 85, 57),
                    pink: shiftColor(340, 100, 63)
                };

                const paths = [
                    { d: 'M 40 40 L 40 160 L 100 160', color: colors.cyan },
                    { d: 'M 150 60 A 40 40 0 1 1 149.99 60.01', color: colors.purple },
                    { d: 'M 240 60 A 40 40 0 1 1 239.99 60.01', color: colors.purple },
                    { d: 'M 300 160 L 300 40 L 350 100 L 400 40 L 400 160', color: colors.pink },
                    { d: 'M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160', color: colors.cyan },
                    { d: 'M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160', color: colors.cyan }
                ];

                paths.forEach(pathData => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData.d);
                    path.setAttribute('stroke', pathData.color);
                    path.setAttribute('stroke-width', '12');
                    path.setAttribute('fill', 'none');
                    svg.appendChild(path);

                    const points = samplePath(path);
                    points.forEach(point => {
                        particles.push(new Particle(point.x, point.y, pathData.color));
                    });
                });

                document.body.removeChild(svg);
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(1, elapsed / config.timing.duration);

                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                particles.forEach(particle => {
                    particle.update(progress);
                    particle.draw();
                });

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            function restart() {
                initializeParameters();  // Regenerate all random parameters
                startTime = null;
                requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            canvas.addEventListener('click', restart);
        }
    </script>
</body>
</html>
