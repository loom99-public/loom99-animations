<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Line Drawing Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (prefers-reduced-motion: reduce) {
            .line {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="text" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };

        // Define animation modes
        const modes = [
            {
                name: 'left-sweep',
                startDirection: () => ({
                    x: Random.range(-200, -150),
                    y: Random.range(100, 180)
                }),
                description: 'Sweep from left'
            },
            {
                name: 'top-cascade',
                startDirection: () => ({
                    x: Random.range(200, 400),
                    y: Random.range(-100, -50)
                }),
                description: 'Cascade from top'
            },
            {
                name: 'right-converge',
                startDirection: () => ({
                    x: Random.range(750, 850),
                    y: Random.range(100, 180)
                }),
                description: 'Converge from right'
            }
        ];

        // Color utilities
        const ColorRandom = {
            baseColors: {
                red: { h: 0, s: 100, l: 59 },
                orange: { h: 25, s: 100, l: 50 },
                yellow: { h: 50, s: 100, l: 50 }
            },
            shiftHue: (hsl, shift) => ({
                h: (hsl.h + shift + 360) % 360,
                s: hsl.s,
                l: hsl.l
            }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        const svg = document.getElementById('text');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Variables that will be regenerated on each restart
        let selectedMode;
        let config;
        let palette;
        let lines;

        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        class AnimatedLine {
            constructor(startX, startY, points, color, delay, duration, foldDuration = 150) {
                this.points = points;
                this.startX = startX;
                this.startY = startY;
                this.delay = delay;
                this.duration = duration;
                this.foldDuration = foldDuration;
                this.color = color;
                this.progress = 0;
                this.foldProgress = 0;
                this.started = false;
                this.finished = false;
                this.folding = false;
                this.foldComplete = false;

                const strokeWidth = config.effects.enabled ?
                    Random.vary(4, config.effects.strokeVariance) : 4;
                const glowRadius = config.effects.enabled ?
                    Random.vary(6, config.effects.glowVariance) : 6;

                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.classList.add('line');
                this.path.style.stroke = color;
                this.path.style.strokeWidth = Math.max(2, strokeWidth);
                this.path.style.filter = `drop-shadow(0 0 ${Math.max(0, glowRadius)}px ${color})`;
                this.path.style.opacity = '0';
            }

            getFirstPoint() {
                return this.points[0];
            }

            update(elapsed) {
                if (this.foldComplete) return;

                if (elapsed < this.delay) {
                    this.path.style.opacity = '0';
                    return;
                }

                this.path.style.opacity = '1';

                if (!this.started) {
                    this.started = true;
                }

                const localTime = elapsed - this.delay;

                if (localTime < this.duration) {
                    this.progress = Math.min(1, localTime / this.duration);
                    const eased = easeOutQuart(this.progress);

                    const firstPoint = this.getFirstPoint();
                    const tailX = this.startX + (firstPoint.x - this.startX) * eased;
                    const tailY = this.startY + (firstPoint.y - this.startY) * eased;

                    let d = `M ${tailX} ${tailY}`;

                    for (let i = 0; i < this.points.length; i++) {
                        const point = this.points[i];
                        const finalPoint = this.points[this.points.length - 1];
                        const t = (i + 1) / this.points.length;

                        const straightX = this.startX + (finalPoint.x - this.startX) * t;
                        const straightY = this.startY + (finalPoint.y - this.startY) * t;

                        const currentX = straightX + (point.x - straightX) * eased;
                        const currentY = straightY + (point.y - straightY) * eased;

                        if (point.type === 'Q') {
                            const ctrlStraightX = this.startX + (finalPoint.x - this.startX) * ((i + 0.5) / this.points.length);
                            const ctrlStraightY = this.startY + (finalPoint.y - this.startY) * ((i + 0.5) / this.points.length);
                            const ctrlX = ctrlStraightX + (point.cx - ctrlStraightX) * eased;
                            const ctrlY = ctrlStraightY + (point.cy - ctrlStraightY) * eased;
                            d += ` Q ${ctrlX} ${ctrlY} ${currentX} ${currentY}`;
                        } else {
                            d += ` L ${currentX} ${currentY}`;
                        }
                    }

                    this.path.setAttribute('d', d);
                } else {
                    if (!this.folding) {
                        this.folding = true;
                        this.finished = true;
                    }

                    const foldTime = localTime - this.duration;
                    this.foldProgress = Math.min(1, foldTime / this.foldDuration);

                    let d = `M ${this.points[0].x} ${this.points[0].y}`;

                    for (let i = 1; i < this.points.length; i++) {
                        const point = this.points[i];
                        if (point.type === 'Q') {
                            d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                        } else {
                            d += ` L ${point.x} ${point.y}`;
                        }
                    }

                    this.path.setAttribute('d', d);

                    if (this.foldProgress >= 1) {
                        this.foldComplete = true;
                    }
                }
            }
        }

        function addLine(startX, startY, points, color, delay, duration = 350, foldDuration = 150) {
            const line = new AnimatedLine(startX, startY, points, color, delay, duration, foldDuration);
            lines.push(line);
            svg.appendChild(line.path);
            return line;
        }

        function initializeParameters() {
            // Clear existing lines from SVG
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            // Select random mode
            selectedMode = Random.pick(modes);
            console.log(`Animation mode: ${selectedMode.name} - ${selectedMode.description}`);

            // Randomization config
            config = {
                timing: {
                    enabled: true,
                    durationVariance: 0.2,
                    staggerVariance: 0.2
                },
                colors: {
                    enabled: true,
                    hueShift: Random.range(-15, 15)
                },
                motion: {
                    enabled: true,
                    useMode: true
                },
                effects: {
                    enabled: true,
                    strokeVariance: 0.8,
                    glowVariance: 1.5
                }
            };

            // Apply color shifts
            palette = config.colors.enabled ? {
                red: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.red, config.colors.hueShift)),
                orange: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.orange, config.colors.hueShift)),
                yellow: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.yellow, config.colors.hueShift))
            } : {
                red: '#ff2d2d',
                orange: '#ff6b00',
                yellow: '#ffdd00'
            };

            // Create new lines array
            lines = [];

            const RED = palette.red;
            const ORANGE = palette.orange;
            const YELLOW = palette.yellow;

            const BASE_DURATION = config.timing.enabled ?
                Random.varyPercent(350, config.timing.durationVariance) : 350;
            const SYLLABLE = 200;
            const PAUSE = 100;

            // Get start positions based on mode
            const getStart = (index) => {
                if (!config.motion.enabled || !config.motion.useMode) {
                    return { x: -150, y: 70 };
                }
                const base = selectedMode.startDirection();
                return {
                    x: Random.vary(base.x, 30),
                    y: Random.vary(base.y, 30)
                };
            };

            // ===== DO =====
            const doStart = 0;
            const doDur = config.timing.enabled ? Random.varyPercent(SYLLABLE, config.timing.durationVariance) : SYLLABLE;

            // D - vertical
            const start0 = getStart(0);
            addLine(start0.x, start0.y, [
                {x: 100, y: 20},
                {x: 100, y: 100}
            ], RED, doStart, doDur);

            // D - curve
            const start1 = getStart(1);
            addLine(start1.x, start1.y, [
                {x: 100, y: 20},
                {type: 'Q', cx: 160, cy: 20, x: 160, y: 60},
                {type: 'Q', cx: 160, cy: 100, x: 100, y: 100}
            ], RED, doStart + Random.vary(20, 5), doDur);

            // O - left arc
            const start2 = getStart(2);
            addLine(start2.x, start2.y, [
                {x: 200, y: 60},
                {type: 'Q', cx: 200, cy: 20, x: 240, y: 20},
                {type: 'Q', cx: 280, cy: 20, x: 280, y: 60}
            ], RED, doStart + Random.vary(40, 8), doDur);

            // O - right arc
            const start3 = getStart(3);
            addLine(start3.x, start3.y, [
                {x: 280, y: 60},
                {type: 'Q', cx: 280, cy: 100, x: 240, y: 100},
                {type: 'Q', cx: 200, cy: 100, x: 200, y: 60}
            ], RED, doStart + Random.vary(50, 10), doDur);

            // ===== IT =====
            const itStart = doStart + doDur + PAUSE;
            const itDur = config.timing.enabled ? Random.varyPercent(SYLLABLE, config.timing.durationVariance) : SYLLABLE;
            const itY = 140;

            // I - vertical
            const start4 = getStart(4);
            addLine(start4.x, start4.y, [
                {x: 100, y: itY},
                {x: 100, y: itY + 60}
            ], ORANGE, itStart, itDur);

            // T - vertical
            const start5 = getStart(5);
            addLine(start5.x, start5.y, [
                {x: 170, y: itY},
                {x: 170, y: itY + 60}
            ], ORANGE, itStart + Random.vary(30, 6), itDur);

            // T - horizontal
            const start6 = getStart(6);
            addLine(start6.x, start6.y, [
                {x: 140, y: itY},
                {x: 200, y: itY}
            ], ORANGE, itStart + Random.vary(40, 8), itDur);

            // ===== NOW =====
            const nowStart = itStart + itDur + PAUSE;
            const nowDur = config.timing.enabled ? Random.varyPercent(SYLLABLE, config.timing.durationVariance) : SYLLABLE;
            const nowY = 220;

            // N - left vertical
            const start7 = getStart(7);
            addLine(start7.x, start7.y, [
                {x: 80, y: nowY},
                {x: 80, y: nowY + 60}
            ], YELLOW, nowStart, nowDur);

            // N - diagonal
            const start8 = getStart(8);
            addLine(start8.x, start8.y, [
                {x: 80, y: nowY},
                {x: 140, y: nowY + 60}
            ], YELLOW, nowStart + Random.vary(10, 3), nowDur);

            // N - right vertical
            const start9 = getStart(9);
            addLine(start9.x, start9.y, [
                {x: 140, y: nowY},
                {x: 140, y: nowY + 60}
            ], YELLOW, nowStart + Random.vary(20, 5), nowDur);

            // O - left arc
            const start10 = getStart(10);
            addLine(start10.x, start10.y, [
                {x: 180, y: nowY + 30},
                {type: 'Q', cx: 180, cy: nowY, x: 215, y: nowY},
                {type: 'Q', cx: 250, cy: nowY, x: 250, y: nowY + 30}
            ], YELLOW, nowStart + Random.vary(30, 6), nowDur);

            // O - right arc
            const start11 = getStart(11);
            addLine(start11.x, start11.y, [
                {x: 250, y: nowY + 30},
                {type: 'Q', cx: 250, cy: nowY + 60, x: 215, y: nowY + 60},
                {type: 'Q', cx: 180, cy: nowY + 60, x: 180, y: nowY + 30}
            ], YELLOW, nowStart + Random.vary(40, 8), nowDur);

            // W - first stroke
            const start12 = getStart(12);
            addLine(start12.x, start12.y, [
                {x: 280, y: nowY},
                {x: 300, y: nowY + 60}
            ], YELLOW, nowStart + Random.vary(50, 10), nowDur);

            // W - second stroke
            const start13 = getStart(13);
            addLine(start13.x, start13.y, [
                {x: 300, y: nowY + 60},
                {x: 320, y: nowY + 30}
            ], YELLOW, nowStart + Random.vary(60, 12), nowDur);

            // W - third stroke
            const start14 = getStart(14);
            addLine(start14.x, start14.y, [
                {x: 320, y: nowY + 30},
                {x: 340, y: nowY + 60}
            ], YELLOW, nowStart + Random.vary(70, 14), nowDur);

            // W - fourth stroke
            const start15 = getStart(15);
            addLine(start15.x, start15.y, [
                {x: 340, y: nowY + 60},
                {x: 360, y: nowY}
            ], YELLOW, nowStart + Random.vary(80, 16), nowDur);
        }

        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            lines.forEach(line => line.update(elapsed));

            const allDone = lines.every(l => l.foldComplete);
            if (!allDone) {
                requestAnimationFrame(animate);
            }
        }

        function restart() {
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            requestAnimationFrame(animate);
        }

        if (prefersReducedMotion) {
            initializeParameters();
            lines.forEach(line => {
                line.foldComplete = true;
                line.path.style.opacity = '1';
                let d = `M ${line.points[0].x} ${line.points[0].y}`;
                for (let i = 1; i < line.points.length; i++) {
                    const point = line.points[i];
                    if (point.type === 'Q') {
                        d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                    } else {
                        d += ` L ${point.x} ${point.y}`;
                    }
                }
                line.path.setAttribute('d', d);
            });
        } else {
            initializeParameters();
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
