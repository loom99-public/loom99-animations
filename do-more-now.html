<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO MORE NOW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="logo" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
        </svg>
    </div>

    <script>
        const svg = document.getElementById('logo');

        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        function easeInQuart(t) {
            return t * t * t * t;
        }

        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        class AnimatedLine {
            constructor(startX, startY, points, color, delay, duration, foldDuration = 200) {
                this.points = points;
                this.startX = startX;
                this.startY = startY;
                this.delay = delay;
                this.duration = duration;
                this.foldDuration = foldDuration;
                this.color = color;
                this.progress = 0;
                this.foldProgress = 0;
                this.started = false;
                this.finished = false;
                this.folding = false;
                this.foldComplete = false;

                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.classList.add('line');
                this.path.style.stroke = color;
                this.path.style.filter = `drop-shadow(0 0 6px ${color})`;
                this.path.style.opacity = '0';
            }

            // Get the first point of the final letter shape
            getFirstLetterPoint() {
                return this.points[0];
            }

            update(elapsed) {
                if (this.foldComplete) return;

                if (elapsed < this.delay) {
                    this.path.style.opacity = '0';
                    return;
                }

                this.path.style.opacity = '1';

                if (!this.started) {
                    this.started = true;
                }

                const localTime = elapsed - this.delay;

                // Phase 1: Line shoots in and curves into shape
                if (localTime < this.duration) {
                    this.progress = Math.min(1, localTime / this.duration);
                    const eased = easeOutQuart(this.progress);

                    // Current tail position (starts at startX,startY, ends at first letter point)
                    const firstPoint = this.getFirstLetterPoint();
                    const tailX = this.startX + (firstPoint.x - this.startX) * eased;
                    const tailY = this.startY + (firstPoint.y - this.startY) * eased;

                    let d = `M ${tailX} ${tailY}`;

                    // Build the rest of the path
                    for (let i = 0; i < this.points.length; i++) {
                        const point = this.points[i];
                        const finalPoint = this.points[this.points.length - 1];
                        const t = (i + 1) / this.points.length;

                        const straightX = this.startX + (finalPoint.x - this.startX) * t;
                        const straightY = this.startY + (finalPoint.y - this.startY) * t;

                        const currentX = straightX + (point.x - straightX) * eased;
                        const currentY = straightY + (point.y - straightY) * eased;

                        if (point.type === 'Q') {
                            const ctrlStraightX = this.startX + (finalPoint.x - this.startX) * ((i + 0.5) / this.points.length);
                            const ctrlStraightY = this.startY + (finalPoint.y - this.startY) * ((i + 0.5) / this.points.length);
                            const ctrlX = ctrlStraightX + (point.cx - ctrlStraightX) * eased;
                            const ctrlY = ctrlStraightY + (point.cy - ctrlStraightY) * eased;
                            d += ` Q ${ctrlX} ${ctrlY} ${currentX} ${currentY}`;
                        } else {
                            d += ` L ${currentX} ${currentY}`;
                        }
                    }

                    this.path.setAttribute('d', d);
                }
                // Phase 2: Tail folds into the letter (disappears)
                else {
                    if (!this.folding) {
                        this.folding = true;
                        this.finished = true;
                    }

                    const foldTime = localTime - this.duration;
                    this.foldProgress = Math.min(1, foldTime / this.foldDuration);
                    const foldEased = easeInQuart(this.foldProgress);

                    // Now we draw just the letter shape, no tail
                    // The path is the final letter shape
                    let d = `M ${this.points[0].x} ${this.points[0].y}`;

                    for (let i = 1; i < this.points.length; i++) {
                        const point = this.points[i];
                        if (point.type === 'Q') {
                            d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                        } else {
                            d += ` L ${point.x} ${point.y}`;
                        }
                    }

                    this.path.setAttribute('d', d);

                    if (this.foldProgress >= 1) {
                        this.foldComplete = true;
                    }
                }
            }
        }

        const lines = [];

        function addLine(startX, startY, points, color, delay, duration = 350, foldDuration = 150) {
            const line = new AnimatedLine(startX, startY, points, color, delay, duration, foldDuration);
            lines.push(line);
            return line;
        }

        const RED = '#ff2d2d';
        const ORANGE = '#ff6b00';
        const YELLOW = '#ffdd00';

        // Timing: each word forms in ~200ms (one syllable), with pauses between
        const SYLLABLE = 200;  // How long each word takes to fully form
        const PAUSE = 100;     // Pause between words

        // ===== DO ===== (all strokes land together)
        const doStart = 0;
        const doDur = SYLLABLE;

        // D - vertical
        addLine(-150, 70, [
            {x: 120, y: 20},
            {x: 120, y: 120}
        ], RED, doStart, doDur);

        // D - curve
        addLine(350, 70, [
            {x: 120, y: 20},
            {type: 'Q', cx: 190, cy: 20, x: 190, y: 70},
            {type: 'Q', cx: 190, cy: 120, x: 120, y: 120}
        ], RED, doStart + 20, doDur);

        // O - left arc
        addLine(-150, 70, [
            {x: 240, y: 70},
            {type: 'Q', cx: 240, cy: 20, x: 290, y: 20},
            {type: 'Q', cx: 340, cy: 20, x: 340, y: 70}
        ], RED, doStart + 40, doDur);

        // O - right arc
        addLine(500, 70, [
            {x: 340, y: 70},
            {type: 'Q', cx: 340, cy: 120, x: 290, y: 120},
            {type: 'Q', cx: 240, cy: 120, x: 240, y: 70}
        ], RED, doStart + 50, doDur);

        // ===== MORE ===== (all strokes land together)
        const moreStart = doStart + doDur + PAUSE;
        const moreDur = SYLLABLE;
        const moreY = 180;

        // M - left vertical
        addLine(-150, moreY + 40, [
            {x: 80, y: moreY},
            {x: 80, y: moreY + 80}
        ], ORANGE, moreStart, moreDur);

        // M - left diagonal
        addLine(-100, moreY + 40, [
            {x: 80, y: moreY},
            {x: 130, y: moreY + 50}
        ], ORANGE, moreStart + 10, moreDur);

        // M - right diagonal
        addLine(300, moreY + 40, [
            {x: 180, y: moreY},
            {x: 130, y: moreY + 50}
        ], ORANGE, moreStart + 20, moreDur);

        // M - right vertical
        addLine(950, moreY + 40, [
            {x: 180, y: moreY},
            {x: 180, y: moreY + 80}
        ], ORANGE, moreStart + 30, moreDur);

        // O
        addLine(-150, moreY + 40, [
            {x: 210, y: moreY + 40},
            {type: 'Q', cx: 210, cy: moreY, x: 250, y: moreY},
            {type: 'Q', cx: 290, cy: moreY, x: 290, y: moreY + 40}
        ], ORANGE, moreStart + 40, moreDur);

        addLine(950, moreY + 40, [
            {x: 290, y: moreY + 40},
            {type: 'Q', cx: 290, cy: moreY + 80, x: 250, y: moreY + 80},
            {type: 'Q', cx: 210, cy: moreY + 80, x: 210, y: moreY + 40}
        ], ORANGE, moreStart + 50, moreDur);

        // R - vertical
        addLine(-150, moreY + 40, [
            {x: 330, y: moreY},
            {x: 330, y: moreY + 80}
        ], ORANGE, moreStart + 60, moreDur);

        // R - curve
        addLine(500, moreY + 25, [
            {x: 330, y: moreY},
            {type: 'Q', cx: 390, cy: moreY, x: 390, y: moreY + 25},
            {type: 'Q', cx: 390, cy: moreY + 50, x: 330, y: moreY + 50}
        ], ORANGE, moreStart + 70, moreDur);

        // R - leg
        addLine(950, moreY + 60, [
            {x: 350, y: moreY + 50},
            {x: 395, y: moreY + 80}
        ], ORANGE, moreStart + 80, moreDur);

        // E - vertical
        addLine(-150, moreY + 40, [
            {x: 430, y: moreY},
            {x: 430, y: moreY + 80}
        ], ORANGE, moreStart + 90, moreDur);

        // E - top
        addLine(950, moreY, [
            {x: 430, y: moreY},
            {x: 490, y: moreY}
        ], ORANGE, moreStart + 100, moreDur);

        // E - middle
        addLine(950, moreY + 40, [
            {x: 430, y: moreY + 40},
            {x: 480, y: moreY + 40}
        ], ORANGE, moreStart + 110, moreDur);

        // E - bottom
        addLine(950, moreY + 80, [
            {x: 430, y: moreY + 80},
            {x: 490, y: moreY + 80}
        ], ORANGE, moreStart + 120, moreDur);

        // ===== NOW ===== (all strokes land together - punchy ending)
        const nowStart = moreStart + moreDur + PAUSE;
        const nowDur = SYLLABLE * 0.9;  // Slightly faster for impact
        const nowY = 300;

        // N - left vertical
        addLine(-150, nowY + 40, [
            {x: 150, y: nowY},
            {x: 150, y: nowY + 80}
        ], YELLOW, nowStart, nowDur);

        // N - diagonal
        addLine(-100, nowY + 40, [
            {x: 150, y: nowY},
            {x: 230, y: nowY + 80}
        ], YELLOW, nowStart + 10, nowDur);

        // N - right vertical
        addLine(950, nowY + 40, [
            {x: 230, y: nowY},
            {x: 230, y: nowY + 80}
        ], YELLOW, nowStart + 20, nowDur);

        // O
        addLine(-150, nowY + 40, [
            {x: 270, y: nowY + 40},
            {type: 'Q', cx: 270, cy: nowY, x: 315, y: nowY},
            {type: 'Q', cx: 360, cy: nowY, x: 360, y: nowY + 40}
        ], YELLOW, nowStart + 30, nowDur);

        addLine(950, nowY + 40, [
            {x: 360, y: nowY + 40},
            {type: 'Q', cx: 360, cy: nowY + 80, x: 315, y: nowY + 80},
            {type: 'Q', cx: 270, cy: nowY + 80, x: 270, y: nowY + 40}
        ], YELLOW, nowStart + 40, nowDur);

        // W - first stroke
        addLine(-150, nowY + 40, [
            {x: 400, y: nowY},
            {x: 430, y: nowY + 80}
        ], YELLOW, nowStart + 50, nowDur);

        // W - second stroke
        addLine(-100, nowY + 60, [
            {x: 430, y: nowY + 80},
            {x: 460, y: nowY + 40}
        ], YELLOW, nowStart + 60, nowDur);

        // W - third stroke
        addLine(950, nowY + 60, [
            {x: 460, y: nowY + 40},
            {x: 490, y: nowY + 80}
        ], YELLOW, nowStart + 70, nowDur);

        // W - fourth stroke
        addLine(950, nowY + 40, [
            {x: 490, y: nowY + 80},
            {x: 520, y: nowY}
        ], YELLOW, nowStart + 80, nowDur);

        // ! - stem
        addLine(650, nowY - 30, [
            {x: 580, y: nowY},
            {x: 580, y: nowY + 55}
        ], YELLOW, nowStart + 90, nowDur);

        // ! - dot
        addLine(650, nowY + 100, [
            {x: 580, y: nowY + 75},
            {x: 580, y: nowY + 82}
        ], YELLOW, nowStart + 100, nowDur);

        // Add all paths to SVG
        lines.forEach(line => svg.appendChild(line.path));

        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            lines.forEach(line => line.update(elapsed));

            const allDone = lines.every(l => l.foldComplete);
            if (!allDone) {
                requestAnimationFrame(animate);
            }
        }

        function restart() {
            startTime = null;
            lines.forEach(line => {
                line.progress = 0;
                line.foldProgress = 0;
                line.started = false;
                line.finished = false;
                line.folding = false;
                line.foldComplete = false;
                line.path.style.opacity = '0';
            });
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
