<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Animation (Procedural) - Dynamic Text</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .container { width: 100%; max-width: 1000px; padding: 20px; }
        svg { width: 100%; height: auto; }
        @media (prefers-reduced-motion: reduce) { svg path { opacity: 1 !important; } }
    </style>
</head>
<body>
    <div class="container"><svg id="svg" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <script src="https://unpkg.com/flubber@0.4.2"></script>
    <script src="../shared/controls.js"></script>
    <script>
        const svg = document.getElementById('svg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Read URL parameters from gallery editor
        const urlParams = new URLSearchParams(window.location.search);
        const paramHoldDuration = urlParams.get('holdDuration');

        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };
        const ColorRandom = {
            baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } },
            shiftColor: (hsl, hueShift, satShift, lightShift) => ({ h: (hsl.h + hueShift + 360) % 360, s: Math.max(0, Math.min(100, hsl.s + satShift)), l: Math.max(0, Math.min(100, hsl.l + lightShift)) }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        // Animation state
        let animationState = 'entrance';
        let startTime = null;
        let exitStartTime = null;
        let holdTimeout = null;
        let pathElements = [];
        let interpolators = [];
        let morphData = null;
        let config = null;
        let palette = null;
        let selectedEasing = null;

        const HOLD_DURATION = paramHoldDuration ? parseInt(paramHoldDuration) : 2000;
        const EXIT_DURATION = 250;

        // Default text paths (DO MORE NOW)
        const defaultPaths = [
            { d: "M 100 20 L 100 100", text: "D", color: "#ff2d2d", y: 80 },
            { d: "M 100 20 L 160 20 L 160 60 L 160 100 L 100 100", text: "D", color: "#ff2d2d", y: 80 },
            { d: "M 200 60 L 200 20 L 280 20 L 280 60 L 280 100 L 200 100 L 200 60", text: "O", color: "#ff2d2d", y: 80 },
            { d: "M 80 200 L 80 140", text: "M", color: "#ff6b00", y: 170 },
            { d: "M 80 140 L 110 180", text: "M", color: "#ff6b00", y: 170 },
            { d: "M 110 180 L 140 140", text: "M", color: "#ff6b00", y: 170 },
            { d: "M 140 140 L 140 200", text: "M", color: "#ff6b00", y: 170 },
            { d: "M 175 170 L 175 140 L 200 140 L 225 140 L 225 170", text: "O", color: "#ff6b00", y: 170 },
            { d: "M 225 170 L 225 200 L 200 200 L 175 200 L 175 170", text: "O", color: "#ff6b00", y: 170 },
            { d: "M 260 140 L 260 200", text: "R", color: "#ff6b00", y: 170 },
            { d: "M 260 140 L 295 140 L 295 155 L 295 170 L 260 170", text: "R", color: "#ff6b00", y: 170 },
            { d: "M 270 170 L 295 200", text: "R", color: "#ff6b00", y: 170 },
            { d: "M 330 140 L 330 200", text: "E", color: "#ff6b00", y: 170 },
            { d: "M 330 140 L 365 140", text: "E", color: "#ff6b00", y: 170 },
            { d: "M 330 170 L 355 170", text: "E", color: "#ff6b00", y: 170 },
            { d: "M 330 200 L 365 200", text: "E", color: "#ff6b00", y: 170 },
            { d: "M 80 220 L 80 280", text: "N", color: "#ffdd00", y: 260 },
            { d: "M 80 220 L 140 280", text: "N", color: "#ffdd00", y: 260 },
            { d: "M 140 220 L 140 280", text: "N", color: "#ffdd00", y: 260 },
            { d: "M 180 250 L 180 220 L 250 220 L 250 250 L 250 280 L 180 280 L 180 250", text: "O", color: "#ffdd00", y: 260 },
            { d: "M 280 220 L 300 280 L 320 250 L 340 280 L 360 220", text: "W", color: "#ffdd00", y: 260 },
            { d: "M 390 220 L 390 265 M 390 275 L 390 280", text: "!", color: "#ffdd00", y: 260 }
        ];

        function easeInCubic(t) {
            return t * t * t;
        }

        // Generate random start shapes
        const getRandomStart = () => {
            const shapes = [
                () => {
                    // Tiny dot
                    const x = Random.range(100, 600);
                    const y = Random.range(50, 230);
                    return `M ${x} ${y} L ${x} ${y}`;
                },
                () => {
                    // Small square
                    const x = Random.range(100, 600);
                    const y = Random.range(50, 230);
                    const s = Random.range(3, 20);
                    return `M ${x} ${y} L ${x+s} ${y} L ${x+s} ${y+s} L ${x} ${y+s} Z`;
                },
                () => {
                    // Small triangle
                    const x = Random.range(100, 600);
                    const y = Random.range(50, 230);
                    const s = Random.range(5, 25);
                    return `M ${x} ${y-s} L ${x+s} ${y+s} L ${x-s} ${y+s} Z`;
                },
                () => {
                    // Small circle (arc-based)
                    const x = Random.range(100, 600);
                    const y = Random.range(50, 230);
                    const r = Random.range(3, 20);
                    return `M ${x-r},${y} a ${r},${r} 0 1,0 ${r*2},0 a ${r},${r} 0 1,0 -${r*2},0`;
                },
                () => {
                    // Random line
                    const x = Random.range(100, 600);
                    const y = Random.range(50, 230);
                    const len = Random.range(10, 40);
                    const angle = Random.range(0, Math.PI * 2);
                    const x2 = x + Math.cos(angle) * len;
                    const y2 = y + Math.sin(angle) * len;
                    return `M ${x} ${y} L ${x2} ${y2}`;
                }
            ];
            return Random.pick(shapes)();
        };

        function initializeParameters() {
            // Heavy randomization config
            config = {
                timing: {
                    enabled: true,
                    durationVariance: 0.5,
                    staggerVariance: 0.6
                },
                colors: {
                    enabled: true,
                    hueShift: Random.range(-60, 60),
                    satShift: Random.range(-30, 30),
                    lightShift: Random.range(-15, 15)
                },
                effects: {
                    enabled: true,
                    strokeVariance: 2,
                    glowVariance: 4
                }
            };

            // Apply wild color shifts
            palette = config.colors.enabled ? {
                red: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.red, config.colors.hueShift, config.colors.satShift, config.colors.lightShift)),
                orange: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.orange, config.colors.hueShift, config.colors.satShift, config.colors.lightShift)),
                yellow: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.yellow, config.colors.hueShift, config.colors.satShift, config.colors.lightShift))
            } : { red: '#ff2d2d', orange: '#ff6b00', yellow: '#ffdd00' };

            // Randomize easing function
            const easingFunctions = [
                t => t,
                t => 1 - Math.pow(1 - t, 3),
                t => t * t * t,
                t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
            ];
            selectedEasing = Random.pick(easingFunctions);
        }

        function createInterpolators(pathData) {
            // Clear existing elements
            svg.innerHTML = '';
            pathElements = [];
            interpolators = [];

            pathData.forEach((item, index) => {
                // Determine color (use palette if available)
                const color = palette ? (
                    item.color === '#ff2d2d' ? palette.red :
                    item.color === '#ff6b00' ? palette.orange :
                    palette.yellow
                ) : item.color;

                // Create path element
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('stroke', color);

                const strokeWidth = config && config.effects.enabled ?
                    Random.vary(4, config.effects.strokeVariance) : 4;
                const glowRadius = config && config.effects.enabled ?
                    Random.vary(6, config.effects.glowVariance) : 6;

                path.setAttribute('stroke-width', Math.max(1, strokeWidth));
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('fill', 'none');
                path.style.filter = `drop-shadow(0 0 ${Math.max(0, glowRadius)}px ${color})`;
                path.style.opacity = '0';

                const delay = config && config.timing.enabled ?
                    Random.varyPercent(index * 50, config.timing.staggerVariance) : index * 50;
                const duration = Random.range(600, 1800);

                path.dataset.delay = delay;
                path.dataset.duration = duration;
                svg.appendChild(path);

                pathElements.push({
                    element: path,
                    delay: delay,
                    duration: duration,
                    color: color
                });

                // Create flubber interpolator with random start shape
                const startShape = getRandomStart();
                try {
                    const interpolator = flubber.interpolate(startShape, item.d, {
                        maxSegmentLength: 5
                    });
                    interpolators.push(interpolator);
                } catch (error) {
                    console.warn('Flubber interpolation failed for path:', item.d, error);
                    // Fallback to direct path
                    interpolators.push((t) => t < 0.5 ? startShape : item.d);
                }
            });

            morphData = pathData;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                let allDone = true;

                pathElements.forEach((item, index) => {
                    const localTime = elapsed - item.delay;

                    if (localTime < 0) {
                        item.element.style.opacity = '0';
                        allDone = false;
                    } else if (localTime < item.duration) {
                        const progress = localTime / item.duration;
                        const eased = selectedEasing(progress);

                        // Apply interpolated path
                        const currentPath = interpolators[index](eased);
                        item.element.setAttribute('d', currentPath);
                        item.element.style.opacity = '1';
                        allDone = false;
                    } else {
                        // Ensure final path is set
                        item.element.setAttribute('d', morphData[index].d);
                        item.element.style.opacity = '1';
                    }
                });

                if (allDone) {
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                } else {
                    requestAnimationFrame(animate);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(progress);

                pathElements.forEach((item) => {
                    const scale = 1 - eased;
                    const opacity = 1 - eased;
                    item.element.style.transform = `scale(${scale})`;
                    item.element.style.transformOrigin = 'center';
                    item.element.style.opacity = opacity;
                });

                if (progress >= 1) {
                    restart();
                } else {
                    requestAnimationFrame(animate);
                }
            }
        }

        function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            exitStartTime = null;
            pathElements.forEach(item => {
                item.element.style.opacity = '0';
                item.element.style.transform = '';
            });
            requestAnimationFrame(animate);
        }

        function startAnimation(pathData) {
            createInterpolators(pathData || defaultPaths);
            animationState = 'entrance';
            startTime = null;
            requestAnimationFrame(animate);
        }

        // Listen for messages from parent (gallery editor)
        window.addEventListener('message', function(event) {
            // Validate origin - allow same origin and localhost dev servers
            const allowedOrigins = [
                window.location.origin,
                "http://localhost:8888",
                "http://127.0.0.1:8888",
                "null"  // file:// protocol for local development
            ];

            if (!allowedOrigins.includes(event.origin)) {
                console.warn("Rejected postMessage from unauthorized origin:", event.origin);
                return;
            }

            if (event.data && event.data.type === 'updateTextPaths') {
                const pathData = event.data.pathData;
                if (pathData && pathData.length > 0) {
                    if (holdTimeout) clearTimeout(holdTimeout);
                    initializeParameters();  // Generate new random parameters
                    startAnimation(pathData);
                }
            }
        });

        // Click to restart
        document.body.addEventListener('click', () => {
            if (animationState === 'hold') {
                startExit();
            } else if (animationState === 'entrance') {
                restart();
            }
        });

        // Start with default animation
        initializeParameters();
        if (!prefersReducedMotion) {
            startAnimation(defaultPaths);
        } else {
            createInterpolators(defaultPaths);
            pathElements.forEach(item => {
                item.element.style.opacity = '1';
                item.element.setAttribute('d', morphData[item.element.dataset.index || 0].d);
            });
        }
    </script>
</body>
</html>
