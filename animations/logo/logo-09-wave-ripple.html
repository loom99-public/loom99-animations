<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Wave Ripple Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .logo-part {
            transform-origin: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-part {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>

            <path class="logo-part" d="M 40 40 L 40 160 L 100 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
            <circle class="logo-part" cx="150" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
            <circle class="logo-part" cx="240" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 10px #7b2ff7)"/>
            <path class="logo-part" d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="#ff2d75" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #ff2d75)"/>
            <path class="logo-part" d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
            <path class="logo-part" d="M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00d4ff)"/>
        </svg>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const parts = document.querySelectorAll('.logo-part');

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            const EXIT_DURATION = 250;

            let startTime = null;
            const ENTRANCE_DURATION = 3000;
            const waveCount = 3;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    parts.forEach((part, index) => {
                        const time = elapsed / 1000;
                        const wavePhase = (index / parts.length) * Math.PI * 2 * waveCount;

                        // More pronounced wave effects
                        const y = Math.sin(time * 4 + wavePhase) * 35 * Math.max(0, 1 - elapsed / ENTRANCE_DURATION);
                        const scale = 1 + Math.sin(time * 3 + wavePhase) * 0.25 * Math.max(0, 1 - elapsed / ENTRANCE_DURATION);
                        const rotate = Math.sin(time * 2.5 + wavePhase) * 15 * Math.max(0, 1 - elapsed / ENTRANCE_DURATION);

                        const bbox = part.getBBox();
                        const centerX = bbox.x + bbox.width / 2;
                        const centerY = bbox.y + bbox.height / 2;

                        part.style.transformOrigin = `${centerX}px ${centerY}px`;
                        part.style.transform = `translateY(${y}px) scale(${scale}) rotate(${rotate}deg)`;
                    });

                    if (elapsed < ENTRANCE_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        parts.forEach(part => {
                            part.style.transform = 'none';
                        });
                        animationState = 'hold';
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);

                    parts.forEach((part, index) => {
                        // Collapse inward with intense wave effect
                        const wavePhase = (index / parts.length) * Math.PI * 2;
                        const waveOffset = Math.sin(wavePhase + progress * Math.PI * 6) * 40 * (1 - progress);

                        const bbox = part.getBBox();
                        const centerX = bbox.x + bbox.width / 2;
                        const centerY = bbox.y + bbox.height / 2;

                        // Calculate direction to center
                        const svgCenterX = 300;
                        const svgCenterY = 100;
                        const dx = svgCenterX - centerX;
                        const dy = svgCenterY - centerY;

                        const scale = 1 - progress;
                        const translateX = dx * progress + waveOffset;
                        const translateY = dy * progress;
                        const rotate = progress * 180 * (index % 2 === 0 ? 1 : -1);

                        part.style.transformOrigin = `${centerX}px ${centerY}px`;
                        part.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotate}deg)`;
                        part.style.opacity = 1 - progress;
                    });

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
                animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
                startTime = null;
                animationState = 'entrance';
                parts.forEach(part => {
                    part.style.transform = 'none';
                    part.style.opacity = '1';
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
