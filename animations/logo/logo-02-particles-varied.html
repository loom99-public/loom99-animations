<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Particle Animation (Varied)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { width: 100%; max-width: 800px; padding: 20px; }
        canvas { width: 100%; height: auto; display: block; }
        @media (prefers-reduced-motion: reduce) {
            canvas { display: none; }
        }
        .reduced-motion-text {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 60px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-text { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">loom99</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            canvas.width = 600;
            canvas.height = 200;

            const Random = {
                range: (min, max) => min + Math.random() * (max - min),
                int: (min, max) => Math.floor(Random.range(min, max + 1)),
                pick: (arr) => arr[Random.int(0, arr.length - 1)],
                varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
            };

            // Formation modes
            const modes = [
                { name: 'explode', startPattern: 'center-explosion' },
                { name: 'rain', startPattern: 'top-rain' },
                { name: 'sides', startPattern: 'side-converge' }
            ];

            // Variables that will be regenerated on each restart
            let selectedMode;
            let config;
            let particles;
            let colors;
            let startTime;
            let duration;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            class Particle {
                constructor(targetX, targetY, color, startPattern) {
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    if (startPattern === 'center-explosion') {
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 400 + 200;
                        this.startX = centerX + Math.cos(angle) * distance;
                        this.startY = centerY + Math.sin(angle) * distance;
                    } else if (startPattern === 'top-rain') {
                        this.startX = Random.range(0, canvas.width);
                        this.startY = Random.range(-300, -50);
                    } else {
                        const side = Random.pick(['left', 'right']);
                        this.startX = side === 'left' ? Random.range(-300, -50) : Random.range(canvas.width + 50, canvas.width + 300);
                        this.startY = Random.range(0, canvas.height);
                    }

                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.x = this.startX;
                    this.y = this.startY;
                    this.color = color;

                    const baseSize = 2.5;
                    this.size = config.particles.enabled ?
                        Random.varyPercent(baseSize, config.particles.sizeVariance) : baseSize;
                    this.opacity = 0;
                }

                update(progress) {
                    const eased = easeOutCubic(progress);
                    this.x = this.startX + (this.targetX - this.startX) * eased;
                    this.y = this.startY + (this.targetY - this.startY) * eased;
                    this.opacity = Math.min(1, progress * 2);
                }

                draw() {
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            function samplePath(path, spacing = 4) {
                const points = [];
                const totalLength = path.getTotalLength();
                const adjustedSpacing = config.particles.enabled ?
                    Random.varyPercent(spacing, config.particles.spacingVariance) : spacing;

                for (let i = 0; i < totalLength; i += adjustedSpacing) {
                    const point = path.getPointAtLength(i);
                    points.push({ x: point.x, y: point.y });
                }
                return points;
            }

            function initializeParameters() {
                // Select random mode
                selectedMode = Random.pick(modes);
                console.log(`Particle mode: ${selectedMode.name}`);

                // Config
                config = {
                    particles: {
                        enabled: true,
                        sizeVariance: 0.3,
                        spacingVariance: 0.15
                    },
                    timing: {
                        enabled: true,
                        durationVariance: 0.2
                    },
                    colors: {
                        enabled: true,
                        hueShift: Random.range(-10, 10)
                    }
                };

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', canvas.width);
                svg.setAttribute('height', canvas.height);
                svg.setAttribute('viewBox', '0 0 600 200');
                svg.style.position = 'absolute';
                svg.style.visibility = 'hidden';
                document.body.appendChild(svg);

                particles = [];

                // Apply color shift
                const shiftHue = (h) => (h + config.colors.hueShift + 360) % 360;
                colors = config.colors.enabled ? {
                    cyan: `hsl(${shiftHue(190)}, 100%, 50%)`,
                    purple: `hsl(${shiftHue(265)}, 85%, 57%)`,
                    pink: `hsl(${shiftHue(340)}, 100%, 63%)`
                } : {
                    cyan: '#00d4ff',
                    purple: '#7b2ff7',
                    pink: '#ff2d75'
                };

                const paths = [
                    { d: 'M 40 40 L 40 160 L 100 160', color: colors.cyan },
                    { d: 'M 150 60 A 40 40 0 1 1 149.99 60.01', color: colors.purple },
                    { d: 'M 240 60 A 40 40 0 1 1 239.99 60.01', color: colors.purple },
                    { d: 'M 300 160 L 300 40 L 350 100 L 400 40 L 400 160', color: colors.pink },
                    { d: 'M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160', color: colors.cyan },
                    { d: 'M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160', color: colors.cyan }
                ];

                paths.forEach(pathData => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData.d);
                    path.setAttribute('stroke', pathData.color);
                    path.setAttribute('stroke-width', '12');
                    path.setAttribute('fill', 'none');
                    svg.appendChild(path);

                    const points = samplePath(path, 4);
                    points.forEach(point => {
                        particles.push(new Particle(point.x, point.y, pathData.color, selectedMode.startPattern));
                    });
                });

                document.body.removeChild(svg);

                const baseDuration = 2000;
                duration = config.timing.enabled ?
                    Random.varyPercent(baseDuration, config.timing.durationVariance) : baseDuration;
            }

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            function easeInCubic(t) {
                return t * t * t;
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / duration);

                    particles.forEach(particle => {
                        particle.update(progress);
                        particle.draw();
                    });

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                        requestAnimationFrame(animate);
                    }
                } else if (animationState === 'hold') {
                    // Keep drawing at final position
                    particles.forEach(particle => {
                        particle.draw();
                    });
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    particles.forEach(particle => {
                        // Scatter outward from target position
                        const angle = Math.random() * Math.PI * 2;
                        const distance = 300 * eased;
                        particle.x = particle.targetX + Math.cos(angle) * distance * (1 + Math.random());
                        particle.y = particle.targetY + Math.sin(angle) * distance * (1 + Math.random());
                        particle.opacity = 1 - eased;
                        particle.draw();
                    });

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                initializeParameters();  // Regenerate all random parameters
                startTime = null;
                animationState = 'entrance';
                requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            canvas.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
