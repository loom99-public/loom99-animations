<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - 3D Transform Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            perspective: 1200px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .text-container {
            text-align: center;
            transform-style: preserve-3d;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            transform-style: preserve-3d;
            opacity: 0;
        }

        .word1 {
            color: #ff2d2d;
            text-shadow: 0 0 25px rgba(255, 45, 45, 0.9), 3px 3px 6px rgba(0,0,0,0.6);
        }

        .word2 {
            color: #ff6b00;
            text-shadow: 0 0 25px rgba(255, 107, 0, 0.9), 3px 3px 6px rgba(0,0,0,0.6);
        }

        .word3 {
            color: #ffdd00;
            text-shadow: 0 0 25px rgba(255, 221, 0, 0.9), 3px 3px 6px rgba(0,0,0,0.6);
        }

        @media (prefers-reduced-motion: reduce) {
            body { perspective: none; }
            .text-container,
            .word {
                transform: none !important;
                opacity: 1 !important;
                transform-style: flat !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1">DO</div>
            <div class="word word2">MORE</div>
            <div class="word word3">NOW</div>
        </div>
    </div>

    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 300;

            const words = document.querySelectorAll('.word');

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            function easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
            }

            class Word3D {
                constructor(element, delay, rotationAxis) {
                    this.element = element;
                    this.delay = delay;
                    this.duration = 1800;
                    this.rotationAxis = rotationAxis; // 'X', 'Y', or 'Z'
                }

                updateEntrance(elapsed) {
                    if (elapsed < this.delay) {
                        return;
                    }

                    const localTime = elapsed - this.delay;
                    const progress = Math.min(1, localTime / this.duration);
                    const eased = easeInOutQuart(progress);

                    let rotateX = 0, rotateY = 0, rotateZ = 0;
                    const translateZ = -400 * (1 - eased);
                    const scale = 0.3 + 0.7 * eased;

                    // More dramatic rotations based on axis
                    if (this.rotationAxis === 'X') {
                        rotateX = 180 * (1 - eased);
                        rotateY = 45 * Math.sin(progress * Math.PI);
                    } else if (this.rotationAxis === 'Y') {
                        rotateY = 360 * (1 - eased);
                        rotateX = 30 * Math.sin(progress * Math.PI);
                    } else if (this.rotationAxis === 'Z') {
                        rotateZ = 720 * (1 - eased);
                        rotateY = 45 * Math.sin(progress * Math.PI);
                    }

                    this.element.style.transform = `
                        translateZ(${translateZ}px)
                        rotateX(${rotateX}deg)
                        rotateY(${rotateY}deg)
                        rotateZ(${rotateZ}deg)
                        scale(${scale})
                    `;
                    this.element.style.opacity = eased;
                }

                updateExit(elapsed) {
                    const progress = Math.min(1, elapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    let rotateX = 0, rotateY = 0, rotateZ = 0;
                    const translateZ = -600 * eased;
                    const scale = 1 - 0.7 * eased;

                    // Dramatic exit rotations
                    if (this.rotationAxis === 'X') {
                        rotateX = -180 * eased;
                        rotateZ = 45 * eased;
                    } else if (this.rotationAxis === 'Y') {
                        rotateY = -360 * eased;
                        rotateX = -60 * eased;
                    } else if (this.rotationAxis === 'Z') {
                        rotateZ = -540 * eased;
                        rotateY = 90 * eased;
                    }

                    this.element.style.transform = `
                        translateZ(${translateZ}px)
                        rotateX(${rotateX}deg)
                        rotateY(${rotateY}deg)
                        rotateZ(${rotateZ}deg)
                        scale(${scale})
                    `;
                    this.element.style.opacity = 1 - eased;
                }

                reset() {
                    this.element.style.opacity = 0;
                    this.element.style.transform = '';
                }
            }

            const wordAnimations = [
                new Word3D(words[0], 0, 'Y'),
                new Word3D(words[1], 300, 'X'),
                new Word3D(words[2], 600, 'Z')
            ];

            let startTime = null;
            const totalDuration = 2800;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    wordAnimations.forEach(word => word.updateEntrance(elapsed));

                    if (elapsed < totalDuration) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    wordAnimations.forEach(word => word.updateExit(exitElapsed));

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                wordAnimations.forEach(word => {
                    word.reset();
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            document.querySelectorAll('.word').forEach(word => {
                word.style.opacity = 1;
            });
        }
    </script>
</body>
</html>
