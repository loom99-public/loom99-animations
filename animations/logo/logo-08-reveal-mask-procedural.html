<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Reveal Mask Animation (Procedural)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            svg rect, svg circle {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>

                <mask id="wipe">
                    <rect id="maskRect" x="0" y="0" width="600" height="200" fill="white"/>
                    <circle id="maskCircle" cx="300" cy="100" r="0" fill="black"/>
                </mask>
            </defs>

            <g mask="url(#wipe)">
                <path d="M 40 40 L 40 160 L 100 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
                <circle cx="150" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
                <circle cx="240" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
                <path d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #ff2d75)"/>
                <path d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
                <path d="M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            </g>
        </svg>
    </div>

    <script>
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
        };

        // Wild reveal configurations
        const revealTypes = [
            'horizontal', 'vertical', 'diagonal', 'radial', 'iris', 'multi-rect'
        ];

        let revealType;
        let config;
        let easing;

        function initializeParameters() {
            revealType = Random.pick(revealTypes);
            console.log('Reveal type:', revealType);

            config = {
                type: revealType,
                duration: Random.range(1000, 3000),
                startX: Random.range(-800, 800),
                startY: Random.range(-300, 300),
                angle: Random.range(0, 360)
            };

            // Random easing
            const easings = [
                t => t,
                t => 1 - Math.pow(1 - t, 3),
                t => t * t,
                t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t
            ];
            easing = Random.pick(easings);
        }

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const maskRect = document.getElementById('maskRect');
            const maskCircle = document.getElementById('maskCircle');

            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(1, elapsed / config.duration);
                const eased = easing(progress);

                if (config.type === 'radial' || config.type === 'iris') {
                    // Radial reveal
                    const maxRadius = 500;
                    maskCircle.setAttribute('r', maxRadius * eased);
                    maskRect.setAttribute('width', 0);
                } else if (config.type === 'diagonal') {
                    // Diagonal wipe
                    const x = config.startX + (0 - config.startX) * eased;
                    const y = config.startY + (0 - config.startY) * eased;
                    maskRect.setAttribute('x', x);
                    maskRect.setAttribute('y', y);
                    maskRect.setAttribute('width', 600);
                    maskRect.setAttribute('height', 200);
                    maskRect.setAttribute('transform', `rotate(${config.angle} 300 100)`);
                } else if (config.type === 'horizontal') {
                    const x = Random.range(-600, 600) * (1 - eased);
                    maskRect.setAttribute('x', x);
                    maskRect.setAttribute('width', 600);
                    maskRect.setAttribute('height', 200);
                } else if (config.type === 'vertical') {
                    const y = Random.range(-200, 200) * (1 - eased);
                    maskRect.setAttribute('y', y);
                    maskRect.setAttribute('width', 600);
                    maskRect.setAttribute('height', 200);
                } else {
                    // Default random
                    const x = config.startX * (1 - eased);
                    const y = config.startY * (1 - eased);
                    maskRect.setAttribute('x', x);
                    maskRect.setAttribute('y', y);
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            function restart() {
                initializeParameters();
                startTime = null;
                maskRect.setAttribute('x', config.startX);
                maskRect.setAttribute('y', config.startY);
                maskRect.setAttribute('width', 600);
                maskRect.setAttribute('height', 200);
                maskCircle.setAttribute('r', 0);
                requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', restart);
        } else {
            const maskRect = document.getElementById('maskRect');
            maskRect.setAttribute('x', 0);
            maskRect.setAttribute('y', 0);
        }
    </script>
</body>
</html>
