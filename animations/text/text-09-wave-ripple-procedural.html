<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Do More Now - Wave Ripple Animation (Procedural)</title>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; } .container { width: 100%; max-width: 1000px; padding: 20px; } .text-container { text-align: center; } .word { display: block; font-size: 80px; font-weight: 900; line-height: 1.2; } .letter { display: inline-block; } @media (prefers-reduced-motion: reduce) { .letter { transform: none !important; } }</style>
</head>
<body>
    <div class="container"><div class="text-container"><div class="word word1" id="word1"></div><div class="word word2" id="word2"></div><div class="word word3" id="word3"></div></div></div>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Read URL parameters from gallery editor
        const urlParams = new URLSearchParams(window.location.search);
        const paramDuration = urlParams.get('duration');
        const paramHueShift = urlParams.get('hueShift');
        const paramHoldDuration = urlParams.get('holdDuration');

        const Random = { range: (min, max) => min + Math.random() * (max - min), int: (min, max) => Math.floor(Random.range(min, max + 1)) };

        // Variables that will be regenerated on each restart
        let config;
        let letters;

        const ColorRandom = { baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } }, shiftColor: (hsl, hueShift, satShift, lightShift) => ({ h: (hsl.h + hueShift + 360) % 360, s: Math.max(0, Math.min(100, hsl.s + satShift)), l: Math.max(0, Math.min(100, hsl.l + lightShift)) }), toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` };

        function initializeParameters() {
            // Clear existing letters from DOM
            const words = [ { text: 'DO', element: document.getElementById('word1') }, { text: 'MORE', element: document.getElementById('word2') }, { text: 'NOW', element: document.getElementById('word3') } ];
            words.forEach(word => { while (word.element.firstChild) { word.element.removeChild(word.element.firstChild); } });

            // Generate config
            config = { hueShift: Random.range(-60, 60), satShift: Random.range(-30, 30), lightShift: Random.range(-15, 15), amplitude: Random.range(15, 60), waveCount: Random.range(1, 8), speed: Random.range(1, 6), duration: Random.range(2000, 5000), scaleAmp: Random.range(0.1, 0.5), rotAmp: Random.range(0, 30), freq1: Random.range(1, 5), freq2: Random.range(1, 5), phase1: Random.range(0, Math.PI * 2), phase2: Random.range(0, Math.PI * 2) };

            // Create letters array
            letters = [];
            words.forEach((word, wordIndex) => {
                const chars = word.text.split('');
                chars.forEach((char, charIndex) => {
                    const span = document.createElement('span'); span.className = 'letter'; span.textContent = char;
                    const colors = [ColorRandom.baseColors.red, ColorRandom.baseColors.orange, ColorRandom.baseColors.yellow];
                    const color = ColorRandom.toHSL(ColorRandom.shiftColor(colors[wordIndex], config.hueShift, config.satShift, config.lightShift));
                    span.style.color = color; span.style.textShadow = `0 0 20px ${color}`;
                    word.element.appendChild(span);
                    letters.push({ element: span, index: letters.length, baseDelay: Random.range(0, 500), phaseOffset: Random.range(0, Math.PI * 2) });
                });
            });
        }

        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = paramHoldDuration ? parseInt(paramHoldDuration) : 2000;
        const EXIT_DURATION = 250;

        let startTime = null;

        function easeInCubic(t) {
            return t * t * t;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                letters.forEach((letter, i) => {
                    const time = (elapsed + letter.baseDelay) / 1000;
                    const wavePhase = (i / letters.length) * Math.PI * 2 * config.waveCount + letter.phaseOffset;
                    const y = (Math.sin(time * config.freq1 + wavePhase + config.phase1) + Math.cos(time * config.freq2 + wavePhase * 0.5 + config.phase2)) * config.amplitude * 0.5 * Math.max(0, 1 - elapsed / config.duration);
                    const scale = 1 + Math.sin(time * config.speed + wavePhase) * config.scaleAmp * Math.max(0, 1 - elapsed / config.duration);
                    const rotation = Math.sin(time * (config.speed * 0.7) + wavePhase * 1.3) * config.rotAmp * Math.max(0, 1 - elapsed / config.duration);
                    letter.element.style.transform = `translateY(${y}px) scale(${scale}) rotate(${rotation}deg)`;
                });
                if (elapsed < config.duration) {
                    requestAnimationFrame(animate);
                } else {
                    letters.forEach(letter => { letter.element.style.transform = 'none'; });
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(exitProgress);

                // Collapse inward with wave
                letters.forEach((letter, i) => {
                    const centerProgress = i / (letters.length - 1);
                    const waveDelay = Math.abs(centerProgress - 0.5) * 2;
                    const adjustedProgress = Math.max(0, Math.min(1, (eased - waveDelay * 0.3) / 0.7));

                    const scale = 1 - adjustedProgress;
                    const y = -100 * adjustedProgress;
                    const opacity = 1 - adjustedProgress;

                    letter.element.style.transform = `translateY(${y}px) scale(${scale})`;
                    letter.element.style.opacity = opacity;
                });

                if (exitProgress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    restart();
                }
            }
        }

        function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            exitStartTime = null;
            letters.forEach(letter => { letter.element.style.opacity = 1; });
            requestAnimationFrame(animate);
        }

        
        // Update text content from path data
        function updateTextFromPaths(pathData) {
            // This animation accepts dynamic text paths via postMessage
            // The gallery editor sends path data when "Generate" is clicked
            console.log('Received text paths:', pathData);
        }

        // Listen for messages from parent (gallery editor)
        window.addEventListener('message', function(event) {
            // Validate origin - allow same origin and localhost dev servers
            const allowedOrigins = [
                window.location.origin,
                "http://localhost:8888",
                "http://127.0.0.1:8888",
                "null"  // file:// protocol for local development
            ];

            if (!allowedOrigins.includes(event.origin)) {
                console.warn("Rejected postMessage from unauthorized origin:", event.origin);
                return;
            }

            if (event.data && event.data.type === 'updateTextPaths') {
                updateTextFromPaths(event.data.pathData);
            }
        });

        if (!prefersReducedMotion) {
            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
