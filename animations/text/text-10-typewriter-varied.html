<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Do More Now - Typewriter Animation (Varied)</title>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Courier New', monospace; } .container { width: 100%; max-width: 1000px; padding: 20px; } .text-container { text-align: left; padding: 40px; } .word { display: block; font-size: 80px; font-weight: 900; line-height: 1.3; font-family: 'Courier New', monospace; } .letter { opacity: 0; } .cursor { display: inline-block; width: 4px; height: 80px; background: currentColor; margin-left: 2px; animation: blink 0.7s infinite; vertical-align: text-bottom; } @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } } .word1 { color: #ff2d2d; text-shadow: 0 0 10px rgba(255, 45, 45, 0.5); } .word2 { color: #ff6b00; text-shadow: 0 0 10px rgba(255, 107, 0, 0.5); } .word3 { color: #ffdd00; text-shadow: 0 0 10px rgba(255, 221, 0, 0.5); } @media (prefers-reduced-motion: reduce) { .letter { opacity: 1 !important; } .cursor { display: none !important; } }</style>
</head>
<body>
    <div class="container"><div class="text-container"><div class="word word1" id="word1"><span class="cursor"></span></div><div class="word word2" id="word2"><span class="cursor" style="height: 60px"></span></div><div class="word word3" id="word3"><span class="cursor"></span></div></div></div>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const Random = { range: (min, max) => min + Math.random() * (max - min), pick: (arr) => arr[Math.floor(Math.random() * arr.length)], vary: (base, v) => base + Random.range(-v, v), int: (min, max) => Math.floor(Random.range(min, max + 1)) };
        const modes = [ { name: 'steady', getDelay: () => Random.vary(100, 20), pauseBetween: 500 }, { name: 'fast', getDelay: () => Random.vary(60, 15), pauseBetween: 300 }, { name: 'hunt-peck', getDelay: () => Random.range(50, 200), pauseBetween: Random.range(400, 800) } ];

        // Variables that will be regenerated on each restart
        let mode;
        let config;
        let words;
        let currentWordIndex;
        let currentCharIndex;

        const ColorRandom = { baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } }, shiftHue: (hsl, shift) => ({ h: (hsl.h + shift + 360) % 360, s: hsl.s, l: hsl.l }), toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` };

        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let deleteTimeout = null;

        function easeInCubic(t) { return t * t * t; }

        function typeCharacter() {
            if (animationState !== 'entrance') return;
            if (currentWordIndex >= words.length) {
                words.forEach(word => { const cursor = word.element.querySelector('.cursor'); cursor.style.display = 'none'; });
                animationState = 'hold';
                return;
            }
            const word = words[currentWordIndex], chars = word.text.split('');
            if (currentCharIndex === 0) { const cursor = word.element.querySelector('.cursor'); cursor.style.display = 'inline-block'; }
            if (currentCharIndex < chars.length) {
                const span = document.createElement('span'); span.className = 'letter'; span.textContent = chars[currentCharIndex]; span.style.opacity = '1';
                const cursor = word.element.querySelector('.cursor'); word.element.insertBefore(span, cursor);
                currentCharIndex++; setTimeout(typeCharacter, config.charDelay());
            } else {
                const cursor = word.element.querySelector('.cursor'); cursor.style.display = 'none';
                currentWordIndex++; currentCharIndex = 0;
                const nextWord = words[currentWordIndex];
                if (nextWord) { setTimeout(typeCharacter, nextWord.delay); }
                else { typeCharacter(); }
            }
        }

        function deleteCharacter() {
            if (animationState !== 'exit') return;

            // Find the last word with letters
            for (let i = words.length - 1; i >= 0; i--) {
                const word = words[i];
                const letters = word.element.querySelectorAll('.letter');
                if (letters.length > 0) {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'inline-block';
                    letters[letters.length - 1].remove();
                    deleteTimeout = setTimeout(deleteCharacter, config.charDelay() * 0.5);
                    return;
                }
            }

            // All characters deleted
            restart();
        }

        function initializeParameters() {
            // Select mode and config
            mode = Random.pick(modes);
            config = { hueShift: Random.range(-15, 15), charDelay: mode.getDelay, pauseDelay: mode.pauseBetween };
            console.log('Typewriter mode:', mode.name);

            // Apply colors
            document.querySelector('.word1').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.red, config.hueShift));
            document.querySelector('.word2').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.orange, config.hueShift));
            document.querySelector('.word3').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.yellow, config.hueShift));

            // Setup words
            words = [ { text: 'DO', element: document.getElementById('word1'), delay: 0 }, { text: 'MORE', element: document.getElementById('word2'), delay: config.pauseDelay }, { text: 'NOW', element: document.getElementById('word3'), delay: config.pauseDelay } ];

            // Reset state
            currentWordIndex = 0;
            currentCharIndex = 0;

            // Clear existing letters
            words.forEach(word => { const letters = word.element.querySelectorAll('.letter'); letters.forEach(letter => letter.remove()); const cursor = word.element.querySelector('.cursor'); cursor.style.display = 'none'; });
        }

        function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            if (deleteTimeout) clearTimeout(deleteTimeout);
            words.forEach(word => { const cursor = word.element.querySelector('.cursor'); cursor.style.display = 'none'; });
            animationState = 'exit';
            deleteTimeout = setTimeout(deleteCharacter, 100);
        }

        function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            if (deleteTimeout) clearTimeout(deleteTimeout);
            animationState = 'entrance';
            initializeParameters();  // Regenerate all random parameters
            setTimeout(typeCharacter, words[0].delay);
        }

        if (!prefersReducedMotion) {
            initializeParameters();
            setTimeout(typeCharacter, words[0].delay);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            const staticWords = [ { text: 'DO', element: document.getElementById('word1') }, { text: 'MORE', element: document.getElementById('word2') }, { text: 'NOW', element: document.getElementById('word3') } ];
            staticWords.forEach(word => {
                const chars = word.text.split(''), cursor = word.element.querySelector('.cursor');
                chars.forEach(char => { const span = document.createElement('span'); span.className = 'letter'; span.textContent = char; span.style.opacity = '1'; word.element.insertBefore(span, cursor); });
                cursor.style.display = 'none';
            });
        }
    </script>
</body>
</html>
