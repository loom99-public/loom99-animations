<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - 3D Transform Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            perspective: 1000px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .text-container {
            text-align: center;
            transform-style: preserve-3d;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            transform-style: preserve-3d;
            opacity: 0;
        }

        .word1 {
            color: #ff2d2d;
            text-shadow: 0 0 20px rgba(255, 45, 45, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
        }

        .word2 {
            color: #ff6b00;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
        }

        .word3 {
            color: #ffdd00;
            text-shadow: 0 0 20px rgba(255, 221, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
        }

        @media (prefers-reduced-motion: reduce) {
            body { perspective: none; }
            .text-container,
            .word {
                transform: none !important;
                opacity: 1 !important;
                transform-style: flat !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1">DO</div>
            <div class="word word2">IT</div>
            <div class="word word3">NOW!</div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const words = document.querySelectorAll('.word');

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            class Word3D {
                constructor(element, delay, rotationAxis) {
                    this.element = element;
                    this.delay = delay;
                    this.duration = 1500;
                    this.rotationAxis = rotationAxis; // 'X', 'Y', or 'Z'
                }

                update(elapsed) {
                    if (elapsed < this.delay) {
                        return;
                    }

                    const localTime = elapsed - this.delay;
                    const progress = Math.min(1, localTime / this.duration);
                    const eased = easeOutCubic(progress);

                    let rotateX = 0, rotateY = 0, rotateZ = 0;
                    const translateZ = -200 * (1 - eased);

                    if (this.rotationAxis === 'X') {
                        rotateX = 90 * (1 - eased);
                    } else if (this.rotationAxis === 'Y') {
                        rotateY = 180 * (1 - eased);
                    } else if (this.rotationAxis === 'Z') {
                        rotateZ = 360 * (1 - eased);
                    }

                    this.element.style.transform = `
                        translateZ(${translateZ}px)
                        rotateX(${rotateX}deg)
                        rotateY(${rotateY}deg)
                        rotateZ(${rotateZ}deg)
                    `;
                    this.element.style.opacity = eased;
                }
            }

            const wordAnimations = [
                new Word3D(words[0], 0, 'Y'),
                new Word3D(words[1], 300, 'X'),
                new Word3D(words[2], 600, 'Z')
            ];

            let startTime = null;
            const totalDuration = 2500;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                wordAnimations.forEach(word => word.update(elapsed));

                if (elapsed < totalDuration) {
                    requestAnimationFrame(animate);
                }
            }

            function restart() {
                startTime = null;
                wordAnimations.forEach(word => {
                    word.element.style.opacity = 0;
                    word.element.style.transform = '';
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
            document.body.addEventListener('click', restart);
        } else {
            document.querySelectorAll('.word').forEach(word => {
                word.style.opacity = 1;
            });
        }
    </script>
</body>
</html>
