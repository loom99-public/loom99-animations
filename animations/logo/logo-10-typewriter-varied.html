<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Typewriter Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .logo-text {
            font-size: 100px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            position: relative;
        }

        .letter {
            opacity: 0;
        }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 100px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            margin-left: 4px;
            vertical-align: text-bottom;
        }

        .cursor.blink {
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
            }
            .cursor {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text" id="logo">
            <span class="cursor blink"></span>
        </div>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
        };

        // Typing speed modes
        const modes = [
            {
                name: 'fast',
                baseDelay: 80,
                variance: 30,
                pauseProbability: 0.1,
                pauseDuration: 200,
                blinkSpeed: 0.5,
                description: 'Fast typing'
            },
            {
                name: 'normal',
                baseDelay: 150,
                variance: 50,
                pauseProbability: 0.2,
                pauseDuration: 400,
                blinkSpeed: 0.7,
                description: 'Normal typing speed'
            },
            {
                name: 'slow',
                baseDelay: 250,
                variance: 80,
                pauseProbability: 0.3,
                pauseDuration: 600,
                blinkSpeed: 1.0,
                description: 'Slow deliberate typing'
            }
        ];

        const selectedMode = Random.pick(modes);
        console.log(`Typewriter mode: ${selectedMode.name} - ${selectedMode.description}`);

        // Randomization config
        const config = {
            timing: {
                enabled: true,
                useMode: true
            }
        };

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const text = 'loom99';
        const logo = document.getElementById('logo');
        const cursor = logo.querySelector('.cursor');

        // Update cursor blink speed
        cursor.style.animationDuration = `${selectedMode.blinkSpeed}s`;

        if (!prefersReducedMotion) {
            let currentIndex = 0;

            function typeCharacter() {
                if (currentIndex >= text.length) {
                    setTimeout(() => {
                        cursor.style.display = 'none';
                    }, 1000);
                    return;
                }

                const char = text[currentIndex];
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.opacity = '1';

                logo.insertBefore(span, cursor);

                currentIndex++;

                // Random pause before next character
                const shouldPause = config.timing.useMode &&
                                  Math.random() < selectedMode.pauseProbability;
                const delay = config.timing.useMode ?
                    Random.range(selectedMode.baseDelay - selectedMode.variance / 2,
                               selectedMode.baseDelay + selectedMode.variance / 2) :
                    150;

                const nextDelay = shouldPause ?
                    delay + selectedMode.pauseDuration : delay;

                setTimeout(typeCharacter, nextDelay);
            }

            function restart() {
                currentIndex = 0;

                const letters = logo.querySelectorAll('.letter');
                letters.forEach(letter => letter.remove());

                cursor.style.display = 'inline-block';

                setTimeout(typeCharacter, 500);
            }

            setTimeout(typeCharacter, 500);
            document.body.addEventListener('click', restart);
        } else {
            cursor.style.display = 'none';

            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.opacity = '1';
                logo.insertBefore(span, cursor);
            });
        }
    </script>
</body>
</html>
