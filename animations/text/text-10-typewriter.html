<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Typewriter Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .text-container {
            text-align: left;
            padding: 40px;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.3;
            font-family: 'Courier New', monospace;
        }

        .letter {
            opacity: 0;
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 4px;
            height: 80px;
            background: currentColor;
            margin-left: 2px;
            animation: blink 0.7s infinite, pulse 1.5s ease-in-out infinite;
            vertical-align: text-bottom;
            box-shadow: 0 0 12px currentColor;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.15); }
        }

        @keyframes letterBounce {
            0% { transform: scale(1.4) translateY(-8px); }
            40% { transform: scale(0.85) translateY(3px); }
            70% { transform: scale(1.05) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }

        .letter-bounce {
            animation: letterBounce 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .word1 {
            color: #ff2d2d;
            text-shadow: 0 0 12px rgba(255, 45, 45, 0.6);
        }

        .word2 {
            color: #ff6b00;
            text-shadow: 0 0 12px rgba(255, 107, 0, 0.6);
        }

        .word3 {
            color: #ffdd00;
            text-shadow: 0 0 12px rgba(255, 221, 0, 0.6);
        }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
                animation: none !important;
            }
            .cursor {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1" id="word1">
                <span class="cursor"></span>
            </div>
            <div class="word word2" id="word2">
                <span class="cursor" style="height: 60px"></span>
            </div>
            <div class="word word3" id="word3">
                <span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const words = [
            { text: 'DO', element: document.getElementById('word1'), delay: 0 },
            { text: 'MORE', element: document.getElementById('word2'), delay: 400 },
            { text: 'NOW', element: document.getElementById('word3'), delay: 700 }
        ];

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let currentWordIndex = 0;
            let currentCharIndex = 0;
            let exitWordIndex = 0;
            let exitCharIndex = 0;
            const charDelay = 90;
            const exitCharDelay = 20;

            words.forEach(word => {
                const cursor = word.element.querySelector('.cursor');
                cursor.style.display = 'none';
            });

            function typeCharacter() {
                if (currentWordIndex >= words.length) {
                    // Typing complete
                    words.forEach(word => {
                        const cursor = word.element.querySelector('.cursor');
                        cursor.style.display = 'none';
                    });
                    animationState = 'hold';
                    return;
                }

                const word = words[currentWordIndex];
                const chars = word.text.split('');

                if (currentCharIndex === 0) {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'inline-block';
                }

                if (currentCharIndex < chars.length) {
                    const span = document.createElement('span');
                    span.className = 'letter letter-bounce';
                    span.textContent = chars[currentCharIndex];
                    span.style.opacity = '1';

                    const cursor = word.element.querySelector('.cursor');
                    word.element.insertBefore(span, cursor);

                    // Remove bounce class after animation
                    setTimeout(() => {
                        span.classList.remove('letter-bounce');
                    }, 400);

                    currentCharIndex++;
                    setTimeout(typeCharacter, charDelay);
                } else {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';

                    currentWordIndex++;
                    currentCharIndex = 0;

                    const nextWord = words[currentWordIndex];
                    if (nextWord) {
                        setTimeout(typeCharacter, nextWord.delay);
                    } else {
                        typeCharacter();
                    }
                }
            }

            function deleteCharacter() {
                if (exitWordIndex < 0) {
                    restart();
                    return;
                }

                const word = words[exitWordIndex];
                const letters = word.element.querySelectorAll('.letter');

                if (exitCharIndex < 0) {
                    exitWordIndex--;
                    if (exitWordIndex >= 0) {
                        const prevWord = words[exitWordIndex];
                        const prevLetters = prevWord.element.querySelectorAll('.letter');
                        exitCharIndex = prevLetters.length - 1;

                        const cursor = prevWord.element.querySelector('.cursor');
                        cursor.style.display = 'inline-block';
                    }
                    setTimeout(deleteCharacter, exitCharDelay);
                } else {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'inline-block';

                    if (letters[exitCharIndex]) {
                        letters[exitCharIndex].style.opacity = '0';
                        letters[exitCharIndex].style.transform = 'scale(0.3)';
                        letters[exitCharIndex].style.transition = 'all 0.08s ease-out';

                        setTimeout(() => {
                            letters[exitCharIndex].remove();
                        }, 80);
                    }

                    exitCharIndex--;
                    setTimeout(deleteCharacter, exitCharDelay);
                }
            }

            function startExit() {
                if (holdTimeout) clearTimeout(holdTimeout);
                animationState = 'exit';

                exitWordIndex = words.length - 1;
                const lastWord = words[exitWordIndex];
                const lastLetters = lastWord.element.querySelectorAll('.letter');
                exitCharIndex = lastLetters.length - 1;

                words.forEach(word => {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';
                });

                deleteCharacter();
            }

            function restart() {
                if (holdTimeout) clearTimeout(holdTimeout);
                currentWordIndex = 0;
                currentCharIndex = 0;
                animationState = 'entrance';

                words.forEach(word => {
                    const letters = word.element.querySelectorAll('.letter');
                    letters.forEach(letter => letter.remove());

                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';
                });

                setTimeout(typeCharacter, words[0].delay);
            }

            setTimeout(typeCharacter, words[0].delay);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            words.forEach(word => {
                const chars = word.text.split('');
                const cursor = word.element.querySelector('.cursor');

                chars.forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'letter';
                    span.textContent = char;
                    span.style.opacity = '1';
                    word.element.insertBefore(span, cursor);
                });

                cursor.style.display = 'none';
            });
        }
    </script>
</body>
</html>
