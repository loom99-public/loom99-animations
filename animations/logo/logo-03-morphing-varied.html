<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Morphing Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            svg path {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };

        // Morphing mode variations
        const modes = [
            {
                name: 'geometric',
                shapes: {
                    L: 'M 40 40 L 100 40 L 100 100 L 40 100 Z',
                    O1: 'M 130 80 L 170 80 L 170 120 L 130 120 Z',
                    O2: 'M 220 80 L 260 80 L 260 120 L 220 120 Z',
                    M: 'M 300 80 L 400 80 L 400 120 L 300 120 Z',
                    N1: 'M 460 80 L 500 80 L 500 120 L 460 120 Z',
                    N2: 'M 540 80 L 580 80 L 580 120 L 540 120 Z'
                },
                description: 'All morph from squares'
            },
            {
                name: 'organic',
                shapes: {
                    L: 'M 70 100 A 30 30 0 1 1 70 101',
                    O1: 'M 150 100 A 20 20 0 1 1 150 101',
                    O2: 'M 240 100 A 20 20 0 1 1 240 101',
                    M: 'M 350 100 A 50 50 0 1 1 350 101',
                    N1: 'M 480 100 A 20 20 0 1 1 480 101',
                    N2: 'M 560 100 A 20 20 0 1 1 560 101'
                },
                description: 'All morph from circles'
            },
            {
                name: 'angular',
                shapes: {
                    L: 'M 70 40 L 100 70 L 70 100 L 40 70 Z',
                    O1: 'M 150 80 L 170 100 L 150 120 L 130 100 Z',
                    O2: 'M 240 80 L 260 100 L 240 120 L 220 100 Z',
                    M: 'M 350 60 L 380 100 L 350 140 L 320 100 Z',
                    N1: 'M 480 80 L 500 100 L 480 120 L 460 100 Z',
                    N2: 'M 560 80 L 580 100 L 560 120 L 540 100 Z'
                },
                description: 'All morph from diamonds'
            }
        ];

        const selectedMode = Random.pick(modes);
        console.log(`Morphing mode: ${selectedMode.name} - ${selectedMode.description}`);

        // Randomization config
        const config = {
            timing: {
                enabled: true,
                durationVariance: 0.2,
                staggerVariance: 0.15
            },
            colors: {
                enabled: true,
                hueShift: Random.range(-15, 15)
            },
            motion: {
                enabled: true,
                useMode: true
            },
            effects: {
                enabled: true,
                strokeVariance: 1
            }
        };

        // Color utilities
        const ColorRandom = {
            baseColors: {
                cyan: { h: 190, s: 100, l: 50 },
                purple: { h: 265, s: 85, l: 57 },
                pink: { h: 340, s: 100, l: 63 }
            },
            shiftHue: (hsl, shift) => ({
                h: (hsl.h + shift + 360) % 360,
                s: hsl.s,
                l: hsl.l
            }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        const palette = config.colors.enabled ? {
            cyan: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.cyan, config.colors.hueShift)),
            purple: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.purple, config.colors.hueShift)),
            pink: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.pink, config.colors.hueShift))
        } : {
            cyan: '#00d4ff',
            purple: '#7b2ff7',
            pink: '#ff2d75'
        };

        const svg = document.getElementById('svg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Easing functions
        const easingFunctions = [
            t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
            t => 1 - Math.pow(1 - t, 3),
            t => t * t * (3 - 2 * t)
        ];
        const selectedEasing = Random.pick(easingFunctions);

        class MorphingPath {
            constructor(startPath, endPath, color, delay) {
                this.startPath = startPath;
                this.endPath = endPath;
                this.color = color;
                this.delay = delay;
                this.duration = config.timing.enabled ?
                    Random.varyPercent(1500, config.timing.durationVariance) : 1500;

                const strokeWidth = config.effects.enabled ?
                    Random.vary(12, config.effects.strokeVariance) : 12;

                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.setAttribute('stroke', color);
                this.path.setAttribute('stroke-width', strokeWidth);
                this.path.setAttribute('stroke-linecap', 'round');
                this.path.setAttribute('stroke-linejoin', 'round');
                this.path.setAttribute('fill', 'none');
                this.path.style.filter = `drop-shadow(0 0 8px ${color})`;
                this.path.style.opacity = '0';
                svg.appendChild(this.path);
            }

            interpolate(t) {
                const eased = selectedEasing(t);

                // Parse paths
                const start = this.parsePath(this.startPath);
                const end = this.parsePath(this.endPath);

                // Build interpolated path
                let d = '';
                const maxLen = Math.max(start.length, end.length);

                for (let i = 0; i < maxLen; i++) {
                    const s = start[i] || start[start.length - 1];
                    const e = end[i] || end[end.length - 1];

                    if (e.cmd === 'M' || e.cmd === 'L') {
                        const x = s.x + (e.x - s.x) * eased;
                        const y = s.y + (e.y - s.y) * eased;
                        d += `${i === 0 ? 'M' : ' L'} ${x} ${y}`;
                    } else if (e.cmd === 'A') {
                        const x = s.x + (e.x - s.x) * eased;
                        const y = s.y + (e.y - s.y) * eased;
                        d += ` A ${e.rx} ${e.ry} ${e.rot} ${e.laf} ${e.sf} ${x} ${y}`;
                    }
                }

                return d;
            }

            parsePath(d) {
                const points = [];
                const parts = d.match(/[MLAZ][^MLAZ]*/gi) || [];

                parts.forEach(part => {
                    const cmd = part[0];
                    const nums = part.slice(1).trim().split(/[\s,]+/).map(Number);

                    if (cmd === 'M' || cmd === 'L') {
                        points.push({ cmd, x: nums[0], y: nums[1] });
                    } else if (cmd === 'A') {
                        points.push({ cmd, rx: nums[0], ry: nums[1], rot: nums[2], laf: nums[3], sf: nums[4], x: nums[5], y: nums[6] });
                    } else if (cmd === 'Z') {
                        points.push({ cmd: 'Z' });
                    }
                });

                return points;
            }

            update(elapsed) {
                if (elapsed < this.delay) {
                    this.path.style.opacity = '0';
                    return;
                }

                this.path.style.opacity = '1';

                const localTime = elapsed - this.delay;
                const progress = Math.min(1, localTime / this.duration);

                const d = this.interpolate(progress);
                this.path.setAttribute('d', d);
            }
        }

        const paths = [];

        const BASE_STAGGER = config.timing.enabled ?
            Random.varyPercent(150, config.timing.staggerVariance) : 150;

        // L - morphs from selected start shape
        paths.push(new MorphingPath(
            selectedMode.shapes.L,
            'M 40 40 L 40 160 L 100 160',
            palette.cyan, 0
        ));

        // O (first)
        paths.push(new MorphingPath(
            selectedMode.shapes.O1,
            'M 150 60 A 40 40 0 1 1 150 140 A 40 40 0 1 1 150 60',
            palette.purple, BASE_STAGGER
        ));

        // O (second)
        paths.push(new MorphingPath(
            selectedMode.shapes.O2,
            'M 240 60 A 40 40 0 1 1 240 140 A 40 40 0 1 1 240 60',
            palette.purple, BASE_STAGGER * 2
        ));

        // M
        paths.push(new MorphingPath(
            selectedMode.shapes.M,
            'M 300 160 L 300 40 L 350 100 L 400 40 L 400 160',
            palette.pink, BASE_STAGGER * 3
        ));

        // 9 (first)
        paths.push(new MorphingPath(
            selectedMode.shapes.N1,
            'M 460 70 L 480 50 L 500 70 L 480 90 L 460 70 L 475 120 L 445 160',
            palette.cyan, BASE_STAGGER * 4
        ));

        // 9 (second)
        paths.push(new MorphingPath(
            selectedMode.shapes.N2,
            'M 540 70 L 560 50 L 580 70 L 560 90 L 540 70 L 555 120 L 525 160',
            palette.cyan, BASE_STAGGER * 5
        ));

        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            paths.forEach(path => path.update(elapsed));

            const maxTime = 2500;
            if (elapsed < maxTime) {
                requestAnimationFrame(animate);
            }
        }

        function restart() {
            startTime = null;
            paths.forEach(path => {
                path.path.style.opacity = '0';
            });
            requestAnimationFrame(animate);
        }

        if (prefersReducedMotion) {
            paths.forEach(path => {
                path.path.style.opacity = '1';
                path.path.setAttribute('d', path.endPath);
            });
        } else {
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
