<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Kinetic Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .logo-part {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-part {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>

            <g id="logo">
                <path class="logo-part" d="M 40 40 L 40 160 L 100 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
                <circle class="logo-part" cx="150" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
                <circle class="logo-part" cx="240" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
                <path class="logo-part" d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="#ff2d75" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #ff2d75)"/>
                <path class="logo-part" d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
                <path class="logo-part" d="M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            </g>
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };

        // Entry direction modes
        const modes = [
            {
                name: 'radial',
                getAngle: (index, total) => (index / total) * Math.PI * 2,
                description: 'Radial burst from all directions'
            },
            {
                name: 'sequential',
                getAngle: (index, total) => (index / total) * Math.PI * 4,
                description: 'Sequential spiral entry'
            },
            {
                name: 'opposing',
                getAngle: (index, total) => index % 2 === 0 ? 0 : Math.PI,
                description: 'Elements enter from left and right'
            }
        ];

        let selectedMode;
        let config;

        function initializeParameters() {
            selectedMode = Random.pick(modes);
            console.log(`Kinetic mode: ${selectedMode.name} - ${selectedMode.description}`);

            // Randomization config
            config = {
                timing: {
                    enabled: true,
                    durationVariance: 0.15,
                    delayVariance: 0.2
                },
                motion: {
                    enabled: true,
                    useMode: true,
                    rotationRange: Random.range(360, 720),
                    scaleRange: Random.range(0, 0.3),
                    bounceOvershoot: Random.range(1.5, 2.0)
                },
                effects: {
                    enabled: true
                }
            };
        }

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function easeOutBack(t) {
            const c1 = config.motion.bounceOvershoot;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        class LogoPart {
            constructor(element, delay, angle) {
                this.element = element;
                this.delay = config.timing.enabled ?
                    Random.varyPercent(delay, config.timing.delayVariance) : delay;
                this.duration = config.timing.enabled ?
                    Random.varyPercent(1200, config.timing.durationVariance) : 1200;

                const bbox = element.getBBox();
                this.centerX = bbox.x + bbox.width / 2;
                this.centerY = bbox.y + bbox.height / 2;

                const distance = 400;
                this.startX = Math.cos(angle) * distance;
                this.startY = Math.sin(angle) * distance;
                this.startRotation = config.motion.enabled ?
                    Random.range(-config.motion.rotationRange, config.motion.rotationRange) :
                    (Math.random() - 0.5) * 720;
                this.startScale = config.motion.enabled ?
                    config.motion.scaleRange : 0;
            }

            update(elapsed) {
                if (elapsed < this.delay) {
                    return;
                }

                const localTime = elapsed - this.delay;
                const progress = Math.min(1, localTime / this.duration);
                const eased = easeOutBack(progress);

                const x = this.startX * (1 - eased);
                const y = this.startY * (1 - eased);
                const rotation = this.startRotation * (1 - eased);
                const scale = this.startScale + (1 - this.startScale) * eased;

                this.element.style.transformOrigin = `${this.centerX}px ${this.centerY}px`;
                this.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
                this.element.style.opacity = Math.min(1, progress * 2);
            }
        }

        let parts = [];
        const elements = document.querySelectorAll('.logo-part');

        function createParts() {
            parts = [];
            elements.forEach((element, index) => {
                const angle = config.motion.useMode ?
                    selectedMode.getAngle(index, elements.length) :
                    (index / elements.length) * Math.PI * 2;
                const delay = index * 120;
                parts.push(new LogoPart(element, delay, angle));
            });
        }

        let startTime = null;
        const totalDuration = 2500;
        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
        const EXIT_DURATION = 250;

        function easeInCubic(t) {
            return t * t * t;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                parts.forEach(part => part.update(elapsed));

                if (elapsed < totalDuration) {
                    requestAnimationFrame(animate);
                } else {
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(progress);

                parts.forEach((part, index) => {
                    // Fly away in opposite direction
                    const angle = selectedMode.getAngle(index, parts.length) + Math.PI;
                    const distance = 500 * eased;
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;
                    const rotation = (Math.random() - 0.5) * 360 * eased;

                    part.element.style.transformOrigin = `${part.centerX}px ${part.centerY}px`;
                    part.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                    part.element.style.opacity = 1 - eased;
                });

                if (exitElapsed < EXIT_DURATION) {
                    requestAnimationFrame(animate);
                } else {
                    restart();
                }
            }
        }

        function startExit() {
                if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
                if (holdTimeout) clearTimeout(holdTimeout);
            initializeParameters();
            createParts();
            startTime = null;
            animationState = 'entrance';
            parts.forEach(part => {
                part.element.style.opacity = 0;
                part.element.style.transform = 'none';
            });
            requestAnimationFrame(animate);
        }

        if (prefersReducedMotion) {
            parts.forEach(part => {
                part.element.style.opacity = 1;
                part.element.style.transform = 'none';
            });
        } else {
            initializeParameters();
            createParts();
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', () => {
            if (animationState === 'hold') {
                startExit();
            } else if (animationState === 'entrance') {
                restart();
            }
        });
    </script>
</body>
</html>
