<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Morphing Animation (Procedural)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .container { width: 100%; max-width: 1000px; padding: 20px; }
        svg { width: 100%; height: auto; }
        @media (prefers-reduced-motion: reduce) { svg path { opacity: 1 !important; } }
    </style>
</head>
<body>
    <div class="container"><svg id="svg" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <script>
        const svg = document.getElementById('svg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };
        const ColorRandom = {
            baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } },
            shiftColor: (hsl, hueShift, satShift, lightShift) => ({ h: (hsl.h + hueShift + 360) % 360, s: Math.max(0, Math.min(100, hsl.s + satShift)), l: Math.max(0, Math.min(100, hsl.l + lightShift)) }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        // Variables that will be regenerated on each restart
        let config;
        let palette;
        let selectedEasing;
        let shapes;

        function interpolatePath(path1, path2, t) {
            const eased = selectedEasing(t);
            const points1 = parsePath(path1);
            const points2 = parsePath(path2);
            let result = '';
            for (let i = 0; i < points1.length; i++) {
                const p1 = points1[i]; const p2 = points2[i];
                if (p1.type === 'M' || p1.type === 'L') {
                    const x = p1.x + (p2.x - p1.x) * eased; const y = p1.y + (p2.y - p1.y) * eased;
                    result += `${i === 0 ? 'M' : ' L'} ${x} ${y}`;
                }
            }
            return result;
        }
        function parsePath(d) {
            const points = []; const commands = d.match(/[ML][^ML]*/g) || [];
            commands.forEach((cmd, i) => { const type = cmd[0]; const coords = cmd.slice(1).trim().split(/[\s,]+/).map(Number);
                if (type === 'M' || type === 'L') { points.push({ type: type, x: coords[0], y: coords[1] }); }
            });
            return points;
        }
        const getRandomStart = () => {
            const shapes = [
                () => { const x = Random.range(0, 700); const y = Random.range(0, 280); return `M ${x} ${y} L ${x} ${y}`; },
                () => { const x = Random.range(100, 600); const y = Random.range(50, 230); const s = Random.range(3, 20); return `M ${x} ${y} L ${x+s} ${y} L ${x+s} ${y+s} L ${x} ${y+s} L ${x} ${y}`; },
                () => { const x = Random.range(0, 700); const y = Random.range(0, 280); const r = Random.range(5, 30); return `M ${x-r} ${y} L ${x+r} ${y} L ${x} ${y-r} L ${x} ${y+r} L ${x-r} ${y}`; }
            ];
            return Random.pick(shapes)();
        };
        class MorphingShape {
            constructor(startPath, endPath, color, delay) {
                this.startPath = startPath; this.endPath = endPath; this.color = color;
                this.delay = Random.varyPercent(delay, config.timing.staggerVariance); this.progress = 0;
                const strokeWidth = Random.vary(4, config.effects.strokeVariance);
                const glowRadius = Random.vary(6, config.effects.glowVariance);
                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.setAttribute('stroke', color); this.path.setAttribute('stroke-width', Math.max(1, strokeWidth));
                this.path.setAttribute('stroke-linecap', 'round'); this.path.setAttribute('stroke-linejoin', 'round');
                this.path.setAttribute('fill', 'none'); this.path.style.filter = `drop-shadow(0 0 ${Math.max(0, glowRadius)}px ${color})`;
                this.path.style.opacity = '0'; svg.appendChild(this.path);
                this.duration = Random.range(600, 1800);
            }
            update(elapsed) {
                if (elapsed < this.delay) { this.path.style.opacity = '0'; return; }
                this.path.style.opacity = '1'; const localTime = elapsed - this.delay;
                this.progress = Math.min(1, localTime / this.duration);
                const d = interpolatePath(this.startPath, this.endPath, this.progress);
                this.path.setAttribute('d', d);
            }
        }

        function initializeParameters() {
            // Clear existing shapes from SVG
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            // Randomization config (heavy)
            config = {
                timing: { enabled: true, durationVariance: 0.5, staggerVariance: 0.6 },
                colors: { enabled: true, hueShift: Random.range(-60, 60), satShift: Random.range(-30, 30), lightShift: Random.range(-15, 15) },
                effects: { enabled: true, strokeVariance: 2, glowVariance: 4 }
            };

            // Apply wild color shifts
            palette = config.colors.enabled ? {
                red: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.red, config.colors.hueShift, config.colors.satShift, config.colors.lightShift)),
                orange: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.orange, config.colors.hueShift, config.colors.satShift, config.colors.lightShift)),
                yellow: ColorRandom.toHSL(ColorRandom.shiftColor(ColorRandom.baseColors.yellow, config.colors.hueShift, config.colors.satShift, config.colors.lightShift))
            } : { red: '#ff2d2d', orange: '#ff6b00', yellow: '#ffdd00' };

            // Randomize easing function
            const easingFunctions = [ t => t, t => 1 - Math.pow(1 - t, 3), t => t * t * t, t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 ];
            selectedEasing = Random.pick(easingFunctions);

            // Create new shapes array
            shapes = [];
            shapes.push(new MorphingShape(getRandomStart(), 'M 100 20 L 100 100', palette.red, 0));
            shapes.push(new MorphingShape(getRandomStart(), 'M 100 20 L 160 20 L 160 60 L 160 100 L 100 100', palette.red, Random.range(50, 150)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 200 60 L 200 20 L 280 20 L 280 60 L 280 100 L 200 100 L 200 60', palette.red, Random.range(100, 250)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 100 140 L 100 200', palette.orange, Random.range(200, 350)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 170 140 L 170 200', palette.orange, Random.range(250, 400)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 140 140 L 200 140', palette.orange, Random.range(300, 450)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 80 220 L 80 280', palette.yellow, Random.range(350, 500)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 80 220 L 140 280', palette.yellow, Random.range(400, 550)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 140 220 L 140 280', palette.yellow, Random.range(450, 600)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 180 250 L 180 220 L 250 220 L 250 250 L 250 280 L 180 280 L 180 250', palette.yellow, Random.range(500, 650)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 280 220 L 300 280 L 320 250 L 340 280 L 360 220', palette.yellow, Random.range(550, 700)));
            shapes.push(new MorphingShape(getRandomStart(), 'M 390 220 L 390 265 M 390 275 L 390 280', palette.yellow, Random.range(600, 750)));
        }

        let startTime = null;
        function animate(timestamp) {
            if (!startTime) startTime = timestamp; const elapsed = timestamp - startTime;
            shapes.forEach(shape => shape.update(elapsed));
            const maxTime = 2500; if (elapsed < maxTime) { requestAnimationFrame(animate); }
        }
        function restart() {
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            requestAnimationFrame(animate);
        }
        if (prefersReducedMotion) {
            initializeParameters();
            shapes.forEach(shape => { shape.path.style.opacity = '1'; shape.path.setAttribute('d', shape.endPath); });
        } else {
            initializeParameters();
            requestAnimationFrame(animate);
        }
        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
