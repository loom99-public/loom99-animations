<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Kinetic Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            position: relative;
        }

        .text-container {
            text-align: center;
            position: relative;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            position: relative;
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translate(0, 0) rotate(0deg) scale(0);
        }

        .word1 .letter { color: #ff2d2d; text-shadow: 0 0 20px rgba(255, 45, 45, 0.8); }
        .word2 .letter { color: #ff6b00; text-shadow: 0 0 20px rgba(255, 107, 0, 0.8); }
        .word3 .letter { color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.8); }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1" id="word1"></div>
            <div class="word word2" id="word2"></div>
            <div class="word word3" id="word3"></div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function easeOutElastic(t) {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        }

        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        function easeInCubic(t) {
            return t * t * t;
        }

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            class Letter {
                constructor(char, element, delay, angle) {
                    this.char = char;
                    this.element = element;
                    this.delay = delay;
                    this.duration = 1000;

                    // Start position (off-screen at angle)
                    const distance = 500;
                    this.startX = Math.cos(angle) * distance;
                    this.startY = Math.sin(angle) * distance;
                    this.startRotation = (Math.random() - 0.5) * 360;
                    this.startScale = 0;

                    // Target (final position)
                    this.targetX = 0;
                    this.targetY = 0;
                    this.targetRotation = 0;
                    this.targetScale = 1;

                    // Exit position (fly away in opposite direction - even further)
                    this.exitX = -Math.cos(angle) * 800;
                    this.exitY = -Math.sin(angle) * 800;
                    this.exitRotation = (Math.random() - 0.5) * 720;
                    this.exitScale = 0;
                }

                updateEntrance(elapsed) {
                    if (elapsed < this.delay) {
                        return;
                    }

                    const localTime = elapsed - this.delay;
                    const progress = Math.min(1, localTime / this.duration);

                    // Use elastic easing for bouncy effect
                    const eased = easeOutBack(progress);

                    const x = this.startX + (this.targetX - this.startX) * eased;
                    const y = this.startY + (this.targetY - this.startY) * eased;
                    const rotation = this.startRotation + (this.targetRotation - this.startRotation) * eased;
                    const scale = this.startScale + (this.targetScale - this.startScale) * eased;

                    this.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
                    this.element.style.opacity = Math.min(1, progress * 2);
                }

                updateExit(elapsed) {
                    const progress = Math.min(1, elapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    const x = this.targetX + (this.exitX - this.targetX) * eased;
                    const y = this.targetY + (this.exitY - this.targetY) * eased;
                    const rotation = this.targetRotation + (this.exitRotation - this.targetRotation) * eased;
                    const scale = this.targetScale + (this.exitScale - this.targetScale) * eased;

                    this.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
                    this.element.style.opacity = Math.max(0, 1 - progress * 2);
                }

                reset() {
                    this.element.style.opacity = 0;
                    this.element.style.transform = 'translate(0, 0) rotate(0deg) scale(0)';
                }
            }

            const words = [
                { text: 'DO', element: document.getElementById('word1') },
                { text: 'MORE', element: document.getElementById('word2') },
                { text: 'NOW', element: document.getElementById('word3') }
            ];

            const letters = [];
            let letterIndex = 0;
            const baseDelay = 0;
            const letterDelay = 60;

            words.forEach((word, wordIndex) => {
                const chars = word.text.split('');

                chars.forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.className = 'letter';
                    span.textContent = char;
                    word.element.appendChild(span);

                    // Calculate angle for this letter (spiral pattern)
                    const angle = (letterIndex / (chars.length * words.length)) * Math.PI * 4 + wordIndex * Math.PI / 2;

                    const letter = new Letter(
                        char,
                        span,
                        baseDelay + letterIndex * letterDelay,
                        angle
                    );

                    letters.push(letter);
                    letterIndex++;
                });
            });

            let startTime = null;
            const totalDuration = 2000;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    letters.forEach(letter => letter.updateEntrance(elapsed));

                    if (elapsed < totalDuration) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    letters.forEach(letter => letter.updateExit(exitElapsed));

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
                if (holdTimeout) clearTimeout(holdTimeout);
                animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
                if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                letters.forEach(letter => {
                    letter.reset();
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            const words = [
                { text: 'DO', element: document.getElementById('word1') },
                { text: 'MORE', element: document.getElementById('word2') },
                { text: 'NOW', element: document.getElementById('word3') }
            ];

            words.forEach(word => {
                const chars = word.text.split('');
                chars.forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'letter';
                    span.textContent = char;
                    span.style.opacity = 1;
                    span.style.transform = 'none';
                    word.element.appendChild(span);
                });
            });
        }
    </script>
</body>
</html>
