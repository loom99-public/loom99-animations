<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Reveal Mask Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            svg text {
                opacity: 1 !important;
            }
            svg rect, svg circle {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Radial reveal mask with gradient edge -->
                <mask id="circleMask">
                    <circle id="maskCircle" cx="350" cy="140" r="0" fill="white"/>
                    <!-- Gradient ring for soft edge -->
                    <circle id="maskGradientRing" cx="350" cy="140" r="0" fill="none" stroke="white" stroke-width="40" opacity="0.5"/>
                </mask>

                <!-- Glow for reveal edge -->
                <filter id="revealGlow">
                    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <radialGradient id="glowGradient" cx="50%" cy="50%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.6" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:0" />
                </radialGradient>
            </defs>

            <g mask="url(#circleMask)">
                <text x="50" y="80" font-size="80" font-weight="900" fill="#ff2d2d" filter="drop-shadow(0 0 12px #ff2d2d)">DO</text>
                <text x="50" y="170" font-size="60" font-weight="900" fill="#ff6b00" filter="drop-shadow(0 0 12px #ff6b00)">MORE</text>
                <text x="50" y="260" font-size="80" font-weight="900" fill="#ffdd00" filter="drop-shadow(0 0 12px #ffdd00)">NOW</text>
            </g>

            <!-- Animated glow circle at reveal edge -->
            <circle id="glowCircle" cx="350" cy="140" r="0" fill="url(#glowGradient)" opacity="0" filter="url(#revealGlow)"/>
        </svg>
    </div>

    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            const maskCircle = document.getElementById('maskCircle');
            const maskGradientRing = document.getElementById('maskGradientRing');
            const glowCircle = document.getElementById('glowCircle');

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            function easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
            }

            let startTime = null;
            const duration = 2000;
            const maxRadius = 700;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / duration);
                    const eased = easeInOutQuart(progress);

                    const radius = maxRadius * eased;
                    maskCircle.setAttribute('r', radius);
                    maskGradientRing.setAttribute('r', radius);

                    // Pulsing glow at reveal edge
                    glowCircle.setAttribute('r', radius);
                    glowCircle.setAttribute('opacity', Math.sin(progress * Math.PI) * 0.6);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        glowCircle.setAttribute('opacity', 0);
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    // Reverse reveal - collapse to center
                    const radius = maxRadius * (1 - eased);
                    maskCircle.setAttribute('r', radius);
                    maskGradientRing.setAttribute('r', radius);

                    // Glow during collapse
                    glowCircle.setAttribute('r', radius);
                    glowCircle.setAttribute('opacity', (1 - progress) * 0.6);

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                maskCircle.setAttribute('r', 0);
                maskGradientRing.setAttribute('r', 0);
                glowCircle.setAttribute('opacity', 0);
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            const maskCircle = document.getElementById('maskCircle');
            const maskGradientRing = document.getElementById('maskGradientRing');
            maskCircle.setAttribute('r', 700);
            maskGradientRing.setAttribute('r', 700);
        }
    </script>
</body>
</html>
