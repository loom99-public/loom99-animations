<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Do More Now - Kinetic Animation (Varied)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 100%; max-width: 1000px; padding: 20px; position: relative; }
        .text-container { text-align: center; position: relative; }
        .word { display: block; font-size: 80px; font-weight: 900; line-height: 1.2; position: relative; }
        .letter { display: inline-block; opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0); }
        .word1 .letter { color: #ff2d2d; text-shadow: 0 0 20px rgba(255, 45, 45, 0.8); }
        .word2 .letter { color: #ff6b00; text-shadow: 0 0 20px rgba(255, 107, 0, 0.8); }
        .word3 .letter { color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.8); }
        @media (prefers-reduced-motion: reduce) { .letter { opacity: 1 !important; transform: none !important; } }
    </style>
</head>
<body>
    <div class="container"><div class="text-container"><div class="word word1" id="word1"></div><div class="word word2" id="word2"></div><div class="word word3" id="word3"></div></div></div>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const Random = { range: (min, max) => min + Math.random() * (max - min), int: (min, max) => Math.floor(Random.range(min, max + 1)), pick: (arr) => arr[Random.int(0, arr.length - 1)], vary: (base, v) => base + Random.range(-v, v), varyPercent: (base, p) => base * Random.range(1 - p, 1 + p) };
        const modes = [
            { name: 'spiral', getAngle: (i, total) => (i / total) * Math.PI * 4, desc: 'Spiral entry' },
            { name: 'radial', getAngle: (i, total) => (i / total) * Math.PI * 2, desc: 'Radial burst' },
            { name: 'wave', getAngle: (i, total) => Math.PI + Math.sin(i / total * Math.PI * 2) * Math.PI / 2, desc: 'Wave pattern' }
        ];
        const ColorRandom = { baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } }, shiftHue: (hsl, shift) => ({ h: (hsl.h + shift + 360) % 360, s: hsl.s, l: hsl.l }), toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` };

        // Variables that will be regenerated on each restart
        let mode;
        let config;
        let letters;

        function easeOutBack(t) { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
        class Letter {
            constructor(char, element, delay, angle) {
                this.char = char; this.element = element; this.delay = delay; this.duration = config.duration;
                this.startX = Math.cos(angle) * config.distance; this.startY = Math.sin(angle) * config.distance;
                this.startRotation = (Math.random() - 0.5) * config.rotRange; this.startScale = 0;
                this.targetX = 0; this.targetY = 0; this.targetRotation = 0; this.targetScale = 1;
            }
            update(elapsed) {
                if (elapsed < this.delay) { return; }
                const localTime = elapsed - this.delay; const progress = Math.min(1, localTime / this.duration);
                const eased = easeOutBack(progress);
                const x = this.startX + (this.targetX - this.startX) * eased; const y = this.startY + (this.targetY - this.startY) * eased;
                const rotation = this.startRotation + (this.targetRotation - this.startRotation) * eased;
                const scale = this.startScale + (this.targetScale - this.startScale) * eased;
                this.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
                this.element.style.opacity = Math.min(1, progress * 2);
            }
        }

        function initializeParameters() {
            // Clear existing letters from DOM
            const words = [ { text: 'DO', element: document.getElementById('word1') }, { text: 'MORE', element: document.getElementById('word2') }, { text: 'NOW', element: document.getElementById('word3') } ];
            words.forEach(word => { while (word.element.firstChild) { word.element.removeChild(word.element.firstChild); } });

            // Select random mode and config
            mode = Random.pick(modes);
            config = { hueShift: Random.range(-15, 15), distance: Random.vary(500, 100), rotRange: Random.vary(360, 120), delay: Random.vary(60, 15), duration: Random.vary(1000, 200) };
            console.log('Kinetic mode:', mode.name);

            // Apply colors
            document.querySelectorAll('.word1 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.red, config.hueShift)));
            document.querySelectorAll('.word2 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.orange, config.hueShift)));
            document.querySelectorAll('.word3 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.yellow, config.hueShift)));

            // Create new letters array
            letters = []; let letterIndex = 0; const baseDelay = 0;
            words.forEach((word, wordIndex) => {
                const chars = word.text.split('');
                chars.forEach((char, charIndex) => {
                    const span = document.createElement('span'); span.className = 'letter'; span.textContent = char; word.element.appendChild(span);
                    const totalLetters = words.reduce((sum, w) => sum + w.text.length, 0);
                    const angle = mode.getAngle(letterIndex, totalLetters);
                    const letter = new Letter(char, span, baseDelay + letterIndex * config.delay, angle);
                    letters.push(letter); letterIndex++;
                });
            });

            // Apply colors after creating letters
            document.querySelectorAll('.word1 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.red, config.hueShift)));
            document.querySelectorAll('.word2 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.orange, config.hueShift)));
            document.querySelectorAll('.word3 .letter').forEach(el => el.style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.yellow, config.hueShift)));
        }

        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let startTime = null;
        let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
        const totalDuration = 2000;
        const EXIT_DURATION = 250;

        function easeInCubic(t) { return t * t * t; }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                letters.forEach(letter => letter.update(elapsed));
                if (elapsed >= totalDuration) {
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                } else {
                    requestAnimationFrame(animate);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(exitProgress);

                letters.forEach(letter => {
                    // Fly away in opposite direction from entrance
                    const exitAngle = letter.startRotation > 0 ?
                        Math.atan2(letter.startY, letter.startX) :
                        Math.atan2(letter.startY, letter.startX) + Math.PI;
                    const distance = config.distance * 2 * eased;
                    const x = Math.cos(exitAngle) * distance;
                    const y = Math.sin(exitAngle) * distance;
                    const rotation = letter.startRotation * 2 * eased;
                    const scale = 1 - eased;
                    letter.element.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
                    letter.element.style.opacity = 1 - eased;
                });

                if (exitProgress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    restart();
                }
            }
        }

        function startExit() {
                if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
                if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            exitStartTime = null;
            requestAnimationFrame(animate);
        }
        if (prefersReducedMotion) {
            initializeParameters();
            letters.forEach(letter => { letter.element.style.opacity = 1; letter.element.style.transform = 'none'; });
        } else {
            initializeParameters();
            requestAnimationFrame(animate);
        }
        document.body.addEventListener('click', () => {
            if (animationState === 'hold') {
                startExit();
            } else if (animationState === 'entrance') {
                restart();
            }
        });
    </script>
</body>
</html>
