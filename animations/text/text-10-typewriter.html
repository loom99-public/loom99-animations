<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Typewriter Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .text-container {
            text-align: left;
            padding: 40px;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.3;
            font-family: 'Courier New', monospace;
        }

        .letter {
            opacity: 0;
        }

        .cursor {
            display: inline-block;
            width: 4px;
            height: 80px;
            background: currentColor;
            margin-left: 2px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .word1 { color: #ff2d2d; text-shadow: 0 0 10px rgba(255, 45, 45, 0.5); }
        .word2 { color: #ff6b00; text-shadow: 0 0 10px rgba(255, 107, 0, 0.5); }
        .word3 { color: #ffdd00; text-shadow: 0 0 10px rgba(255, 221, 0, 0.5); }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
            }
            .cursor {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1" id="word1">
                <span class="cursor"></span>
            </div>
            <div class="word word2" id="word2">
                <span class="cursor" style="height: 60px"></span>
            </div>
            <div class="word word3" id="word3">
                <span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const words = [
            { text: 'DO', element: document.getElementById('word1'), delay: 0 },
            { text: 'IT', element: document.getElementById('word2'), delay: 500 },
            { text: 'NOW', element: document.getElementById('word3'), delay: 900 }
        ];

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let currentWordIndex = 0;
            let currentCharIndex = 0;
            let exitWordIndex = 0;
            let exitCharIndex = 0;
            let startTime = null;
            let exitStartTime = null;
            const charDelay = 100;
            const exitCharDelay = 30; // Faster deletion

            words.forEach(word => {
                const cursor = word.element.querySelector('.cursor');
                cursor.style.display = 'none';
            });

            function typeCharacter() {
                if (currentWordIndex >= words.length) {
                    // Typing complete - hide all cursors and enter hold state
                    words.forEach(word => {
                        const cursor = word.element.querySelector('.cursor');
                        cursor.style.display = 'none';
                    });
                    animationState = 'hold';
                    return;
                }

                const word = words[currentWordIndex];
                const chars = word.text.split('');

                if (currentCharIndex === 0) {
                    // Show cursor for current word
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'inline-block';
                }

                if (currentCharIndex < chars.length) {
                    // Type next character
                    const span = document.createElement('span');
                    span.className = 'letter';
                    span.textContent = chars[currentCharIndex];
                    span.style.opacity = '1';

                    const cursor = word.element.querySelector('.cursor');
                    word.element.insertBefore(span, cursor);

                    currentCharIndex++;
                    setTimeout(typeCharacter, charDelay);
                } else {
                    // Move to next word
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';

                    currentWordIndex++;
                    currentCharIndex = 0;

                    const nextWord = words[currentWordIndex];
                    if (nextWord) {
                        setTimeout(typeCharacter, nextWord.delay);
                    } else {
                        typeCharacter();
                    }
                }
            }

            function deleteCharacter() {
                if (exitWordIndex < 0) {
                    // Deletion complete - restart entrance
                    restart();
                    return;
                }

                const word = words[exitWordIndex];
                const letters = word.element.querySelectorAll('.letter');

                if (exitCharIndex < 0) {
                    // Move to previous word
                    exitWordIndex--;
                    if (exitWordIndex >= 0) {
                        const prevWord = words[exitWordIndex];
                        const prevLetters = prevWord.element.querySelectorAll('.letter');
                        exitCharIndex = prevLetters.length - 1;

                        // Show cursor on previous word
                        const cursor = prevWord.element.querySelector('.cursor');
                        cursor.style.display = 'inline-block';
                    }
                    setTimeout(deleteCharacter, exitCharDelay);
                } else {
                    // Delete character
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'inline-block';

                    if (letters[exitCharIndex]) {
                        letters[exitCharIndex].remove();
                    }

                    exitCharIndex--;
                    setTimeout(deleteCharacter, exitCharDelay);
                }
            }

            function startExit() {
                animationState = 'exit';
                exitStartTime = performance.now();

                // Start from the last word, last character
                exitWordIndex = words.length - 1;
                const lastWord = words[exitWordIndex];
                const lastLetters = lastWord.element.querySelectorAll('.letter');
                exitCharIndex = lastLetters.length - 1;

                // Hide all cursors first
                words.forEach(word => {
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';
                });

                deleteCharacter();
            }

            function restart() {
                currentWordIndex = 0;
                currentCharIndex = 0;
                animationState = 'entrance';

                words.forEach(word => {
                    // Remove all letter spans
                    const letters = word.element.querySelectorAll('.letter');
                    letters.forEach(letter => letter.remove());

                    // Hide cursor
                    const cursor = word.element.querySelector('.cursor');
                    cursor.style.display = 'none';
                });

                setTimeout(typeCharacter, words[0].delay);
            }

            setTimeout(typeCharacter, words[0].delay);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    // Restart if clicked during entrance
                    restart();
                }
            });
        } else {
            // Show all text immediately
            words.forEach(word => {
                const chars = word.text.split('');
                const cursor = word.element.querySelector('.cursor');

                chars.forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'letter';
                    span.textContent = char;
                    span.style.opacity = '1';
                    word.element.insertBefore(span, cursor);
                });

                cursor.style.display = 'none';
            });
        }
    </script>
</body>
</html>
