<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Do More Now - 3D Transform Animation (Varied)</title>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; perspective: 1000px; } .container { width: 100%; max-width: 1000px; padding: 20px; } .text-container { text-align: center; transform-style: preserve-3d; } .word { display: block; font-size: 80px; font-weight: 900; line-height: 1.2; transform-style: preserve-3d; opacity: 0; } .word1 { color: #ff2d2d; text-shadow: 0 0 20px rgba(255, 45, 45, 0.8), 2px 2px 4px rgba(0,0,0,0.5); } .word2 { color: #ff6b00; text-shadow: 0 0 20px rgba(255, 107, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.5); } .word3 { color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.5); } @media (prefers-reduced-motion: reduce) { body { perspective: none; } .text-container, .word { transform: none !important; opacity: 1 !important; transform-style: flat !important; } }</style>
</head>
<body>
    <div class="container"><div class="text-container"><div class="word word1">DO</div><div class="word word2">MORE</div><div class="word word3">NOW</div></div></div>
    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const Random = { range: (min, max) => min + Math.random() * (max - min), pick: (arr) => arr[Math.floor(Math.random() * arr.length)], vary: (base, v) => base + Random.range(-v, v) };
        const modes = [ { name: 'rotateY', axes: ['Y', 'Y', 'Y'], desc: 'All Y-axis' }, { name: 'rotateX', axes: ['X', 'X', 'X'], desc: 'All X-axis' }, { name: 'mixed', axes: ['Y', 'X', 'Z'], desc: 'Mixed axes' } ];

        // Variables that will be regenerated on each restart
        let mode;
        let config;
        let wordAnimations;

        const ColorRandom = { baseColors: { red: { h: 0, s: 100, l: 59 }, orange: { h: 25, s: 100, l: 50 }, yellow: { h: 50, s: 100, l: 50 } }, shiftHue: (hsl, shift) => ({ h: (hsl.h + shift + 360) % 360, s: hsl.s, l: hsl.l }), toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` };

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        class Word3D {
            constructor(element, delay, rotationAxis) { this.element = element; this.delay = delay; this.duration = config.duration; this.rotationAxis = rotationAxis; }
            update(elapsed) {
                if (elapsed < this.delay) { return; }
                const localTime = elapsed - this.delay, progress = Math.min(1, localTime / this.duration), eased = easeOutCubic(progress);
                let rotateX = 0, rotateY = 0, rotateZ = 0; const translateZ = config.translateZ * (1 - eased);
                if (this.rotationAxis === 'X') { rotateX = config.rotDegrees * (1 - eased); }
                else if (this.rotationAxis === 'Y') { rotateY = config.rotDegrees * (1 - eased); }
                else if (this.rotationAxis === 'Z') { rotateZ = config.rotDegrees * (1 - eased); }
                this.element.style.transform = `translateZ(${translateZ}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
                this.element.style.opacity = eased;
            }
        }

        function initializeParameters() {
            // Select mode and config
            mode = Random.pick(modes);
            config = { hueShift: Random.range(-15, 15), rotDegrees: Random.vary(180, 45), translateZ: Random.vary(-200, 50), duration: Random.vary(1500, 300), stagger: Random.vary(300, 80) };
            console.log('3D mode:', mode.name);

            // Apply colors
            const words = document.querySelectorAll('.word');
            document.querySelector('.word1').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.red, config.hueShift));
            document.querySelector('.word2').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.orange, config.hueShift));
            document.querySelector('.word3').style.color = ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.yellow, config.hueShift));

            // Create word animations
            wordAnimations = [ new Word3D(words[0], 0, mode.axes[0]), new Word3D(words[1], config.stagger, mode.axes[1]), new Word3D(words[2], config.stagger * 2, mode.axes[2]) ];
        }

        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let startTime = null;
        let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
        const totalDuration = 2500;
        const EXIT_DURATION = 250;

        function easeInCubic(t) { return t * t * t; }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                wordAnimations.forEach(word => word.update(elapsed));
                if (elapsed >= totalDuration) {
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                } else {
                    requestAnimationFrame(animate);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(exitProgress);

                wordAnimations.forEach(word => {
                    let rotateX = 0, rotateY = 0, rotateZ = 0;
                    if (word.rotationAxis === 'X') { rotateX = config.rotDegrees * eased; }
                    else if (word.rotationAxis === 'Y') { rotateY = config.rotDegrees * eased; }
                    else if (word.rotationAxis === 'Z') { rotateZ = config.rotDegrees * eased; }
                    const translateZ = -config.translateZ * eased;
                    word.element.style.transform = `translateZ(${translateZ}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
                    word.element.style.opacity = 1 - eased;
                });

                if (exitProgress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    restart();
                }
            }
        }

        function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            exitStartTime = null;
            wordAnimations.forEach(word => { word.element.style.opacity = 0; word.element.style.transform = ''; });
            requestAnimationFrame(animate);
        }

        if (!prefersReducedMotion) {
            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            document.querySelectorAll('.word').forEach(word => { word.style.opacity = 1; });
        }
    </script>
</body>
</html>
