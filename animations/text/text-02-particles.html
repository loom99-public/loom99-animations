<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Particle Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (prefers-reduced-motion: reduce) {
            canvas {
                display: none;
            }
        }

        .reduced-motion-text {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #ff2d2d, #ff6b00, #ffdd00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-text {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">DO MORE NOW</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReducedMotion) {
            // Skip animation for reduced motion
        } else {
            // Set canvas size
            canvas.width = 1000;
            canvas.height = 300;

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            class Particle {
                constructor(targetX, targetY, color) {
                    // Start position (random around viewport)
                    this.startX = Math.random() * canvas.width;
                    this.startY = Math.random() * canvas.height;

                    // Target position (letter position)
                    this.targetX = targetX;
                    this.targetY = targetY;

                    // Exit position (explode outward from target)
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 800;
                    this.exitX = targetX + Math.cos(angle) * distance;
                    this.exitY = targetY + Math.sin(angle) * distance;

                    this.x = this.startX;
                    this.y = this.startY;
                    this.color = color;
                    this.size = 3;
                    this.opacity = 0;
                }

                updateEntrance(progress) {
                    // Ease into position
                    const eased = easeOutCubic(progress);
                    this.x = this.startX + (this.targetX - this.startX) * eased;
                    this.y = this.startY + (this.targetY - this.startY) * eased;

                    // Fade in during movement
                    this.opacity = Math.min(1, progress * 2);
                }

                updateExit(progress) {
                    // Ease out from target to exit position
                    const eased = easeInCubic(progress);
                    this.x = this.targetX + (this.exitX - this.targetX) * eased;
                    this.y = this.targetY + (this.exitY - this.targetY) * eased;

                    // Fade out quickly
                    this.opacity = Math.max(0, 1 - progress * 2);
                }

                draw() {
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            // Function to sample points from text
            function getTextPoints(text, x, y, fontSize, spacing = 6) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tempCtx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillText(text, x, y);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const points = [];

                for (let py = 0; py < imageData.height; py += spacing) {
                    for (let px = 0; px < imageData.width; px += spacing) {
                        const index = (py * imageData.width + px) * 4;
                        const alpha = imageData.data[index + 3];

                        if (alpha > 128) {
                            points.push({ x: px, y: py });
                        }
                    }
                }

                return points;
            }

            const particles = [];

            // Create particles for "DO"
            const doPoints = getTextPoints('DO', 50, 90, 80);
            doPoints.forEach(point => {
                particles.push(new Particle(point.x, point.y, '#ff2d2d'));
            });

            // Create particles for "MORE"
            const morePoints = getTextPoints('MORE', 100, 170, 60);
            morePoints.forEach(point => {
                particles.push(new Particle(point.x, point.y, '#ff6b00'));
            });

            // Create particles for "NOW"
            const nowPoints = getTextPoints('NOW', 50, 250, 80);
            nowPoints.forEach(point => {
                particles.push(new Particle(point.x, point.y, '#ffdd00'));
            });

            let startTime = null;
            const entranceDuration = 2000;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                // Clear canvas
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / entranceDuration);

                    // Update and draw particles
                    particles.forEach(particle => {
                        particle.updateEntrance(progress);
                        particle.draw();
                    });

                    if (progress >= 1) {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    } else {
                        requestAnimationFrame(animate);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);

                    // Update and draw particles
                    particles.forEach(particle => {
                        particle.updateExit(progress);
                        particle.draw();
                    });

                    if (progress >= 1) {
                        // Exit complete - restart
                        restart();
                    } else {
                        requestAnimationFrame(animate);
                    }
                } else if (animationState === 'hold') {
                    // Just draw particles at target positions
                    particles.forEach(particle => {
                        particle.draw();
                    });
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                startTime = null;
                animationState = 'entrance';
                particles.forEach(particle => {
                    particle.opacity = 0;
                    particle.x = particle.startX;
                    particle.y = particle.startY;
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            canvas.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
