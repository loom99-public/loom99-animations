<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Wave Ripple Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .text-container {
            text-align: center;
        }

        .word {
            display: block;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
        }

        .letter {
            display: inline-block;
        }

        .word1 .letter { color: #ff2d2d; text-shadow: 0 0 20px rgba(255, 45, 45, 0.8); }
        .word2 .letter { color: #ff6b00; text-shadow: 0 0 20px rgba(255, 107, 0, 0.8); }
        .word3 .letter { color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.8); }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="word word1" id="word1"></div>
            <div class="word word2" id="word2"></div>
            <div class="word word3" id="word3"></div>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const words = [
            { text: 'DO', element: document.getElementById('word1') },
            { text: 'IT', element: document.getElementById('word2') },
            { text: 'NOW', element: document.getElementById('word3') }
        ];

        const letters = [];

        words.forEach((word, wordIndex) => {
            const chars = word.text.split('');
            chars.forEach((char, charIndex) => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                word.element.appendChild(span);

                letters.push({
                    element: span,
                    index: letters.length,
                    baseDelay: wordIndex * 200
                });
            });
        });

        if (!prefersReducedMotion) {
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            const EXIT_DURATION = 300;

            let startTime = null;
            const duration = 3000;
            const waveCount = 3;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    letters.forEach((letter, i) => {
                        const time = (elapsed + letter.baseDelay) / 1000;
                        const wavePhase = (i / letters.length) * Math.PI * 2 * waveCount;

                        // Multiple sine waves for complex motion
                        const y = Math.sin(time * 3 + wavePhase) * 30 * Math.max(0, 1 - elapsed / duration);
                        const scale = 1 + Math.sin(time * 2 + wavePhase) * 0.2 * Math.max(0, 1 - elapsed / duration);

                        letter.element.style.transform = `translateY(${y}px) scale(${scale})`;
                    });

                    if (elapsed < duration) {
                        requestAnimationFrame(animate);
                    } else {
                        letters.forEach(letter => {
                            letter.element.style.transform = 'none';
                        });
                        animationState = 'hold';
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);

                    letters.forEach((letter, i) => {
                        const wavePhase = (i / letters.length) * Math.PI * 2;

                        // Collapse inward with wave effect
                        const y = Math.sin(wavePhase) * -100 * progress;
                        const scale = 1 - progress;
                        const opacity = 1 - progress;

                        letter.element.style.transform = `translateY(${y}px) scale(${scale})`;
                        letter.element.style.opacity = opacity;
                    });

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        // Exit complete - restart
                        restart();
                    }
                }
            }

            function startExit() {
                animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
                startTime = null;
                animationState = 'entrance';
                letters.forEach(letter => {
                    letter.element.style.transform = 'none';
                    letter.element.style.opacity = 1;
                });
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
