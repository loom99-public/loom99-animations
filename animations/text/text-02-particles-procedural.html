<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Particle Animation (Procedural)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (prefers-reduced-motion: reduce) {
            canvas {
                display: none;
            }
        }

        .reduced-motion-text {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #ff2d2d, #ff6b00, #ffdd00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-text {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">DO IT NOW</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReducedMotion) {
            // Skip animation for reduced motion
        } else {
            // Random utilities
            const Random = {
                range: (min, max) => min + Math.random() * (max - min),
                int: (min, max) => Math.floor(Random.range(min, max + 1)),
                pick: (arr) => arr[Random.int(0, arr.length - 1)],
                vary: (base, variance) => base + Random.range(-variance, variance),
                varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
            };

            // Color utilities
            const ColorRandom = {
                baseColors: {
                    red: { h: 0, s: 100, l: 59 },
                    orange: { h: 25, s: 100, l: 50 },
                    yellow: { h: 50, s: 100, l: 50 }
                },
                shiftColor: (hsl, hueShift, satShift, lightShift) => ({
                    h: (hsl.h + hueShift + 360) % 360,
                    s: Math.max(0, Math.min(100, hsl.s + satShift)),
                    l: Math.max(0, Math.min(100, hsl.l + lightShift))
                }),
                toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
            };

            // Easing functions
            const easingFunctions = [
                t => t,
                t => 1 - Math.pow(1 - t, 3),
                t => t * t * t,
                t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
                t => t * (2 - t),
                t => 1 - Math.cos((t * Math.PI) / 2)
            ];

            // Set canvas size
            canvas.width = 1000;
            canvas.height = 300;

            // Variables that will be regenerated on each restart
            let config;
            let palette;
            let selectedEasing;
            let particles;
            let baseDuration;
            let duration;

            class Particle {
                constructor(targetX, targetY, color) {
                    // Wild random start positions
                    const startModes = [
                        () => ({ x: Random.range(-200, canvas.width + 200), y: Random.range(-200, canvas.height + 200) }),
                        () => ({ x: canvas.width / 2, y: canvas.height / 2 }),
                        () => ({ x: Random.range(0, canvas.width), y: -Random.range(50, 200) }),
                        () => ({ x: -Random.range(50, 200), y: Random.range(0, canvas.height) }),
                        () => ({ x: canvas.width + Random.range(50, 200), y: Random.range(0, canvas.height) })
                    ];
                    const start = Random.pick(startModes)();

                    this.startX = start.x;
                    this.startY = start.y;

                    // Target position (letter position)
                    this.targetX = targetX;
                    this.targetY = targetY;

                    this.x = this.startX;
                    this.y = this.startY;
                    this.color = color;
                    this.size = Random.vary(3, config.particles.sizeVariance);
                    this.opacity = 0;
                    this.glow = Random.vary(10, config.particles.glowVariance);

                    // Individual timing variation
                    this.delay = config.particles.wild ? Random.range(0, 0.3) : 0;
                    this.speedMod = config.particles.wild ? Random.range(0.7, 1.3) : 1;
                }

                update(progress) {
                    // Apply individual delay and speed
                    const adjustedProgress = Math.max(0, Math.min(1, (progress - this.delay) * this.speedMod));
                    const eased = selectedEasing(adjustedProgress);

                    this.x = this.startX + (this.targetX - this.startX) * eased;
                    this.y = this.startY + (this.targetY - this.startY) * eased;

                    // Fade in during movement
                    this.opacity = Math.min(1, adjustedProgress * 2);
                }

                draw() {
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = Math.max(0, this.glow);
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            // Function to sample points from text
            function getTextPoints(text, x, y, fontSize, spacing = 6) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tempCtx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillText(text, x, y);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const points = [];

                for (let py = 0; py < imageData.height; py += spacing) {
                    for (let px = 0; px < imageData.width; px += spacing) {
                        const index = (py * imageData.width + px) * 4;
                        const alpha = imageData.data[index + 3];

                        if (alpha > 128) {
                            points.push({ x: px, y: py });
                        }
                    }
                }

                return points;
            }

            function initializeParameters() {
                // Randomization config (heavy)
                config = {
                    timing: {
                        enabled: true,
                        durationVariance: 0.5,
                        speed: Random.range(0.5, 2)
                    },
                    colors: {
                        enabled: true,
                        hueShift: Random.range(-60, 60),
                        satShift: Random.range(-30, 30),
                        lightShift: Random.range(-15, 15)
                    },
                    particles: {
                        sizeVariance: 2,
                        spacing: Random.int(4, 9),
                        glowVariance: 8,
                        wild: true
                    }
                };

                // Apply wild color shifts
                palette = config.colors.enabled ? {
                    red: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.red,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    )),
                    orange: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.orange,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    )),
                    yellow: ColorRandom.toHSL(ColorRandom.shiftColor(
                        ColorRandom.baseColors.yellow,
                        config.colors.hueShift,
                        config.colors.satShift,
                        config.colors.lightShift
                    ))
                } : {
                    red: '#ff2d2d',
                    orange: '#ff6b00',
                    yellow: '#ffdd00'
                };

                // Randomize easing function
                selectedEasing = Random.pick(easingFunctions);

                // Create particles array
                particles = [];

                // Create particles for "DO"
                const doPoints = getTextPoints('DO', 50, 90, 80, config.particles.spacing);
                doPoints.forEach(point => {
                    particles.push(new Particle(point.x, point.y, palette.red));
                });

                // Create particles for "IT"
                const itPoints = getTextPoints('IT', 100, 170, 60, config.particles.spacing);
                itPoints.forEach(point => {
                    particles.push(new Particle(point.x, point.y, palette.orange));
                });

                // Create particles for "NOW"
                const nowPoints = getTextPoints('NOW', 50, 250, 80, config.particles.spacing);
                nowPoints.forEach(point => {
                    particles.push(new Particle(point.x, point.y, palette.yellow));
                });

                // Calculate duration
                baseDuration = Random.range(1000, 3000);
                duration = baseDuration;
            }

            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(1, (elapsed * config.timing.speed) / duration);

                // Clear canvas
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Update and draw particles
                particles.forEach(particle => {
                    particle.update(progress);
                    particle.draw();
                });

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            function restart() {
                initializeParameters();  // Regenerate all random parameters
                startTime = null;
                requestAnimationFrame(animate);
            }

            // Initial setup
            initializeParameters();
            requestAnimationFrame(animate);
            canvas.addEventListener('click', restart);
        }
    </script>
</body>
</html>
