<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Typewriter Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .logo-text {
            font-size: 100px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            position: relative;
        }

        .letter {
            opacity: 0;
        }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 100px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            margin-left: 4px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
            }
            .cursor {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text" id="logo">
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const text = 'loom99';
        const logo = document.getElementById('logo');

        if (!prefersReducedMotion) {
            let currentIndex = 0;
            const charDelay = 150;

            function typeCharacter() {
                if (currentIndex >= text.length) {
                    // Typing complete - hide cursor
                    const cursor = logo.querySelector('.cursor');
                    setTimeout(() => {
                        cursor.style.display = 'none';
                    }, 1000);
                    return;
                }

                const char = text[currentIndex];
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.opacity = '1';

                const cursor = logo.querySelector('.cursor');
                logo.insertBefore(span, cursor);

                currentIndex++;
                setTimeout(typeCharacter, charDelay);
            }

            function restart() {
                currentIndex = 0;

                const letters = logo.querySelectorAll('.letter');
                letters.forEach(letter => letter.remove());

                const cursor = logo.querySelector('.cursor');
                cursor.style.display = 'inline-block';

                setTimeout(typeCharacter, 500);
            }

            setTimeout(typeCharacter, 500);
            document.body.addEventListener('click', restart);
        } else {
            // Show all text immediately
            const cursor = logo.querySelector('.cursor');
            cursor.style.display = 'none';

            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.opacity = '1';
                logo.insertBefore(span, cursor);
            });
        }
    </script>
</body>
</html>
