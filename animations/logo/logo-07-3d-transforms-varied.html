<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - 3D Transform Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            transform-style: preserve-3d;
        }

        svg {
            width: 100%;
            height: auto;
            transform-style: preserve-3d;
        }

        @media (prefers-reduced-motion: reduce) {
            body { perspective: none; }
            .container,
            svg {
                transform: none !important;
                transform-style: flat !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>

            <path d="M 40 40 L 40 160 L 100 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            <circle cx="150" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
            <circle cx="240" cy="100" r="40" stroke="url(#logoGradient)" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
            <path d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #ff2d75)"/>
            <path d="M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155 C 460 175, 440 170, 435 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            <path d="M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155 C 540 175, 520 170, 515 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
        };

        // 3D rotation modes
        const modes = [
            {
                name: 'flip-y',
                perspective: 1200,
                maxRotateY: 180,
                maxRotateX: 20,
                maxRotateZ: 10,
                description: 'Primary Y-axis flip'
            },
            {
                name: 'spin-x',
                perspective: 1000,
                maxRotateY: 30,
                maxRotateX: 180,
                maxRotateZ: 15,
                description: 'Primary X-axis spin'
            },
            {
                name: 'tumble',
                perspective: 1400,
                maxRotateY: 90,
                maxRotateX: 90,
                maxRotateZ: 45,
                description: 'Tumbling rotation'
            }
        ];

        let selectedMode;
        let config;
        let duration;

        function initializeParameters() {
            selectedMode = Random.pick(modes);
            console.log(`3D mode: ${selectedMode.name} - ${selectedMode.description}`);

            // Randomization config
            config = {
                timing: {
                    enabled: true,
                    variance: 0.15
                },
                motion: {
                    enabled: true,
                    useMode: true
                }
            };

            document.body.style.perspective = `${selectedMode.perspective}px`;

            const baseDuration = 2500;
            duration = config.timing.enabled ?
                baseDuration * Random.range(1 - config.timing.variance, 1 + config.timing.variance) :
                baseDuration;
        }

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const svg = document.getElementById('svg');

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInCubic(t) {
                return t * t * t;
            }

            let startTime = null;
            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
            const EXIT_DURATION = 250;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    const progress = Math.min(1, elapsed / duration);
                    const eased = easeOutCubic(progress);

                    // Apply mode-specific rotations
                    const rotateY = selectedMode.maxRotateY * (1 - eased);
                    const rotateX = selectedMode.maxRotateX * Math.sin(progress * Math.PI);
                    const rotateZ = selectedMode.maxRotateZ * Math.sin(progress * Math.PI * 2);

                    svg.style.transform = `
                        rotateY(${rotateY}deg)
                        rotateX(${rotateX}deg)
                        rotateZ(${rotateZ}deg)
                    `;
                    svg.style.opacity = eased;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(progress);

                    // Flip away and fade
                    const rotateY = 180 * eased;
                    const rotateX = -30 * eased;

                    svg.style.transform = `
                        rotateY(${rotateY}deg)
                        rotateX(${rotateX}deg)
                    `;
                    svg.style.opacity = 1 - eased;

                    if (exitElapsed < EXIT_DURATION) {
                        requestAnimationFrame(animate);
                    } else {
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
                initializeParameters();
                startTime = null;
                animationState = 'entrance';
                svg.style.opacity = 0;
                requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        }
    </script>
</body>
</html>
