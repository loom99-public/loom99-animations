<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Line Drawing Animation (Varied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .line {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (prefers-reduced-motion: reduce) {
            .line {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="logo" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };

        // Define animation modes
        const modes = [
            {
                name: 'converge',
                startDirection: () => ({
                    x: Random.range(-150, -100),
                    y: Random.range(50, 150)
                }),
                description: 'All lines converge from left'
            },
            {
                name: 'cascade',
                startDirection: () => ({
                    x: Random.range(250, 350),
                    y: -100
                }),
                description: 'Lines cascade from top'
            },
            {
                name: 'diagonal',
                startDirection: () => ({
                    x: Random.range(650, 750),
                    y: Random.range(-50, 50)
                }),
                description: 'Diagonal sweep from top-right'
            }
        ];

        // Variables that will be regenerated on each restart
        let selectedMode;
        let config;
        let palette;
        let DURATION;
        let STAGGER;
        let lines;

        // Color utilities
        const ColorRandom = {
            baseColors: {
                cyan: { h: 190, s: 100, l: 50 },
                purple: { h: 265, s: 85, l: 57 },
                pink: { h: 340, s: 100, l: 63 }
            },
            shiftHue: (hsl, shift) => ({
                h: (hsl.h + shift + 360) % 360,
                s: hsl.s,
                l: hsl.l
            }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        const svg = document.getElementById('logo');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        class AnimatedLine {
            constructor(startX, startY, points, color, delay, duration, foldDuration = 200) {
                this.points = points;
                this.startX = startX;
                this.startY = startY;
                this.delay = delay;
                this.duration = duration;
                this.foldDuration = foldDuration;
                this.color = color;
                this.progress = 0;
                this.foldProgress = 0;
                this.started = false;
                this.finished = false;
                this.folding = false;
                this.foldComplete = false;

                const strokeWidth = config.effects.enabled ?
                    Random.vary(12, config.effects.strokeVariance) : 12;
                const glowRadius = config.effects.enabled ?
                    Random.vary(8, config.effects.glowVariance) : 8;

                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.classList.add('line');
                this.path.style.stroke = color;
                this.path.style.strokeWidth = strokeWidth;
                this.path.style.filter = `drop-shadow(0 0 ${glowRadius}px ${color})`;
                this.path.style.opacity = '0';
            }

            getFirstPoint() {
                return this.points[0];
            }

            update(elapsed) {
                if (this.foldComplete) return;

                if (elapsed < this.delay) {
                    this.path.style.opacity = '0';
                    return;
                }

                this.path.style.opacity = '1';

                if (!this.started) {
                    this.started = true;
                }

                const localTime = elapsed - this.delay;

                if (localTime < this.duration) {
                    this.progress = Math.min(1, localTime / this.duration);
                    const eased = easeOutQuart(this.progress);

                    const firstPoint = this.getFirstPoint();
                    const tailX = this.startX + (firstPoint.x - this.startX) * eased;
                    const tailY = this.startY + (firstPoint.y - this.startY) * eased;

                    let d = `M ${tailX} ${tailY}`;

                    for (let i = 0; i < this.points.length; i++) {
                        const point = this.points[i];
                        const finalPoint = this.points[this.points.length - 1];
                        const t = (i + 1) / this.points.length;

                        const straightX = this.startX + (finalPoint.x - this.startX) * t;
                        const straightY = this.startY + (finalPoint.y - this.startY) * t;

                        const currentX = straightX + (point.x - straightX) * eased;
                        const currentY = straightY + (point.y - straightY) * eased;

                        if (point.type === 'Q') {
                            const ctrlStraightX = this.startX + (finalPoint.x - this.startX) * ((i + 0.5) / this.points.length);
                            const ctrlStraightY = this.startY + (finalPoint.y - this.startY) * ((i + 0.5) / this.points.length);
                            const ctrlX = ctrlStraightX + (point.cx - ctrlStraightX) * eased;
                            const ctrlY = ctrlStraightY + (point.cy - ctrlStraightY) * eased;
                            d += ` Q ${ctrlX} ${ctrlY} ${currentX} ${currentY}`;
                        } else if (point.type === 'A') {
                            d += ` A ${point.rx} ${point.ry} ${point.rotation} ${point.largeArc} ${point.sweep} ${currentX} ${currentY}`;
                        } else {
                            d += ` L ${currentX} ${currentY}`;
                        }
                    }

                    this.path.setAttribute('d', d);
                } else {
                    if (!this.folding) {
                        this.folding = true;
                        this.finished = true;
                    }

                    const foldTime = localTime - this.duration;
                    this.foldProgress = Math.min(1, foldTime / this.foldDuration);

                    let d = `M ${this.points[0].x} ${this.points[0].y}`;

                    for (let i = 1; i < this.points.length; i++) {
                        const point = this.points[i];
                        if (point.type === 'Q') {
                            d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                        } else if (point.type === 'A') {
                            d += ` A ${point.rx} ${point.ry} ${point.rotation} ${point.largeArc} ${point.sweep} ${point.x} ${point.y}`;
                        } else {
                            d += ` L ${point.x} ${point.y}`;
                        }
                    }

                    this.path.setAttribute('d', d);

                    if (this.foldProgress >= 1) {
                        this.foldComplete = true;
                    }
                }
            }
        }

        function addLine(startX, startY, points, color, delay, duration = 400, foldDuration = 180) {
            const line = new AnimatedLine(startX, startY, points, color, delay, duration, foldDuration);
            lines.push(line);
            svg.appendChild(line.path);
            return line;
        }

        function initializeParameters() {
            // Clear existing lines from SVG
            while (svg.lastChild && svg.lastChild.classList && svg.lastChild.classList.contains('line')) {
                svg.removeChild(svg.lastChild);
            }

            // Select random mode
            selectedMode = Random.pick(modes);
            console.log(`Animation mode: ${selectedMode.name} - ${selectedMode.description}`);

            // Randomization config
            config = {
                timing: {
                    enabled: true,
                    durationVariance: 0.15,
                    staggerVariance: 0.2
                },
                colors: {
                    enabled: true,
                    hueShift: Random.range(-15, 15)
                },
                motion: {
                    enabled: true,
                    useMode: true
                },
                effects: {
                    enabled: true,
                    strokeVariance: 1.5,
                    glowVariance: 2
                }
            };

            // Apply color shifts
            palette = config.colors.enabled ? {
                cyan: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.cyan, config.colors.hueShift)),
                purple: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.purple, config.colors.hueShift)),
                pink: ColorRandom.toHSL(ColorRandom.shiftHue(ColorRandom.baseColors.pink, config.colors.hueShift))
            } : {
                cyan: '#00d4ff',
                purple: '#7b2ff7',
                pink: '#ff2d75'
            };

            const CYAN = palette.cyan;
            const PURPLE = palette.purple;
            const PINK = palette.pink;

            DURATION = config.timing.enabled ?
                Random.varyPercent(400, config.timing.durationVariance) : 400;
            STAGGER = config.timing.enabled ?
                Random.varyPercent(80, config.timing.staggerVariance) : 80;

            // Get start positions based on mode
            const getStart = (index) => {
                if (!config.motion.enabled || !config.motion.useMode) {
                    return { x: -100, y: 100 };
                }
                const base = selectedMode.startDirection();
                return {
                    x: Random.vary(base.x, 20),
                    y: Random.vary(base.y, 20)
                };
            };

            // Initialize lines array
            lines = [];

            // L
            const start0 = getStart(0);
            addLine(start0.x, start0.y, [
                {x: 40, y: 40},
                {x: 40, y: 160},
                {x: 100, y: 160}
            ], CYAN, 0, DURATION);

            // O (first)
            const start1 = getStart(1);
            addLine(start1.x, start1.y, [
                {x: 150, y: 60},
                {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 150, y: 140},
                {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 150, y: 60}
            ], PURPLE, STAGGER, DURATION);

            // O (second)
            const start2 = getStart(2);
            addLine(start2.x, start2.y, [
                {x: 240, y: 60},
                {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 240, y: 140},
                {type: 'A', rx: 40, ry: 40, rotation: 0, largeArc: 1, sweep: 1, x: 240, y: 60}
            ], PURPLE, STAGGER * 2, DURATION);

            // M
            const start3 = getStart(3);
            addLine(start3.x, start3.y, [
                {x: 300, y: 160},
                {x: 300, y: 40},
                {x: 350, y: 100},
                {x: 400, y: 40},
                {x: 400, y: 160}
            ], PINK, STAGGER * 3, DURATION);

            // 9 (first)
            const start4 = getStart(4);
            addLine(start4.x, start4.y, [
                {x: 460, y: 70},
                {type: 'Q', cx: 460, cy: 45, x: 480, y: 45},
                {type: 'Q', cx: 500, cy: 45, x: 500, y: 70},
                {type: 'Q', cx: 500, cy: 95, x: 480, y: 95},
                {type: 'Q', cx: 460, cy: 95, x: 460, y: 70},
                {x: 500, y: 70},
                {type: 'Q', cx: 500, cy: 110, x: 485, y: 135},
                {type: 'Q', cx: 470, cy: 160, x: 445, y: 165}
            ], CYAN, STAGGER * 4, DURATION);

            // 9 (second)
            const start5 = getStart(5);
            addLine(start5.x, start5.y, [
                {x: 540, y: 70},
                {type: 'Q', cx: 540, cy: 45, x: 560, y: 45},
                {type: 'Q', cx: 580, cy: 45, x: 580, y: 70},
                {type: 'Q', cx: 580, cy: 95, x: 560, y: 95},
                {type: 'Q', cx: 540, cy: 95, x: 540, y: 70},
                {x: 580, y: 70},
                {type: 'Q', cx: 580, cy: 110, x: 565, y: 135},
                {type: 'Q', cx: 550, cy: 160, x: 525, y: 165}
            ], CYAN, STAGGER * 5, DURATION);
        }

        let startTime = null;
        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = 2000;
        const EXIT_DURATION = 250;

        function easeInCubic(t) {
            return t * t * t;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (animationState === 'entrance') {
                lines.forEach(line => line.update(elapsed));

                const allDone = lines.every(l => l.foldComplete);
                if (!allDone) {
                    requestAnimationFrame(animate);
                } else {
                    animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                }
            } else if (animationState === 'exit') {
                const exitElapsed = timestamp - exitStartTime;
                const progress = Math.min(1, exitElapsed / EXIT_DURATION);
                const eased = easeInCubic(progress);

                lines.forEach((line, index) => {
                    // Lines shoot out to edges
                    const angle = (index / lines.length) * Math.PI * 2;
                    const distance = 400 * eased;
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;

                    line.path.style.transform = `translate(${x}px, ${y}px)`;
                    line.path.style.opacity = 1 - eased;
                });

                if (exitElapsed < EXIT_DURATION) {
                    requestAnimationFrame(animate);
                } else {
                    restart();
                }
            }
        }

        function startExit() {
                if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
            exitStartTime = performance.now();
            requestAnimationFrame(animate);
        }

        function restart() {
                if (holdTimeout) clearTimeout(holdTimeout);
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            animationState = 'entrance';
            requestAnimationFrame(animate);
        }

        if (prefersReducedMotion) {
            initializeParameters();
            lines.forEach(line => {
                line.foldComplete = true;
                line.path.style.opacity = '1';
                let d = `M ${line.points[0].x} ${line.points[0].y}`;
                for (let i = 1; i < line.points.length; i++) {
                    const point = line.points[i];
                    if (point.type === 'Q') {
                        d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                    } else if (point.type === 'A') {
                        d += ` A ${point.rx} ${point.ry} ${point.rotation} ${point.largeArc} ${point.sweep} ${point.x} ${point.y}`;
                    } else {
                        d += ` L ${point.x} ${point.y}`;
                    }
                }
                line.path.setAttribute('d', d);
            });
        } else {
            initializeParameters();
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', () => {
            if (animationState === 'hold') {
                startExit();
            } else if (animationState === 'entrance') {
                restart();
            }
        });
    </script>
</body>
</html>
