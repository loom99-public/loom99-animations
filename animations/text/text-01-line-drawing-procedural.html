<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Now - Line Drawing Animation (Procedural)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (prefers-reduced-motion: reduce) {
            .line {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="text" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
        </svg>
    </div>

    <script>
        // Random utilities
        const Random = {
            range: (min, max) => min + Math.random() * (max - min),
            int: (min, max) => Math.floor(Random.range(min, max + 1)),
            pick: (arr) => arr[Random.int(0, arr.length - 1)],
            vary: (base, variance) => base + Random.range(-variance, variance),
            varyPercent: (base, percent) => base * Random.range(1 - percent, 1 + percent),
        };

        // Color utilities
        const ColorRandom = {
            baseColors: {
                red: { h: 0, s: 100, l: 59 },
                orange: { h: 25, s: 100, l: 50 },
                yellow: { h: 50, s: 100, l: 50 }
            },
            shiftColor: (hsl, hueShift, satShift, lightShift) => ({
                h: (hsl.h + hueShift + 360) % 360,
                s: Math.max(0, Math.min(100, hsl.s + satShift)),
                l: Math.max(0, Math.min(100, hsl.l + lightShift))
            }),
            toHSL: (hsl) => `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
        };

        const svg = document.getElementById('text');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Variables that will be regenerated on each restart
        let config;
        let palette;
        let selectedEasing;
        let lines;

        class AnimatedLine {
            constructor(startX, startY, points, color, delay, duration, foldDuration = 150) {
                this.points = points;
                this.startX = startX;
                this.startY = startY;
                this.delay = delay;
                this.duration = duration;
                this.foldDuration = foldDuration;
                this.color = color;
                this.progress = 0;
                this.foldProgress = 0;
                this.started = false;
                this.finished = false;
                this.folding = false;
                this.foldComplete = false;

                const strokeWidth = config.effects.enabled ?
                    Random.vary(4, config.effects.strokeVariance) : 4;
                const glowRadius = config.effects.enabled ?
                    Random.vary(6, config.effects.glowVariance) : 6;

                this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                this.path.classList.add('line');
                this.path.style.stroke = color;
                this.path.style.strokeWidth = Math.max(1, strokeWidth);
                this.path.style.filter = `drop-shadow(0 0 ${Math.max(0, glowRadius)}px ${color})`;
                this.path.style.opacity = '0';
            }

            getFirstPoint() {
                return this.points[0];
            }

            update(elapsed) {
                if (this.foldComplete) return;

                if (elapsed < this.delay) {
                    this.path.style.opacity = '0';
                    return;
                }

                this.path.style.opacity = '1';

                if (!this.started) {
                    this.started = true;
                }

                const localTime = elapsed - this.delay;

                if (localTime < this.duration) {
                    this.progress = Math.min(1, localTime / this.duration);
                    const eased = selectedEasing(this.progress);

                    const firstPoint = this.getFirstPoint();
                    const tailX = this.startX + (firstPoint.x - this.startX) * eased;
                    const tailY = this.startY + (firstPoint.y - this.startY) * eased;

                    let d = `M ${tailX} ${tailY}`;

                    for (let i = 0; i < this.points.length; i++) {
                        const point = this.points[i];
                        const finalPoint = this.points[this.points.length - 1];
                        const t = (i + 1) / this.points.length;

                        const straightX = this.startX + (finalPoint.x - this.startX) * t;
                        const straightY = this.startY + (finalPoint.y - this.startY) * t;

                        const currentX = straightX + (point.x - straightX) * eased;
                        const currentY = straightY + (point.y - straightY) * eased;

                        if (point.type === 'Q') {
                            const ctrlStraightX = this.startX + (finalPoint.x - this.startX) * ((i + 0.5) / this.points.length);
                            const ctrlStraightY = this.startY + (finalPoint.y - this.startY) * ((i + 0.5) / this.points.length);
                            const ctrlX = ctrlStraightX + (point.cx - ctrlStraightX) * eased;
                            const ctrlY = ctrlStraightY + (point.cy - ctrlStraightY) * eased;
                            d += ` Q ${ctrlX} ${ctrlY} ${currentX} ${currentY}`;
                        } else {
                            d += ` L ${currentX} ${currentY}`;
                        }
                    }

                    this.path.setAttribute('d', d);
                } else {
                    if (!this.folding) {
                        this.folding = true;
                        this.finished = true;
                    }

                    const foldTime = localTime - this.duration;
                    this.foldProgress = Math.min(1, foldTime / this.foldDuration);

                    let d = `M ${this.points[0].x} ${this.points[0].y}`;

                    for (let i = 1; i < this.points.length; i++) {
                        const point = this.points[i];
                        if (point.type === 'Q') {
                            d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                        } else {
                            d += ` L ${point.x} ${point.y}`;
                        }
                    }

                    this.path.setAttribute('d', d);

                    if (this.foldProgress >= 1) {
                        this.foldComplete = true;
                    }
                }
            }
        }

        function addLine(startX, startY, points, color, delay, duration = 350, foldDuration = 150) {
            const line = new AnimatedLine(startX, startY, points, color, delay, duration, foldDuration);
            lines.push(line);
            svg.appendChild(line.path);
            return line;
        }

        function initializeParameters() {
            // Clear existing lines from SVG
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            // Randomization config (heavy)
            config = {
                timing: {
                    enabled: true,
                    durationVariance: 0.5,
                    staggerVariance: 0.6
                },
                colors: {
                    enabled: true,
                    hueShift: Random.range(-60, 60),
                    satShift: Random.range(-30, 30),
                    lightShift: Random.range(-15, 15)
                },
                motion: {
                    enabled: true,
                    randomStart: true
                },
                effects: {
                    enabled: true,
                    strokeVariance: 2,
                    glowVariance: 4
                }
            };

            // Apply wild color shifts
            palette = config.colors.enabled ? {
                red: ColorRandom.toHSL(ColorRandom.shiftColor(
                    ColorRandom.baseColors.red,
                    config.colors.hueShift,
                    config.colors.satShift,
                    config.colors.lightShift
                )),
                orange: ColorRandom.toHSL(ColorRandom.shiftColor(
                    ColorRandom.baseColors.orange,
                    config.colors.hueShift,
                    config.colors.satShift,
                    config.colors.lightShift
                )),
                yellow: ColorRandom.toHSL(ColorRandom.shiftColor(
                    ColorRandom.baseColors.yellow,
                    config.colors.hueShift,
                    config.colors.satShift,
                    config.colors.lightShift
                ))
            } : {
                red: '#ff2d2d',
                orange: '#ff6b00',
                yellow: '#ffdd00'
            };

            // Randomize easing function
            const easingFunctions = [
                t => t,
                t => 1 - Math.pow(1 - t, 4),
                t => t * t * t * t,
                t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
                t => 1 - Math.pow(1 - t, 3),
                t => t * (2 - t)
            ];
            selectedEasing = Random.pick(easingFunctions);

            // Create new lines array
            lines = [];

            const RED = palette.red;
            const ORANGE = palette.orange;
            const YELLOW = palette.yellow;

            // Randomize timing heavily
            const BASE_DURATION = Random.range(150, 450);
            const BASE_STAGGER = Random.range(30, 120);

            // Randomize start positions heavily
            const getRandomStart = () => {
                const directions = [
                    { x: Random.range(-250, -100), y: Random.range(50, 230) },
                    { x: Random.range(750, 950), y: Random.range(50, 230) },
                    { x: Random.range(150, 550), y: Random.range(-150, -50) },
                    { x: Random.range(150, 550), y: Random.range(330, 430) }
                ];
                return Random.pick(directions);
            };

            const SYLLABLE = 200;
            const PAUSE = 100;

            // ===== DO =====
            const doStart = 0;

            // D - vertical
            const dur0 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const start0 = config.motion.randomStart ? getRandomStart() : { x: -150, y: 70 };
            addLine(start0.x, start0.y, [
                {x: 100, y: 20},
                {x: 100, y: 100}
            ], RED, doStart, dur0);

            // D - curve
            const dur1 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay1 = Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start1 = config.motion.randomStart ? getRandomStart() : { x: 350, y: 70 };
            addLine(start1.x, start1.y, [
                {x: 100, y: 20},
                {type: 'Q', cx: 160, cy: 20, x: 160, y: 60},
                {type: 'Q', cx: 160, cy: 100, x: 100, y: 100}
            ], RED, delay1, dur1);

            // O - left arc
            const dur2 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay2 = delay1 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start2 = config.motion.randomStart ? getRandomStart() : { x: -150, y: 70 };
            addLine(start2.x, start2.y, [
                {x: 200, y: 60},
                {type: 'Q', cx: 200, cy: 20, x: 240, y: 20},
                {type: 'Q', cx: 280, cy: 20, x: 280, y: 60}
            ], RED, delay2, dur2);

            // O - right arc
            const dur3 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay3 = delay2 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start3 = config.motion.randomStart ? getRandomStart() : { x: 500, y: 70 };
            addLine(start3.x, start3.y, [
                {x: 280, y: 60},
                {type: 'Q', cx: 280, cy: 100, x: 240, y: 100},
                {type: 'Q', cx: 200, cy: 100, x: 200, y: 60}
            ], RED, delay3, dur3);

            // ===== IT =====
            const itStart = SYLLABLE + PAUSE;
            const itY = 140;

            // I - vertical
            const dur4 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay4 = itStart + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start4 = config.motion.randomStart ? getRandomStart() : { x: -150, y: itY + 20 };
            addLine(start4.x, start4.y, [
                {x: 100, y: itY},
                {x: 100, y: itY + 60}
            ], ORANGE, delay4, dur4);

            // T - vertical
            const dur5 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay5 = delay4 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start5 = config.motion.randomStart ? getRandomStart() : { x: -100, y: itY + 20 };
            addLine(start5.x, start5.y, [
                {x: 170, y: itY},
                {x: 170, y: itY + 60}
            ], ORANGE, delay5, dur5);

            // T - horizontal
            const dur6 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay6 = delay5 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start6 = config.motion.randomStart ? getRandomStart() : { x: 350, y: itY };
            addLine(start6.x, start6.y, [
                {x: 140, y: itY},
                {x: 200, y: itY}
            ], ORANGE, delay6, dur6);

            // ===== NOW =====
            const nowStart = itStart + SYLLABLE + PAUSE;
            const nowY = 220;

            // N - left vertical
            const dur7 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay7 = nowStart + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start7 = config.motion.randomStart ? getRandomStart() : { x: -150, y: nowY + 20 };
            addLine(start7.x, start7.y, [
                {x: 80, y: nowY},
                {x: 80, y: nowY + 60}
            ], YELLOW, delay7, dur7);

            // N - diagonal
            const dur8 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay8 = delay7 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start8 = config.motion.randomStart ? getRandomStart() : { x: -100, y: nowY + 20 };
            addLine(start8.x, start8.y, [
                {x: 80, y: nowY},
                {x: 140, y: nowY + 60}
            ], YELLOW, delay8, dur8);

            // N - right vertical
            const dur9 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay9 = delay8 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start9 = config.motion.randomStart ? getRandomStart() : { x: 800, y: nowY + 20 };
            addLine(start9.x, start9.y, [
                {x: 140, y: nowY},
                {x: 140, y: nowY + 60}
            ], YELLOW, delay9, dur9);

            // O - left arc
            const dur10 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay10 = delay9 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start10 = config.motion.randomStart ? getRandomStart() : { x: -150, y: nowY + 30 };
            addLine(start10.x, start10.y, [
                {x: 180, y: nowY + 30},
                {type: 'Q', cx: 180, cy: nowY, x: 215, y: nowY},
                {type: 'Q', cx: 250, cy: nowY, x: 250, y: nowY + 30}
            ], YELLOW, delay10, dur10);

            // O - right arc
            const dur11 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay11 = delay10 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start11 = config.motion.randomStart ? getRandomStart() : { x: 800, y: nowY + 30 };
            addLine(start11.x, start11.y, [
                {x: 250, y: nowY + 30},
                {type: 'Q', cx: 250, cy: nowY + 60, x: 215, y: nowY + 60},
                {type: 'Q', cx: 180, cy: nowY + 60, x: 180, y: nowY + 30}
            ], YELLOW, delay11, dur11);

            // W - first stroke
            const dur12 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay12 = delay11 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start12 = config.motion.randomStart ? getRandomStart() : { x: -150, y: nowY + 20 };
            addLine(start12.x, start12.y, [
                {x: 280, y: nowY},
                {x: 300, y: nowY + 60}
            ], YELLOW, delay12, dur12);

            // W - second stroke
            const dur13 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay13 = delay12 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start13 = config.motion.randomStart ? getRandomStart() : { x: -100, y: nowY + 40 };
            addLine(start13.x, start13.y, [
                {x: 300, y: nowY + 60},
                {x: 320, y: nowY + 30}
            ], YELLOW, delay13, dur13);

            // W - third stroke
            const dur14 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay14 = delay13 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start14 = config.motion.randomStart ? getRandomStart() : { x: 800, y: nowY + 40 };
            addLine(start14.x, start14.y, [
                {x: 320, y: nowY + 30},
                {x: 340, y: nowY + 60}
            ], YELLOW, delay14, dur14);

            // W - fourth stroke
            const dur15 = Random.varyPercent(BASE_DURATION, config.timing.durationVariance);
            const delay15 = delay14 + Random.varyPercent(BASE_STAGGER, config.timing.staggerVariance);
            const start15 = config.motion.randomStart ? getRandomStart() : { x: 800, y: nowY + 20 };
            addLine(start15.x, start15.y, [
                {x: 340, y: nowY + 60},
                {x: 360, y: nowY}
            ], YELLOW, delay15, dur15);
        }

        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            lines.forEach(line => line.update(elapsed));

            const allDone = lines.every(l => l.foldComplete);
            if (!allDone) {
                requestAnimationFrame(animate);
            }
        }

        function restart() {
            initializeParameters();  // Regenerate all random parameters
            startTime = null;
            requestAnimationFrame(animate);
        }

        if (prefersReducedMotion) {
            initializeParameters();
            lines.forEach(line => {
                line.foldComplete = true;
                line.path.style.opacity = '1';
                let d = `M ${line.points[0].x} ${line.points[0].y}`;
                for (let i = 1; i < line.points.length; i++) {
                    const point = line.points[i];
                    if (point.type === 'Q') {
                        d += ` Q ${point.cx} ${point.cy} ${point.x} ${point.y}`;
                    } else {
                        d += ` L ${point.x} ${point.y}`;
                    }
                }
                line.path.setAttribute('d', d);
            });
        } else {
            initializeParameters();
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', restart);
    </script>
</body>
</html>
