<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Wave Ripple Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .logo-part {
            transform-origin: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-part {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="svg" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff2d75;stop-opacity:1" />
                </linearGradient>
            </defs>

            <path class="logo-part" d="M 40 40 L 40 160 L 100 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            <circle class="logo-part" cx="150" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
            <circle class="logo-part" cx="240" cy="100" r="40" stroke="#7b2ff7" stroke-width="12" fill="none" filter="drop-shadow(0 0 8px #7b2ff7)"/>
            <path class="logo-part" d="M 300 160 L 300 40 L 350 100 L 400 40 L 400 160" stroke="#ff2d75" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 8px #ff2d75)"/>
            <path class="logo-part" d="M 480 60 A 20 20 0 1 1 479.99 60.01 M 480 80 L 480 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
            <path class="logo-part" d="M 560 60 A 20 20 0 1 1 559.99 60.01 M 560 80 L 560 160" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 8px #00d4ff)"/>
        </svg>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const parts = document.querySelectorAll('.logo-part');

            let startTime = null;
            const duration = 3000;
            const waveCount = 2;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                parts.forEach((part, index) => {
                    const time = elapsed / 1000;
                    const wavePhase = (index / parts.length) * Math.PI * 2 * waveCount;

                    const y = Math.sin(time * 3 + wavePhase) * 20 * Math.max(0, 1 - elapsed / duration);
                    const scale = 1 + Math.sin(time * 2 + wavePhase) * 0.15 * Math.max(0, 1 - elapsed / duration);

                    const bbox = part.getBBox();
                    const centerX = bbox.x + bbox.width / 2;
                    const centerY = bbox.y + bbox.height / 2;

                    part.style.transformOrigin = `${centerX}px ${centerY}px`;
                    part.style.transform = `translateY(${y}px) scale(${scale})`;
                });

                if (elapsed < duration) {
                    requestAnimationFrame(animate);
                } else {
                    parts.forEach(part => {
                        part.style.transform = 'none';
                    });
                }
            }

            function restart() {
                startTime = null;
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
            document.body.addEventListener('click', restart);
        }
    </script>
</body>
</html>
