<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do More Now - Glitch Animation (Procedural)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 100%; max-width: 1000px; padding: 20px; position: relative; }
        .text-container { position: relative; text-align: center; }
        .text { font-size: 80px; font-weight: 900; line-height: 1.2; position: relative; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        .line { display: block; }
        .line1 { color: #ff2d2d; }
        .line2 { color: #ff6b00; }
        .line3 { color: #ffdd00; }
        .glitch-layer { position: absolute; top: 0; left: 0; right: 0; opacity: 0; mix-blend-mode: screen; }
        .glitch-r { color: #ff0000; }
        .glitch-g { color: #00ff00; }
        .glitch-b { color: #0000ff; }
        .scanline { position: absolute; top: 0; left: 0; right: 0; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 0, 0.03) 2px, rgba(0, 255, 0, 0.03) 4px); pointer-events: none; opacity: 0; }
        @media (prefers-reduced-motion: reduce) { .glitch-layer, .scanline { display: none !important; } .text { animation: none !important; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div>
            <div class="glitch-layer glitch-r"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="glitch-layer glitch-g"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="glitch-layer glitch-b"><div class="text"><span class="line line1">DO</span><span class="line line2">MORE</span><span class="line line3">NOW</span></div></div>
            <div class="scanline"></div>
        </div>
    </div>
    <script src="../shared/controls.js"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Read URL parameters from gallery editor
        const urlParams = new URLSearchParams(window.location.search);
        const paramDuration = urlParams.get('duration');
        const paramHueShift = urlParams.get('hueShift');
        const paramHoldDuration = urlParams.get('holdDuration');

        const Random = { range: (min, max) => min + Math.random() * (max - min), int: (min, max) => Math.floor(Random.range(min, max + 1)) };

        // Variables that will be regenerated on each restart
        let config;

        function initializeParameters() {
            config = {
                rgbOffset: [Random.range(2, 10), Random.range(-10, -2), Random.range(1, 8)],
                jitter: Random.range(5, 25),
                skewRange: Random.range(3, 15),
                scanOpacity: Random.range(0.2, 0.8),
                glitchDur: Random.range(800, 1600),
                totalDur: Random.range(1500, 2500),
                hueShift: Random.range(-60, 60),
                satShift: Random.range(-30, 30),
                lightShift: Random.range(-15, 15),
                frequency: Random.range(0.08, 0.15)
            };
            console.log('Procedural glitch config:', config);

            // Apply color shifts
            document.querySelectorAll('.line1').forEach(el => el.style.color = `hsl(${config.hueShift}, ${100 + config.satShift}%, ${59 + config.lightShift}%)`);
            document.querySelectorAll('.line2').forEach(el => el.style.color = `hsl(${25 + config.hueShift}, ${100 + config.satShift}%, ${50 + config.lightShift}%)`);
            document.querySelectorAll('.line3').forEach(el => el.style.color = `hsl(${50 + config.hueShift}, ${100 + config.satShift}%, ${50 + config.lightShift}%)`);
        }

        
        // Update text content from path data
        function updateTextFromPaths(pathData) {
            // This animation accepts dynamic text paths via postMessage
            // The gallery editor sends path data when "Generate" is clicked
            console.log('Received text paths:', pathData);
        }

        // Listen for messages from parent (gallery editor)
        window.addEventListener('message', function(event) {
            // Validate origin - allow same origin and localhost dev servers
            const allowedOrigins = [
                window.location.origin,
                "http://localhost:8888",
                "http://127.0.0.1:8888",
                "null"  // file:// protocol for local development
            ];

            if (!allowedOrigins.includes(event.origin)) {
                console.warn("Rejected postMessage from unauthorized origin:", event.origin);
                return;
            }

            if (event.data && event.data.type === 'updateTextPaths') {
                updateTextFromPaths(event.data.pathData);
            }
        });

        if (!prefersReducedMotion) {
            const text = document.querySelector('.text');
            const glitchLayers = document.querySelectorAll('.glitch-layer');
            const scanline = document.querySelector('.scanline');

            let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
            let exitStartTime = null;
            let holdTimeout = null;
            const HOLD_DURATION = paramHoldDuration ? parseInt(paramHoldDuration) : 2000;
            const EXIT_DURATION = 250;

            let startTime = null;

            function easeInCubic(t) {
                return t * t * t;
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (animationState === 'entrance') {
                    if (elapsed < config.glitchDur) {
                        const intensity = 1 - (elapsed / config.glitchDur);
                        glitchLayers.forEach((layer, i) => {
                            layer.style.opacity = intensity * Random.range(0.5, 0.9);
                            const offset = config.rgbOffset[i] || 0;
                            layer.style.transform = `translate(${offset * intensity}px, ${offset * 0.5 * intensity}px)`;
                        });
                        scanline.style.opacity = intensity * config.scanOpacity;
                        const jitterX = (Math.random() - 0.5) * config.jitter * intensity;
                        const jitterY = (Math.random() - 0.5) * config.jitter * intensity;
                        const skewX = (Math.random() - 0.5) * config.skewRange * intensity;
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px) skewX(${skewX}deg)`;
                        if (Math.random() < config.frequency) {
                            text.style.transform += ` scaleY(${Random.range(0.95, 1.05)})`;
                        }
                        requestAnimationFrame(animate);
                    } else if (elapsed < config.totalDur) {
                        const stabilize = (elapsed - config.glitchDur) / (config.totalDur - config.glitchDur);
                        glitchLayers.forEach(layer => { layer.style.opacity = (1 - stabilize) * 0.4; });
                        scanline.style.opacity = (1 - stabilize) * 0.4;
                        const jitterX = (Math.random() - 0.5) * 4 * (1 - stabilize);
                        const jitterY = (Math.random() - 0.5) * 4 * (1 - stabilize);
                        text.style.transform = `translate(${jitterX}px, ${jitterY}px)`;
                        requestAnimationFrame(animate);
                    } else {
                        glitchLayers.forEach(layer => { layer.style.opacity = 0; });
                        scanline.style.opacity = 0; text.style.transform = 'none';
                        animationState = 'hold';
                    holdTimeout = setTimeout(startExit, HOLD_DURATION);
                    }
                } else if (animationState === 'exit') {
                    const exitElapsed = timestamp - exitStartTime;
                    const exitProgress = Math.min(1, exitElapsed / EXIT_DURATION);
                    const eased = easeInCubic(exitProgress);

                    // Intense glitch burst then fade
                    const intensity = 1 - eased;
                    glitchLayers.forEach((layer, i) => {
                        layer.style.opacity = intensity * Random.range(0.7, 1);
                        const offset = (config.rgbOffset[i] || 0) * 3;
                        layer.style.transform = `translate(${offset * Random.range(-1, 1)}px, ${offset * Random.range(-1, 1)}px)`;
                    });
                    scanline.style.opacity = intensity;
                    const jitterX = (Math.random() - 0.5) * config.jitter * 3 * intensity;
                    const jitterY = (Math.random() - 0.5) * config.jitter * 3 * intensity;
                    const skewX = (Math.random() - 0.5) * config.skewRange * 2 * intensity;
                    text.style.transform = `translate(${jitterX}px, ${jitterY}px) skewX(${skewX}deg)`;
                    text.style.opacity = intensity;

                    if (exitProgress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        restart();
                    }
                }
            }

            function startExit() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'exit';
                exitStartTime = performance.now();
                requestAnimationFrame(animate);
            }

            function restart() {
            if (holdTimeout) clearTimeout(holdTimeout);
            animationState = 'entrance';
                initializeParameters();  // Regenerate all random parameters
                startTime = null;
                exitStartTime = null;
                text.style.transform = 'none';
                text.style.opacity = 1;
                glitchLayers.forEach(layer => { layer.style.opacity = 0; });
                scanline.style.opacity = 0;
                requestAnimationFrame(animate);
            }

            initializeParameters();
            requestAnimationFrame(animate);
            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            initializeParameters();
        }
    </script>
</body>
</html>
