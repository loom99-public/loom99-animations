<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom99 Logo - Typewriter Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .logo-text {
            font-size: 100px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
            position: relative;
        }

        .letter {
            opacity: 0;
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 100px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            margin-left: 4px;
            animation: blink 0.7s infinite, pulse 1.5s ease-in-out infinite;
            vertical-align: text-bottom;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.1); }
        }

        @keyframes letterPop {
            0% { transform: scale(1.3) translateY(-5px); }
            50% { transform: scale(0.9) translateY(2px); }
            100% { transform: scale(1) translateY(0); }
        }

        .letter-pop {
            animation: letterPop 0.3s ease-out;
        }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1 !important;
                animation: none !important;
            }
            .cursor {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text" id="logo">
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const text = 'loom99';
        const logo = document.getElementById('logo');

        let animationState = 'entrance'; // 'entrance', 'hold', 'exit'
        let currentIndex = 0;
        let exitIndex = 0;
        const CHAR_DELAY = 120;
        const EXIT_CHAR_DELAY = 25;

        if (!prefersReducedMotion) {
            function typeCharacter() {
                if (currentIndex >= text.length) {
                    // Typing complete
                    animationState = 'hold';
                    const cursor = logo.querySelector('.cursor');
                    setTimeout(() => {
                        cursor.style.display = 'none';
                    }, 1000);
                    return;
                }

                const char = text[currentIndex];
                const span = document.createElement('span');
                span.className = 'letter letter-pop';
                span.textContent = char;
                span.style.opacity = '1';

                const cursor = logo.querySelector('.cursor');
                logo.insertBefore(span, cursor);

                // Remove pop animation class after animation completes
                setTimeout(() => {
                    span.classList.remove('letter-pop');
                }, 300);

                currentIndex++;
                setTimeout(typeCharacter, CHAR_DELAY);
            }

            function deleteCharacter() {
                const letters = logo.querySelectorAll('.letter');

                if (exitIndex >= letters.length) {
                    // Deletion complete - restart
                    restart();
                    return;
                }

                const letter = letters[letters.length - 1 - exitIndex];
                letter.style.opacity = '0';
                letter.style.transform = 'scale(0.5)';
                letter.style.transition = 'all 0.1s ease-out';

                setTimeout(() => {
                    letter.remove();
                }, 100);

                exitIndex++;
                setTimeout(deleteCharacter, EXIT_CHAR_DELAY);
            }

            function startExit() {
                if (animationState !== 'hold') return;

                animationState = 'exit';
                exitIndex = 0;

                const cursor = logo.querySelector('.cursor');
                cursor.style.display = 'inline-block';

                deleteCharacter();
            }

            function restart() {
                currentIndex = 0;
                exitIndex = 0;
                animationState = 'entrance';

                const letters = logo.querySelectorAll('.letter');
                letters.forEach(letter => letter.remove());

                const cursor = logo.querySelector('.cursor');
                cursor.style.display = 'inline-block';

                setTimeout(typeCharacter, 500);
            }

            setTimeout(typeCharacter, 500);

            document.body.addEventListener('click', () => {
                if (animationState === 'hold') {
                    startExit();
                } else if (animationState === 'entrance') {
                    restart();
                }
            });
        } else {
            // Show all text immediately
            const cursor = logo.querySelector('.cursor');
            cursor.style.display = 'none';

            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.opacity = '1';
                logo.insertBefore(span, cursor);
            });
        }
    </script>
</body>
</html>
