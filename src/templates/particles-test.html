<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Engine Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
        }

        .controls label {
            display: block;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        .reduced-motion-text {
            display: none;
            font-size: 60px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (prefers-reduced-motion: reduce) {
            canvas {
                display: none;
            }
            .reduced-motion-text {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <strong>Particle Engine Test</strong><br>
        <label>
            <input type="radio" name="variance" value="none" checked> Original (none)
        </label>
        <label>
            <input type="radio" name="variance" value="moderate"> Varied (moderate)
        </label>
        <label>
            <input type="radio" name="variance" value="heavy"> Procedural (heavy)
        </label>
        <label>
            <input type="radio" name="target" value="logo" checked> Logo
        </label>
        <label>
            <input type="radio" name="target" value="text"> Text
        </label>
        <button id="restart">Restart</button>
    </div>

    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="reduced-motion-text">loom99</div>
    </div>

    <div class="info">
        State: <span id="state">-</span><br>
        Formation: <span id="formation">-</span><br>
        Behavior: <span id="behavior">-</span><br>
        Particles: <span id="count">-</span><br>
        Click to advance to exit
    </div>

    <!-- NOTE: In production, this would be compiled from TypeScript -->
    <script type="module">
        // This is a MOCK implementation to demonstrate the concept
        // Real implementation would import from compiled engines/ParticleEngine.js

        console.warn('⚠️ This is a MOCK implementation - engines need to be compiled from TypeScript first');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stateDisplay = document.getElementById('state');
        const formationDisplay = document.getElementById('formation');
        const behaviorDisplay = document.getElementById('behavior');
        const countDisplay = document.getElementById('count');
        const restartBtn = document.getElementById('restart');

        canvas.width = 600;
        canvas.height = 200;

        // URL params for easy testing
        const urlParams = new URLSearchParams(window.location.search);
        const variance = urlParams.get('variance') || 'none';
        const target = urlParams.get('target') || 'logo';

        // Set radio buttons from URL params
        document.querySelector(`input[name="variance"][value="${variance}"]`).checked = true;
        document.querySelector(`input[name="target"][value="${target}"]`).checked = true;

        // Mock configuration generator
        function generateConfig() {
            const variance = document.querySelector('input[name="variance"]:checked').value;
            const target = document.querySelector('input[name="target"]:checked').value;

            const CYAN = '#00d4ff';
            const PURPLE = '#7b2ff7';
            const PINK = '#ff2d75';

            // Determine formation pattern
            let formation = 'center-explosion';
            if (variance === 'moderate') {
                formation = randomPick(['center-explosion', 'top-rain', 'side-converge']);
            } else if (variance === 'heavy') {
                formation = 'random';
            }

            // Determine behavior
            let behavior = 'linear';
            if (variance === 'heavy') {
                behavior = randomPick(['linear', 'spiral', 'wave', 'bounce']);
            }

            const basePaths = target === 'logo' ? [
                { d: 'M 40 40 L 40 160 L 100 160', color: CYAN },
                { d: 'M 150 60 A 40 40 0 1 1 149.99 60.01', color: PURPLE },
                { d: 'M 240 60 A 40 40 0 1 1 239.99 60.01', color: PURPLE },
                { d: 'M 300 160 L 300 40 L 350 100 L 400 40 L 400 160', color: PINK },
                { d: 'M 460 70 C 460 45, 500 45, 500 70 C 500 95, 460 95, 460 70 M 500 70 C 500 95, 495 130, 475 155', color: CYAN },
                { d: 'M 540 70 C 540 45, 580 45, 580 70 C 580 95, 540 95, 540 70 M 580 70 C 580 95, 575 130, 555 155', color: CYAN }
            ] : [
                // Text paths would be different
                { d: 'M 50 100 L 150 100', color: CYAN }
            ];

            const config = {
                canvasWidth: 600,
                canvasHeight: 200,
                variance: variance,
                timing: {
                    enabled: variance !== 'none',
                    duration: variance === 'heavy' ? randomRange(1500, 2500) : 2000,
                    holdDuration: 2000,
                    exitDuration: 250,
                    durationVariance: variance === 'moderate' ? 0.15 : 0
                },
                colors: {
                    enabled: variance !== 'none',
                    hueShift: variance === 'heavy' ? randomRange(-60, 60) : (variance === 'moderate' ? randomRange(-15, 15) : 0)
                },
                appearance: {
                    enabled: variance !== 'none',
                    baseSize: 2.5,
                    sizeRange: variance === 'heavy' ? [1, 4] : [2.5, 2.5],
                    sizeVariance: variance === 'moderate' ? 0.2 : 0,
                    glowRadius: 8,
                    glowVariance: variance === 'heavy' ? 7 : (variance === 'moderate' ? 2 : 0)
                },
                motion: {
                    enabled: variance !== 'none',
                    formation: formation,
                    behavior: behavior,
                    spacing: 4,
                    spacingVariance: variance === 'moderate' ? 0.15 : 0,
                    countMultiplier: variance === 'heavy' ? randomRange(0.7, 1.3) : 1
                },
                paths: basePaths,
                loop: true,
                prefersReducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
            };

            formationDisplay.textContent = formation;
            behaviorDisplay.textContent = behavior;

            return config;
        }

        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function randomPick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Mock engine (simplified version)
        class MockParticleEngine {
            constructor(canvas, config) {
                this.canvas = canvas;
                this.config = config;
                this.state = 'entrance';
                this.particleCount = 0;

                // Estimate particle count
                this.particleCount = config.paths.length * 50; // Rough estimate
                countDisplay.textContent = this.particleCount;

                console.log('Created particle engine with config:', config);

                // Draw something to show it's "working"
                this.drawMock();
            }

            drawMock() {
                const ctx = this.canvas.getContext('2d');
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw mock particles in formation
                ctx.fillStyle = '#00d4ff';
                for (let i = 0; i < 100; i++) {
                    const x = Math.random() * this.canvas.width;
                    const y = Math.random() * this.canvas.height;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw center text
                ctx.fillStyle = '#fff';
                ctx.font = '20px -apple-system';
                ctx.textAlign = 'center';
                ctx.fillText('MOCK PARTICLES', this.canvas.width / 2, this.canvas.height / 2);
                ctx.fillText('(Compile engines to see real animation)', this.canvas.width / 2, this.canvas.height / 2 + 25);
            }

            start() {
                this.updateState('entrance');
                console.log('Engine started');
            }

            startExit() {
                this.updateState('exit');
                console.log('Starting exit');
            }

            restart() {
                this.updateState('entrance');
                console.log('Restarting');
            }

            getState() {
                return this.state;
            }

            updateState(newState) {
                this.state = newState;
                stateDisplay.textContent = newState;
            }

            destroy() {
                console.log('Engine destroyed');
            }
        }

        let engine = null;

        function initEngine() {
            if (engine) {
                engine.destroy();
            }

            const config = generateConfig();
            engine = new MockParticleEngine(canvas, config);
            engine.start();
        }

        // Initialize
        initEngine();

        // Event listeners
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                initEngine();
            });
        });

        restartBtn.addEventListener('click', () => {
            if (engine) {
                // For varied/heavy, regenerate config
                if (engine.config.variance !== 'none') {
                    initEngine();
                } else {
                    engine.restart();
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (engine && engine.getState() === 'hold') {
                engine.startExit();
            }
        });

        console.log('%c📝 Note: This template demonstrates the ENGINE CONCEPT', 'font-size: 14px; color: #00d4ff');
        console.log('%cTo see it working, compile TypeScript engines first:', 'font-size: 12px');
        console.log('%c  cd src/engines && tsc ParticleEngine.ts', 'font-size: 11px; color: #888');
    </script>
</body>
</html>
